<style>
	/* Layout: GOV.UK page with scenarios in a side navigation (one quarter) and the replay (three quarters):
		heading, step slider, a three-lane sequence diagram like the RFC's, then the detail of the current step.
		Light only, matching GOV.UK. Colours are GOV.UK palette values. */
	:root {
		--text: #0b0c0c;
		--secondary-text: #505a5f;
		--border: #b1b4b6;
		--light-grey: #f3f2f1;
		--blue: #1d70b8;
		--dark-blue: #003078;
		--green: #00703c;
		--purple: #4c2c92;
		--white: #ffffff;
		--font-mono: ui-monospace, "SF Mono", menlo, consolas, monospace;
	}

	html {
		background: var(--white);
	}

	body {
		margin: 0;
		background: var(--white);
		color: var(--text);
		font-family: "GDS Transport", arial, sans-serif;
		-webkit-font-smoothing: antialiased;
	}

	/* GOV.UK's mobile margin is 15px; keep at least 16px and clear any side system bar. */
	.govuk-width-container {
		margin-left: max(16px, env(safe-area-inset-left, 0px));
		margin-right: max(16px, env(safe-area-inset-right, 0px));
	}

	@media (min-width: 40.0625em) {
		.govuk-width-container {
			margin-left: max(30px, env(safe-area-inset-left, 0px));
			margin-right: max(30px, env(safe-area-inset-right, 0px));
		}
	}

	@media (min-width: 1020px) {
		.govuk-width-container {
			margin-left: auto;
			margin-right: auto;
		}
	}

	.govuk-link:visited {
		color: var(--blue);
	}

	/* Side navigation, after the GOV.UK Design System website's own. */
	.app-side-nav {
		list-style: none;
		margin: 0 0 30px;
		padding: 0;
	}

	.app-side-nav__item {
		padding: 8px 0 8px 12px;
		border-left: 4px solid transparent;
	}

	.app-side-nav__item--current {
		border-left-color: var(--blue);
		background: var(--light-grey);
	}

	.app-side-nav__item a {
		font-weight: 700;
	}

	.app-side-nav__item--current a {
		color: var(--text);
		text-decoration: none;
	}

	.app-side-nav__hint {
		display: block;
		margin-top: 2px;
		color: var(--secondary-text);
		font-size: 1rem;
		line-height: 1.3;
	}

	/* Step slider */
	.app-stepper {
		display: grid;
		grid-template-columns: auto minmax(0, 1fr) auto;
		align-items: center;
		gap: 15px;
		margin-bottom: 30px;
	}

	.app-stepper .govuk-button {
		margin: 0;
	}

	.app-stepper__range {
		display: grid;
		gap: 5px;
	}

	.app-stepper__range .govuk-label {
		margin: 0;
		font-variant-numeric: tabular-nums;
	}

	.app-stepper input[type="range"] {
		width: 100%;
		margin: 0;
		accent-color: var(--blue);
		cursor: pointer;
	}

	.app-stepper input[type="range"]:focus-visible {
		outline: 3px solid #ffdd00;
		outline-offset: 2px;
	}

	@media (max-width: 40.0525em) {
		.app-stepper {
			grid-template-columns: 1fr 1fr;
		}

		.app-stepper__range {
			grid-column: 1 / -1;
			grid-row: 1;
		}
	}

	/* Sequence diagram: three lanes with dashed lifelines, as in the RFC. */
	.app-sequence {
		position: relative;
		margin-bottom: 30px;
		padding-bottom: 10px;
		background-image:
			linear-gradient(var(--border) 50%, transparent 50%),
			linear-gradient(var(--border) 50%, transparent 50%),
			linear-gradient(var(--border) 50%, transparent 50%);
		background-size: 1px 8px;
		background-repeat: repeat-y;
		background-position: 16.666% 0, 50% 0, 83.333% 0;
	}

	.app-sequence__lanes {
		display: grid;
		grid-template-columns: repeat(3, minmax(0, 1fr));
		gap: 10px;
		padding-bottom: 10px;
		background: var(--white);
	}

	.app-sequence__lane {
		padding: 8px 4px;
		border: 2px solid var(--text);
		background: var(--white);
		font-weight: 700;
		text-align: center;
		overflow-wrap: anywhere;
	}

	.app-sequence__row {
		position: relative;
		min-height: 52px;
	}

	.app-sequence__row[hidden] {
		display: none;
	}

	.app-arrow {
		position: absolute;
		bottom: 12px;
		height: 0;
		border-top: 2px solid currentColor;
		color: var(--secondary-text);
	}

	.app-arrow--reply {
		border-top-style: dashed;
	}

	.app-arrow::after {
		content: "";
		position: absolute;
		top: -7px;
		width: 0;
		height: 0;
		border-top: 6px solid transparent;
		border-bottom: 6px solid transparent;
	}

	.app-arrow--right::after {
		right: -2px;
		border-left: 10px solid currentColor;
	}

	.app-arrow--left::after {
		left: -2px;
		border-right: 10px solid currentColor;
	}

	.app-arrow__label {
		position: absolute;
		bottom: 18px;
		left: 6px;
		right: 6px;
		color: var(--text);
		font-size: 1rem;
		line-height: 1.25;
		text-align: center;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.app-note {
		position: relative;
		left: 50%;
		width: min(60%, 260px);
		margin: 6px 0;
		padding: 6px 10px;
		transform: translateX(-50%);
		border: 2px solid var(--secondary-text);
		background: var(--white);
		text-align: center;
	}

	.app-note .govuk-tag {
		margin: 0;
	}

	.app-sequence__row.is-current .app-arrow,
	.app-sequence__row.is-current .app-note {
		color: var(--blue);
		border-color: var(--blue);
	}

	.app-sequence__row.is-current .app-arrow__label {
		color: var(--blue);
		font-weight: 700;
	}

	/* Current step detail */
	.app-step {
		padding-top: 20px;
		border-top: 1px solid var(--border);
	}

	.app-quote {
		margin: 0 0 20px;
		padding: 15px;
		border-left: 10px solid var(--border);
		font-size: 1.1875rem;
		line-height: 1.3;
	}

	.app-quote p,
	.app-quote ul {
		margin: 0 0 10px;
	}

	.app-quote > :last-child {
		margin-bottom: 0;
	}

	.app-quote ul {
		padding-left: 20px;
	}

	.app-request {
		margin-bottom: 30px;
		font-size: 1.5rem;
		line-height: 1.25;
	}

	.app-point {
		margin-top: -10px;
		margin-bottom: 30px;
		color: var(--secondary-text);
	}

	.app-next .govuk-tag {
		margin-right: 4px;
	}

	.app-next {
		position: relative;
		width: fit-content;
		max-width: 100%;
		margin: 4px auto 8px;
		padding: 0 6px;
		background: var(--white);
		color: var(--secondary-text);
		font-size: 1rem;
		text-align: center;
	}

	.app-code {
		margin: 0 0 10px;
		padding: 15px;
		max-height: 440px;
		overflow: auto;
		background: var(--light-grey);
		font-family: var(--font-mono);
		font-size: 0.875rem;
		line-height: 1.5;
		white-space: pre-wrap;
		overflow-wrap: anywhere;
	}

	.app-code .k { color: var(--dark-blue); }
	.app-code .s { color: var(--green); }
	.app-code .n { color: var(--purple); }

	.app-code-caption {
		margin-bottom: 20px;
		color: var(--secondary-text);
	}

	.app-footer-prompt {
		margin: 0 0 15px;
		padding: 15px;
		background: var(--light-grey);
		font-family: var(--font-mono);
		font-size: 0.875rem;
		white-space: pre-wrap;
	}

</style>

<section class="govuk-service-navigation" aria-label="Service information">
	<div class="govuk-width-container">
		<div class="govuk-service-navigation__container">
			<span class="govuk-service-navigation__service-name">
				<span class="govuk-service-navigation__text">Agentic Legibility: Journey Search</span>
			</span>
		</div>
	</div>
</section>

<div class="govuk-width-container">

"search_response", "status": "success", "json": {"candidates": [{"workflow_id": "265578", "title": "EU Alignment – Plant Passport EOI", "description": "Register interest in additional 2026 growing season inspections for EU Plant Passport alignment, if you are already authorised to issue UK Plant Passports. Collects business and contact details, agreement to the EU alignment declaration, and which listed plants you grow or want to move to Northern Ireland or Ireland."}, {"workflow_id": "267100", "title": "New starter", "description": "Request a building security pass for a new starter at Welsh Government offices or tenant organisations. Collects the starter's name, start date, organisation, optional HRIS reference and vetting clearance details, and an uploaded passport-style photo."}, {"workflow_id": "265949", "title": "Request to restore and renew a registration (TM13)", "description": "Request restoration and renewal of a lapsed UK trade mark whose renewal date was 6 to 12 months ago. Give the trade mark number, classes to renew and a statement explaining the missed renewal, then pay the restoration and renewal fees by card or deposit account."}, {"workflow_id": "264758", "title": "Immigration Enforcement – first reporting event: Middlesborough", "description": "Provide personal, household, health, work and identity details before a first immigration reporting appointment at Middlesborough Reporting Centre, using a CEPR or UAN. Also lets you say whether you want voluntary return help and upload passport or ID."}, {"workflow_id": "563", "title": "Expression of interest to become authorised to issue Plant Passports", "description": "Register interest in becoming authorised to issue UK Plant Passports. Collects the business trading name, head office address, the person responsible for plant passporting, contact phone and email, and an optional APHA customer reference number."}]}}, {"kind": "search_request", "input": {"query": "apply for or renew a UK adult British passport", "limit": 10}}, {"kind": "search_response", "status": "success", "json": {"candidates": [{"workflow_id": "263326", "title": "Report a change of contact details for a settled adult", "description": "Report a change of mobile number or email address for an adult in a resettled family, on behalf of a local authority. Only for people in the 3-year Afghan scheme or 5-year UK Resettlement Scheme support period, and it needs your region's referral code."}, {"workflow_id": "3139", "title": "Apply for an emergency travel document (first time applicant)", "description": "Apply for an emergency travel document from abroad if you have never held a UK passport issued since 1 January 2006 and have an urgent, unplanned reason to travel. Collects applicant and contact details, location and a summary of exceptional circumstances, for yourself or someone else."}, {"workflow_id": "563", "title": "Expression of interest to become authorised to issue Plant Passports", "description": "Register interest in becoming authorised to issue UK Plant Passports. Collects the business trading name, head office address, the person responsible for plant passporting, contact phone and email, and an optional APHA customer reference number."}, {"workflow_id": "265578", "title": "EU Alignment – Plant Passport EOI", "description": "Register interest in additional 2026 growing season inspections for EU Plant Passport alignment, if you are already authorised to issue UK Plant Passports. Collects business and contact details, agreement to the EU alignment declaration, and which listed plants you grow or want to move to Northern Ireland or Ireland."}, {"workflow_id": "265949", "title": "Request to restore and renew a registration (TM13)", "description": "Request restoration and renewal of a lapsed UK trade mark whose renewal date was 6 to 12 months ago. Give the trade mark number, classes to renew and a statement explaining the missed renewal, then pay the restoration and renewal fees by card or deposit account."}, {"workflow_id": "264774", "title": "Get help with your citizenship or certificate of entitlement application", "description": "Contact the Home Office for help with a British citizenship application, certificate of entitlement application or renunciation of citizenship, such as updates, refunds, returns of documents or certificate corrections. Can be completed on behalf of someone else, with a letter of authority."}, {"workflow_id": "263055", "title": "Apply to renew your authorisation to provide Driver CPC part 3a tests", "description": "Renew DVSA authorisation to provide Driver CPC part 3a tests, as the organisation's responsible person. Collects organisation and contact details, plus the assessor's photo, examiner number, driving licence number, licence points and work site addresses."}, {"workflow_id": "5830", "title": "Apply to renew annual Northern Ireland plant health label (NIPHL) scheme authorisation", "description": "Renew an existing annual Northern Ireland plant health label (NIPHL) scheme authorisation. Collects business and contact details, the authorisation number, and declarations for any plants for planting, used agricultural and forestry machinery, or seed potatoes already authorised. Not for first-time applications."}, {"workflow_id": "264657", "title": "Register for an account", "description": "Register an account for yourself if you are aged 16 or over, giving your name, date of birth, address, phone number and National Insurance number, plus a Welsh language contact preference. One form per person; under-16s need a separate child account form."}, {"workflow_id": "6482", "title": "Feedback on the Great British Insulation Scheme (GBIS)", "description": "Give feedback on the Great British Insulation Scheme (GBIS) portal by rating your satisfaction from very satisfied to very dissatisfied, and optionally suggest how the scheme could be improved. Collects no payment or personal details."}]}}, {"kind": "reply", "text": "I couldn't find a service for renewing a standard UK passport. The catalogue I can search doesn't include it.\n\nThe closest match was an emergency travel document for first-time applicants abroad. That doesn't fit a renewal, so I haven't suggested it.\n\nPassport renewals are normally done on the official GOV.UK passport service. Search GOV.UK for \"renew adult passport\" to find it.\n\nIf you're abroad and urgently need to travel, tell me. I can look for emergency options.", "decision": "do_not_route"}]}, {"id": "travel", "label": "Information question", "point": "Deciding when to search belongs to the orchestrator. This is a question rather than something a service journey does, so it does not search Legibility.", "response_notes": null, "events": [{"kind": "citizen", "text": "What's the FCDO travel advice for Spain?"}, {"kind": "reply", "text": "I can't look up travel advice here, and it changes often. The current FCDO advice for Spain is on GOV.UK at **gov.uk/foreign-travel-advice/spain**. It covers entry requirements, safety and security, health, and local laws.\n\nI can also help you find a government form to complete, if you need one.", "decision": "no_search"}]}]};

	const DECISIONS = {
		execute: { label: 'Execute', tag: 'govuk-tag--green' },
		clarify: { label: 'Clarify', tag: 'govuk-tag--yellow' },
		do_not_route: { label: 'Do not route', tag: 'govuk-tag--red' },

	const escapeHtml = (text) => String(text)
		.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

	const truncate = (text, length) => text.length > length ? text.slice(0, length - 1) + '…' : text;

	/** Pretty-printed JSON with keys, strings and numbers marked for colour. */
	function renderJson(value) {
		const json = JSON.stringify(value, null, 2);
		const token = /("(?:\\.|[^"\\])*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
		let html = '';
		let last = 0;
		for (const match of json.matchAll(token)) {
			const [whole, str, colon, num] = match;
			html += escapeHtml(json.slice(last, match.index));
			if (num) html += `<span class="n">${num}</span>`;
			else if (colon) html += `<span class="k">${escapeHtml(str)}</span>${colon}`;
			else html += `<span class="s">${escapeHtml(str)}</span>`;
			last = match.index + whole.length;
		}
		return html + escapeHtml(json.slice(last));
	}

	/** Enough Markdown for the orchestrator's replies: paragraphs, bullet lists and bold. */
	function renderMarkdown(text) {
		const inline = (s) => escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
		return text.trim().split(/\n{2,}/).map((block) => {
			const lines = block.split('\n');
			if (lines.every((l) => /^\s*[-*] /.test(l))) {
				return '<ul>' + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`).join('') + '</ul>';
			}
			return `<p>${lines.map(inline).join('<br>')}</p>`;
		}).join('');

	// Lanes are at 1/6, 1/2 and 5/6 of the width.

		const full = escapeHtml(label);
		const left = Math.min(LANE[from], LANE[to]);
		const right = 100 - Math.max(LANE[from], LANE[to]);
		const direction = LANE[to] > LANE[from] ? 'right' : 'left';
		return `<div class="app-sequence__row"><div class="app-arrow app-arrow--${direction}${reply ? ' app-arrow--reply' : ''}" ` +
			`style="left: ${left}%; right: ${right}%;"></div><div class="app-arrow__label" style="left: calc(${left}% + 6px); right: calc(${right}% + 6px);" title="${full}">${full}</div></div>`;
	}

		return `<div class="app-sequence__row"><div class="app-note"><strong class="govuk-tag ${d.tag}">${d.label}</strong></div></div>`;
	}

		return `<div class="app-sequence__row"><div class="app-note">${escapeHtml(text)}</div></div>`;

	function namedCandidate(text, candidates) {
		return candidates.find((c) => text.includes(c.title)) || null;

	/**

	function buildSteps(scenario) {

		let searchedThisTurn = false;
		let turn = 0;
		let responses = 0;

		for (const event of scenario.events) {
			if (event.kind === 'citizen') {
				turn += 1;
				searchedThisTurn = false;
				steps.push({
					rows: arrow('citizen', 'orchestrator', `“${event.text}”`),
					title: turn === 1 ? 'The citizen sends a message' : 'The citizen answers',
					body: (turn === 1 ? '' : `<blockquote class="app-quote">${escapeHtml(event.text)}</blockquote>`) +
						`<p class="govuk-body">The orchestrator owns the conversation. ${turn === 1
							? 'It does not know in advance which service journeys exist, and decides for itself whether to search.'
							: 'Journey Search is stateless and keeps nothing between calls, so anything from earlier is up to the orchestrator.'}</p>`,
				});
			}

			if (event.kind === 'search_request') {

				searchedThisTurn = true;
				const limitSet = event.input.limit !== undefined;
				const limit = limitSet ? event.input.limit : 5;
				steps.push({
					rows: arrow('orchestrator', 'search', `Search: “${event.input.query}”`),
					title: again ? 'The orchestrator searches again' : 'The orchestrator searches for service journeys',
					body: (again
						? `<p class="govuk-body">None of the first candidates fitted, so it tries a new query${limitSet ? ' and asks for more candidates' : ''}. Each search is independent: Journey Search keeps nothing from the last one.</p>`
						: `<p class="govuk-body">It writes the query itself, as a self-contained description of the citizen's need.</p>`) +
						`<pre class="app-code">search_service_journeys(\n    query: <span class="s">${escapeHtml(JSON.stringify(event.input.query))}</span>,\n    limit: <span class="n">${limit}</span>\n)</pre>` +
						`<p class="govuk-body-s app-code-caption">${limitSet ? `The orchestrator set the limit to ${limit}.` : 'The orchestrator did not set a limit, so the default of 5 applies.'}</p>`,
				});
			}

			if (event.kind === 'search_response') {
				candidates = event.json.candidates;
				responses += 1;
				steps.push({
					rows: arrow('search', 'orchestrator', `${candidates.length} candidates`, true),
					title: `Journey Search returns ${candidates.length} candidates`,
					body: `<p class="govuk-body">Ranked candidates, each with an ID, title and brief description. Search favours recall over precision: returning a candidate does not mean it is the correct journey. <strong>The orchestrator must evaluate whether each candidate is suitable.</strong></p>` +
						`<p class="govuk-body"></p>` +
						(scenario.response_notes?.[responses - 1] ? `<div class="govuk-inset-text"><strong>In this run:</strong> ${escapeHtml(scenario.response_notes[responses - 1])}</div>` : '') +
						`<pre class="app-code">${renderJson(event.json)}</pre>` +
						`<p class="govuk-body-s app-code-caption">Added to the orchestrator's context: ${sizeOf(event.json)}.</p>`,
				});
			}

			if (event.kind === 'reply') {
				const d = DECISIONS[event.decision];
				const chosen = namedCandidate(event.text, candidates);
				const why = {
					execute: chosen
						? `It judges that <strong>${escapeHtml(chosen.title)}</strong> (workflow ${escapeHtml(chosen.workflow_id)}) fits.${!searchedThisTurn && candidates.length ? ' It chooses from the candidates it already has, without searching again.' : ''} It does not start the journey yet. It replies first, offering the journey to the citizen.`
						: 'It judges that one candidate fits. It does not start the journey yet. It replies first, offering the journey to the citizen.',
					clarify: 'Several candidates could fit, so it asks the citizen. The citizen decides which service they want to use.',
					do_not_route: 'It judges that none of the candidates fits. A high ranking is not evidence that a journey is appropriate.',
					no_search: 'It decides that searching for a service journey is not appropriate, so it makes no request to Journey Search.',
				}[event.decision];
				const handsOff = event.decision === 'do_not_route' || event.decision === 'no_search';
				steps.push({
					rows: {
						execute: noteText('One candidate fits') + arrow('orchestrator', 'citizen', 'Offers the journey') +
							`<div class="app-sequence__row"><p class="app-next"><strong class="govuk-tag ${d.tag}">${d.label}</strong> only if the citizen agrees, outside this contract</p></div>`,
						clarify: note(event.decision) + arrow('orchestrator', 'citizen', 'Asks the citizen'),
						do_not_route: note(event.decision) + '<div class="app-sequence__row"><p class="app-next">Next step outside this contract</p></div>',
						no_search: note(event.decision) + '<div class="app-sequence__row"><p class="app-next">Next step outside this contract</p></div>',
					}[event.decision],
					title: event.decision === 'execute' ? 'The orchestrator offers the journey' : `The orchestrator decides: ${d.label}`,
					body: (event.decision === 'execute' ? '' : `<p class="govuk-body"><strong class="govuk-tag ${d.tag}">${d.label}</strong></p>`) +
						`<p class="govuk-body">${why}</p>` +
						(handsOff
							? `<p class="govuk-body">What it does next is outside this contract. Legibility is one of several capabilities the orchestrator can use, so it might turn to another, such as question answering over GOV.UK${event.decision === 'do_not_route' ? ', or route the citizen to an onward journey with a department' : ''}.</p>`
							: `<h3 class="govuk-heading-s">Reply to the citizen</h3><div class="app-quote">${renderMarkdown(event.text)}</div>`) +
						(event.decision === 'execute'
							? `<h3 class="govuk-heading-s">If the citizen agrees</h3><p class="govuk-body"><strong class="govuk-tag ${d.tag}">${d.label}</strong></p>` +
								`<p class="govuk-body">Only then does the orchestrator start the journey, with a separate call to Legibility's execution interface. That call is outside this contract.</p>`
							: ''),
				});
			}
		}
		return steps;
	}

	// --- State and rendering ---------------------------------------------------

	let scenario = null;
	let steps = [];
	let current = 1;

	function renderStep() {
		const total = steps.length;
		const range = $('step');
		range.max = String(total);
		range.value = String(current);
		$('step-label').textContent = `Step ${current} of ${total}`;
		range.setAttribute('aria-valuetext', `Step ${current} of ${total}: ${steps[current - 1].title}`);
		$('previous').disabled = current <= 1;
		$('next').disabled = current >= total;

		$('sequence').innerHTML = steps.map((s, n) => {
			const state = n + 1 === current ? ' is-current' : '';
			return s.rows.replaceAll('class="app-sequence__row"', `class="app-sequence__row${state}"${n + 1 > current ? ' hidden' : ''}`);
		}).join('');

		const s = steps[current - 1];
		$('detail').innerHTML = `<h2 class="govuk-heading-m">${s.title}</h2>${s.body}`;
	}

	function goTo(step) {
		current = Math.max(1, Math.min(step, steps.length));
		renderStep();
	}

	function selectScenario(id) {
		scenario = DEMO.scenarios.find((s) => s.id === id) || DEMO.scenarios[0];
		steps = buildSteps(scenario);
		const index = DEMO.scenarios.indexOf(scenario);

		$('caption').textContent = `Scenario ${index + 1} of ${DEMO.scenarios.length}`;
		$('title').textContent = scenario.label;
		$('point').textContent = scenario.point;
		$('request').textContent = scenario.events.find((e) => e.kind === 'citizen').text;
		document.querySelectorAll('.app-side-nav__item').forEach((item) => {
			const isCurrent = item.dataset.id === scenario.id;
			item.classList.toggle('app-side-nav__item--current', isCurrent);
			const link = item.querySelector('a');
			if (isCurrent) link.setAttribute('aria-current', 'page');
			else link.removeAttribute('aria-current');
		});
		try { history.replaceState(null, '', '#' + scenario.id); } catch (e) { /* the hash is only a convenience */ }
		goTo(1);
	}

	function init() {
		$('scenario-nav').innerHTML = DEMO.scenarios.map((s) => {
			const first = s.events.find((e) => e.kind === 'citizen').text;
			return `<li class="app-side-nav__item" data-id="${s.id}"><a class="govuk-link" href="#${s.id}">${escapeHtml(s.label)}</a>` +
				`<span class="app-side-nav__hint" title="${escapeHtml(first)}">“${escapeHtml(truncate(first, 60))}”</span></li>`;
		}).join('');
		$('scenario-nav').addEventListener('click', (e) => {
			const item = e.target.closest('.app-side-nav__item');
			if (!item) return;
			e.preventDefault();
			selectScenario(item.dataset.id);
		});

		$('step').addEventListener('input', (e) => goTo(Number(e.target.value)));
		$('previous').addEventListener('click', () => goTo(current - 1));
		$('next').addEventListener('click', () => goTo(current + 1));
		document.addEventListener('keydown', (e) => {
			if (e.target.matches('input, textarea, select') || e.altKey || e.metaKey || e.ctrlKey) return;
			if (e.key === 'ArrowRight') goTo(current + 1);
			if (e.key === 'ArrowLeft') goTo(current - 1);
		});

		$('about').innerHTML =
			`<p class="govuk-body">Each scenario is a real run, recorded on ${escapeHtml(DEMO.recorded_at)}. The orchestrator is a stand-in: a Strands agent using ${escapeHtml(DEMO.orchestrator_model)} on Amazon Bedrock, with the prototype <code>search_service_journeys</code> tool over a catalogue of ${DEMO.catalogue_size} GOV.UK Forms. Requests and responses are shown exactly as they crossed the boundary. The decision labels mark which RFC outcome each reply represents. The stand-in has no capabilities other than Journey Search, so where a real orchestrator might turn to another one, its replies are not shown.</p>` +
			`<p class="govuk-body">How Journey Search finds and ranks candidates is internal to Legibility and is not part of the contract, so it is not shown.</p>` +
			`<p class="govuk-body">The stand-in orchestrator was given this system prompt, based on the orchestrator's responsibilities in the RFC:</p>` +
			`<pre class="app-footer-prompt">${escapeHtml(DEMO.system_prompt)}</pre>` +
			`<p class="govuk-body">Use the left and right arrow keys to move between steps.</p>`;

		const fromHash = location.hash.slice(1);
		selectScenario(DEMO.scenarios.some((s) => s.id === fromHash) ? fromHash : DEMO.scenarios[0].id);
	}

	init();
</script>
