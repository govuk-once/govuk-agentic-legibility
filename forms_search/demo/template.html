<title>Journey Search Contract</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
	Replays recorded runs at the boundary set out in the RFC "Legibility Journey Search Contract": what the
	citizen says, each search request and response between the orchestrator and Journey Search, and what the
	orchestrator decides. How search works inside is left out on purpose. GOV.UK Frontend's stylesheet and the
	recording are inlined by record_demo.py, so the built page can be opened or shared on its own. Edit this
	file, then run: uv run python -m forms_search.demo.record_demo --build
-->
<style>

<style>
	/* Layout: GOV.UK page with scenarios in a side navigation (one quarter) and the replay (three quarters):
		heading, step slider, a three-lane sequence diagram like the RFC's, then the detail of the current step.

	/* Side navigation, after the GOV.UK Design System website's own. */

	.app-side-nav__item {

	/* Step slider */

	@media (max-width: 40.0525em) {

	/* Sequence diagram: three lanes with dashed lifelines, as in the RFC. */

		padding-bottom: 10px;
		background-image:

	/* Current step detail */

<script>
	// The recording, inlined by record_demo.py.
	const DEMO = /*__DEMO_DATA__*/null;

	const $ = (id) => document.getElementById(id);

	// The orchestrator's possible decisions: the three outcomes in section 4 of the RFC, plus not searching.
	const DECISIONS = {
		execute: { label: 'Execute', tag: 'govuk-tag--green' },
		clarify: { label: 'Clarify', tag: 'govuk-tag--yellow' },
		do_not_route: { label: 'Do not route', tag: 'govuk-tag--red' },
		no_search: { label: 'No search', tag: 'govuk-tag--grey' },
	};

	const escapeHtml = (text) => String(text)
		.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

	const truncate = (text, length) => text.length > length ? text.slice(0, length - 1) + '…' : text;

	/** Pretty-printed JSON with keys, strings and numbers marked for colour. */
	function renderJson(value) {
		const json = JSON.stringify(value, null, 2);
		const token = /("(?:\\.|[^"\\])*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
		let html = '';
		let last = 0;
		for (const match of json.matchAll(token)) {
			const [whole, str, colon, num] = match;
			html += escapeHtml(json.slice(last, match.index));
			if (num) html += `<span class="n">${num}</span>`;
			else if (colon) html += `<span class="k">${escapeHtml(str)}</span>${colon}`;
			else html += `<span class="s">${escapeHtml(str)}</span>`;
			last = match.index + whole.length;
		}
		return html + escapeHtml(json.slice(last));
	}

	/** Enough Markdown for the orchestrator's replies: paragraphs, bullet lists and bold. */
	function renderMarkdown(text) {
		const inline = (s) => escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
		return text.trim().split(/\n{2,}/).map((block) => {
			const lines = block.split('\n');
			if (lines.every((l) => /^\s*[-*] /.test(l))) {
				return '<ul>' + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`).join('') + '</ul>';
			}
			return `<p>${lines.map(inline).join('<br>')}</p>`;
		}).join('');
	}

	function sizeOf(value) {
		const chars = JSON.stringify(value).length;
		return `${chars.toLocaleString('en-GB')} characters, about ${Math.round(chars / 4).toLocaleString('en-GB')} tokens`;
	}

	// Lanes are at 1/6, 1/2 and 5/6 of the width.
	const LANE = { citizen: 16.666, orchestrator: 50, search: 83.333 };

	function arrow(from, to, label, reply = false) {
		const full = escapeHtml(label);
		const left = Math.min(LANE[from], LANE[to]);
		const right = 100 - Math.max(LANE[from], LANE[to]);
		const direction = LANE[to] > LANE[from] ? 'right' : 'left';
		return `<div class="app-sequence__row"><div class="app-arrow app-arrow--${direction}${reply ? ' app-arrow--reply' : ''}" ` +
			`style="left: ${left}%; right: ${right}%;"></div><div class="app-arrow__label" style="left: calc(${left}% + 6px); right: calc(${right}% + 6px);" title="${full}">${full}</div></div>`;
	}

	function note(decision) {
		const d = DECISIONS[decision];
		return `<div class="app-sequence__row"><div class="app-note"><strong class="govuk-tag ${d.tag}">${d.label}</strong></div></div>`;
	}

	function noteText(text) {
		return `<div class="app-sequence__row"><div class="app-note">${escapeHtml(text)}</div></div>`;
	}

	/** The journey the reply names, if it names one of the candidates. */
	function namedCandidate(text, candidates) {
		return candidates.find((c) => text.includes(c.title)) || null;
	}

	/**
	 * Turns the recorded events into steps. Each step adds rows to the sequence diagram and has its own
	 * detail, shown when the step is selected.
	 */
	function buildSteps(scenario) {
		const steps = [];
		let candidates = [];
		let searchedThisTurn = false;
		let turn = 0;
		let responses = 0;

		for (const event of scenario.events) {
			if (event.kind === 'citizen') {
				turn += 1;
				searchedThisTurn = false;
				steps.push({
					rows: arrow('citizen', 'orchestrator', `“${event.text}”`),
					title: turn === 1 ? 'The citizen sends a message' : 'The citizen answers',
					body: (turn === 1 ? '' : `<blockquote class="app-quote">${escapeHtml(event.text)}</blockquote>`) +
						`<p class="govuk-body">The orchestrator owns the conversation. ${turn === 1
							? 'It does not know in advance which service journeys exist, and decides for itself whether to search.'
							: 'Journey Search is stateless and keeps nothing between calls, so anything from earlier is up to the orchestrator.'}</p>`,
				});
			}

			if (event.kind === 'search_request') {
				const again = searchedThisTurn;
				searchedThisTurn = true;
				const limitSet = event.input.limit !== undefined;
				const limit = limitSet ? event.input.limit : 5;
				steps.push({
					rows: arrow('orchestrator', 'search', `Search: “${event.input.query}”`),
					title: again ? 'The orchestrator searches again' : 'The orchestrator searches for service journeys',
					body: (again
						? `<p class="govuk-body">None of the first candidates fitted, so it tries a new query${limitSet ? ' and asks for more candidates' : ''}. Each search is independent: Journey Search keeps nothing from the last one.</p>`
						: `<p class="govuk-body">It writes the query itself, as a self-contained description of the citizen's need.</p>`) +
						`<pre class="app-code">search_service_journeys(\n    query: <span class="s">${escapeHtml(JSON.stringify(event.input.query))}</span>,\n    limit: <span class="n">${limit}</span>\n)</pre>` +
						`<p class="govuk-body-s app-code-caption">${limitSet ? `The orchestrator set the limit to ${limit}.` : 'The orchestrator did not set a limit, so the default of 5 applies.'}</p>`,
				});
			}

			if (event.kind === 'search_response') {
				candidates = event.json.candidates;
				responses += 1;
				steps.push({
					rows: arrow('search', 'orchestrator', `${candidates.length} candidates`, true),
					title: `Journey Search returns ${candidates.length} candidates`,
					body: `<p class="govuk-body">Ranked candidates, each with an ID, title and brief description. Search favours recall over precision: returning a candidate does not mean it is suitable.</p>` +
						`<p class="govuk-body"><strong>The orchestrator must evaluate whether each candidate is suitable, even when only one is returned.</strong> A high ranking is not evidence that a journey is appropriate.</p>` +
						(scenario.response_notes?.[responses - 1] ? `<div class="govuk-inset-text"><strong>In this run:</strong> ${escapeHtml(scenario.response_notes[responses - 1])}</div>` : '') +
						`<pre class="app-code">${renderJson(event.json)}</pre>` +
						`<p class="govuk-body-s app-code-caption">Added to the orchestrator's context: ${sizeOf(event.json)}.</p>`,
				});
			}

			if (event.kind === 'reply') {
				const d = DECISIONS[event.decision];
				const chosen = namedCandidate(event.text, candidates);
				const why = {
					execute: chosen
						? `It judges that <strong>${escapeHtml(chosen.title)}</strong> (workflow ${escapeHtml(chosen.workflow_id)}) fits.${!searchedThisTurn && candidates.length ? ' It chooses from the candidates it already has, without searching again.' : ''} It does not start the journey yet. It replies first, offering the journey to the citizen.`
						: 'It judges that one candidate fits. It does not start the journey yet. It replies first, offering the journey to the citizen.',
					clarify: 'Several candidates could fit, so it asks the citizen. The citizen decides which service they want to use.',
					do_not_route: 'It judges that none of the candidates fits. A high ranking is not evidence that a journey is appropriate.',
					no_search: 'It decides that searching for a service journey is not appropriate, so it makes no request to Journey Search.',
				}[event.decision];
				const handsOff = event.decision === 'do_not_route' || event.decision === 'no_search';
				steps.push({
					rows: {
						execute: noteText('One candidate fits') + arrow('orchestrator', 'citizen', 'Offers the journey') +
							`<div class="app-sequence__row"><p class="app-next"><strong class="govuk-tag ${d.tag}">${d.label}</strong> only if the citizen agrees, outside this contract</p></div>`,
						clarify: note(event.decision) + arrow('orchestrator', 'citizen', 'Asks the citizen'),
						do_not_route: note(event.decision) + '<div class="app-sequence__row"><p class="app-next">Next step outside this contract</p></div>',
						no_search: note(event.decision) + '<div class="app-sequence__row"><p class="app-next">Next step outside this contract</p></div>',
					}[event.decision],
					title: event.decision === 'execute' ? 'The orchestrator offers the journey' : `The orchestrator decides: ${d.label}`,
					body: (event.decision === 'execute' ? '' : `<p class="govuk-body"><strong class="govuk-tag ${d.tag}">${d.label}</strong></p>`) +
						`<p class="govuk-body">${why}</p>` +
						(handsOff
							? `<p class="govuk-body">What it does next is outside this contract. Legibility is one of several capabilities the orchestrator can use, so it might turn to another, such as question answering over GOV.UK${event.decision === 'do_not_route' ? ', or route the citizen to an onward journey with a department' : ''}.</p>`
							: `<h3 class="govuk-heading-s">Reply to the citizen</h3><div class="app-quote">${renderMarkdown(event.text)}</div>`) +
						(event.decision === 'execute'
							? `<h3 class="govuk-heading-s">If the citizen agrees</h3><p class="govuk-body"><strong class="govuk-tag ${d.tag}">${d.label}</strong></p>` +
								`<p class="govuk-body">Only then does the orchestrator start the journey, with a separate call to Legibility's execution interface. That call is outside this contract.</p>`
							: ''),
				});
			}
		}
		return steps;
	}

	// --- State and rendering ---------------------------------------------------

	let scenario = null;
	let steps = [];
	let current = 1;

	function renderStep() {
		const total = steps.length;
		const range = $('step');
		range.max = String(total);
		range.value = String(current);
		$('step-label').textContent = `Step ${current} of ${total}`;
		range.setAttribute('aria-valuetext', `Step ${current} of ${total}: ${steps[current - 1].title}`);
		$('previous').disabled = current <= 1;
		$('next').disabled = current >= total;

		$('sequence').innerHTML = steps.map((s, n) => {
			const state = n + 1 === current ? ' is-current' : '';
			return s.rows.replaceAll('class="app-sequence__row"', `class="app-sequence__row${state}"${n + 1 > current ? ' hidden' : ''}`);
		}).join('');

		const s = steps[current - 1];
		$('detail').innerHTML = `<h2 class="govuk-heading-m">${s.title}</h2>${s.body}`;
	}

	function goTo(step) {
		current = Math.max(1, Math.min(step, steps.length));
		renderStep();
	}

	function selectScenario(id) {
		scenario = DEMO.scenarios.find((s) => s.id === id) || DEMO.scenarios[0];
		steps = buildSteps(scenario);
		const index = DEMO.scenarios.indexOf(scenario);

		$('caption').textContent = `Scenario ${index + 1} of ${DEMO.scenarios.length}`;
		$('title').textContent = scenario.label;
		$('point').textContent = scenario.point;
		$('request').textContent = scenario.events.find((e) => e.kind === 'citizen').text;
		document.querySelectorAll('.app-side-nav__item').forEach((item) => {
			const isCurrent = item.dataset.id === scenario.id;
			item.classList.toggle('app-side-nav__item--current', isCurrent);
			const link = item.querySelector('a');
			if (isCurrent) link.setAttribute('aria-current', 'page');
			else link.removeAttribute('aria-current');
		});
		try { history.replaceState(null, '', '#' + scenario.id); } catch (e) { /* the hash is only a convenience */ }
		goTo(1);
	}

	function init() {
		$('scenario-nav').innerHTML = DEMO.scenarios.map((s) => {
			const first = s.events.find((e) => e.kind === 'citizen').text;
			return `<li class="app-side-nav__item" data-id="${s.id}"><a class="govuk-link" href="#${s.id}">${escapeHtml(s.label)}</a>` +
				`<span class="app-side-nav__hint" title="${escapeHtml(first)}">“${escapeHtml(truncate(first, 60))}”</span></li>`;
		}).join('');
		$('scenario-nav').addEventListener('click', (e) => {
			const item = e.target.closest('.app-side-nav__item');
			if (!item) return;
			e.preventDefault();
			selectScenario(item.dataset.id);
		});

		$('step').addEventListener('input', (e) => goTo(Number(e.target.value)));
		$('previous').addEventListener('click', () => goTo(current - 1));
		$('next').addEventListener('click', () => goTo(current + 1));
		document.addEventListener('keydown', (e) => {
			if (e.target.matches('input, textarea, select') || e.altKey || e.metaKey || e.ctrlKey) return;
			if (e.key === 'ArrowRight') goTo(current + 1);
			if (e.key === 'ArrowLeft') goTo(current - 1);
		});

		$('about').innerHTML =
			`<p class="govuk-body">Each scenario is a real run, recorded on ${escapeHtml(DEMO.recorded_at)}. The orchestrator is a stand-in: a Strands agent using ${escapeHtml(DEMO.orchestrator_model)} on Amazon Bedrock, with the prototype <code>search_service_journeys</code> tool over a catalogue of ${DEMO.catalogue_size} GOV.UK Forms. Requests and responses are shown exactly as they crossed the boundary. The decision labels mark which RFC outcome each reply represents. The stand-in has no capabilities other than Journey Search, so where a real orchestrator might turn to another one, its replies are not shown.</p>` +
			`<p class="govuk-body">How Journey Search finds and ranks candidates is internal to Legibility and is not part of the contract, so it is not shown.</p>` +
			`<p class="govuk-body">The stand-in orchestrator was given this system prompt, based on the orchestrator's responsibilities in the RFC:</p>` +
			`<pre class="app-footer-prompt">${escapeHtml(DEMO.system_prompt)}</pre>` +
			`<p class="govuk-body">Use the left and right arrow keys to move between steps.</p>`;

		const fromHash = location.hash.slice(1);
		selectScenario(DEMO.scenarios.some((s) => s.id === fromHash) ? fromHash : DEMO.scenarios[0].id);
	}

	init();
</script>
