<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>GOV.UK agentic app</title>
<style>
  :root{
    /* Palette lifted from the Figma file's own variables */
    --brand:#1D70B8;
    --brand-dark:#0F385C;
    --success:#0F7A52;
    --green-tint:#F3F8F6;
    --page:#E8F1F8;
    --template:#F4F8FB;
    --surface:#FFFFFF;
    --ink:#0B0C0C;
    --ink-2:#484949;
    --ink-3:#9A9A9A;
    --ink-4:#B1B4B6;
    --panel:#F7F7F7;
    --panel-2:#F2F2F2;
    --divider:#E6E6E6;
    --hairline:rgba(0,0,0,.14);
    --secondary-bg:#F2F2F7;
    --warning:#FEBC2F;
    --tag-them:#D0E6E7;
    --tag-you:#D2E2F1;
    --chip:rgba(120,120,128,.16);
    --stage:#151b22;
    --stage-2:#0d1218;
    --font:"GDS Transport",Arial,"Helvetica Neue",Helvetica,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:radial-gradient(120% 90% at 50% 0%,var(--stage) 0%,var(--stage-2) 100%);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }

  /* ---------- stage ---------- */
  .stage{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:28px 16px 40px;
  }
  .stage-foot{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
  }
  .ghost{
    appearance:none;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.05);
    color:#cfd9e4;
    font-family:var(--font);
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .ghost:hover{background:rgba(255,255,255,.12)}
  .ghost:focus-visible{outline:2px solid #8fb4d8;outline-offset:2px}

  /* ---------- device ----------
     Geometry taken from the iPhone 15 Pro community frame and scaled from its
     393pt screen to the 375pt screen the Personalised Planning file is drawn at
     (×0.954): 6px titanium rail, 10px bezel, 52px screen radius,
     118×34 Dynamic Island 8px down. */
  .device{position:relative;flex:none}
  .phone{
    position:relative;
    width:375px;
    height:824px;                       /* 812 screen + 6px shell each side */
    max-height:calc(100dvh - 120px);
    border-radius:44px;
    background:#000;
    padding:6px;
    box-shadow:0 40px 90px -20px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.08);
  }
  .screen{
    position:relative;
    width:100%;
    height:100%;
    border-radius:38px;
    overflow:hidden;
    background:var(--page);
    display:flex;
    flex-direction:column;
  }
  .island,.side,.ant{display:none}

  /* framed — Natural Titanium */
  .device.framed{
    padding:6px;
    border-radius:68px;
    background:linear-gradient(158deg,
      #efece6 0%,#b5b0a6 8%,#7b776f 19%,#dcd7ce 31%,#9b968e 43%,
      #6d6963 55%,#d0cbc2 68%,#8a8680 80%,#e8e4dd 91%,#928d87 100%);
    box-shadow:
      0 0 0 .5px rgba(0,0,0,.55),
      0 34px 80px -22px rgba(0,0,0,.85),
      0 6px 18px rgba(0,0,0,.35);
  }
  .device.framed .phone{
    border-radius:62px;
    padding:10px;                       /* bezel */
    height:832px;                       /* 812 screen + 10px bezel each side */
    max-height:calc(100dvh - 140px);
    background:#08080a;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16);
  }
  .device.framed .screen{border-radius:52px}
  .device.framed .island,
  .device.framed .side,
  .device.framed .ant{display:block}

  .island{
    position:absolute;left:50%;transform:translateX(-50%);
    top:18px;width:118px;height:34px;border-radius:17px;
    background:#000;z-index:30;pointer-events:none;
  }
  .island .cam{
    position:absolute;right:9px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;border-radius:50%;
    background:radial-gradient(circle at 38% 34%,#2b3440 0%,#141a21 45%,#05070a 100%);
    box-shadow:inset 0 0 0 1px rgba(120,140,165,.22);
  }

  .side{
    position:absolute;width:8px;z-index:1;
    background:linear-gradient(90deg,#5c5952 0%,#a49f96 42%,#cfcac1 58%,#6f6b65 100%);
    box-shadow:0 1px 3px rgba(0,0,0,.55);
  }
  .side.l{left:-2px;border-radius:3px 0 0 3px}
  .side.r{right:-2px;border-radius:0 3px 3px 0;
    background:linear-gradient(270deg,#5c5952 0%,#a49f96 42%,#cfcac1 58%,#6f6b65 100%)}
  /* ratios of the whole device height, straight off the Figma frame */
  .side.action  {top:19.58%;height:4.10%}
  .side.volup   {top:27.03%;height:7.65%}
  .side.voldown {top:36.71%;height:7.65%}
  .side.power   {top:32.30%;height:12.05%}

  .ant{position:absolute;left:0;right:0;height:5px;z-index:2;pointer-events:none}
  .ant::before,.ant::after{
    content:"";position:absolute;top:0;width:6px;height:5px;background:rgba(58,55,50,.6);
  }
  .ant::before{left:0;border-radius:3px 0 0 3px}
  .ant::after{right:0;border-radius:0 3px 3px 0}
  .ant.a{top:11.26%}
  .ant.b{top:89.46%}

  @media (max-width:520px){
    .stage{padding:0;gap:0;justify-content:flex-start}
    .stage-foot{display:none}
    .device,.device.framed{padding:0;border-radius:0;background:none;box-shadow:none}
    .device .island,.device .side,.device .ant,
    .device.framed .island,.device.framed .side,.device.framed .ant{display:none}
    .phone,.device.framed .phone{
      width:100%;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none;
    }
    .screen,.device.framed .screen{border-radius:0}
  }

  /* ---------- status bar + nav ---------- */
  .statusbar{
    flex:none;
    height:41px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 24px 0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",var(--font);
    font-size:12.7px;
    font-weight:600;
    letter-spacing:-.35px;
    color:var(--ink);
  }
  .statusbar.on-brand{color:#fff}
  .statusbar .icons{display:flex;align-items:center;gap:5px}

  .nav{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:8px 16px 16px;
  }
  .nav-left{display:flex;align-items:center;gap:16px;min-width:0}
  .backbtn{
    appearance:none;border:0;cursor:pointer;
    width:48px;height:48px;border-radius:48px;
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    flex:none;padding:0;
  }
  .backbtn.chip{background:var(--chip)}
  .backbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .nav-label{font-size:16px;font-weight:300;letter-spacing:-.4px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-label.sm{font-size:14px}
  .avatar{
    appearance:none;border:0;padding:0;cursor:pointer;flex:none;
    width:40px;height:40px;border-radius:40px;
    background:var(--brand-dark);
    color:#fff;font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .avatar:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* ---------- scroll body ---------- */
  .body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:0 16px 40px;
  }
  .body.flush{padding:0}
  .body.white{background:var(--surface)}
  /* Task detail is a white frame end to end, so the status bar and nav
     sit on white and the heading reads as spaced, not butted up against a seam. */
  .screen.white{background:var(--surface)}
  .screen.white .body{padding-top:4px}
  .stack{display:flex;flex-direction:column;gap:16px}

  /* ---------- type ---------- */
  h1.title{font-size:34px;line-height:1.15;font-weight:700;margin:0;padding:0 12px;text-wrap:balance}
  h2.title-sm{font-size:21px;line-height:1.2;font-weight:700;margin:0;padding:0 12px;text-wrap:balance}
  .intro{font-size:16px;line-height:1.4;font-weight:300;color:var(--ink-2);padding:0 12px;margin:0}
  .intro.on-ink{color:var(--ink)}
  .section-h{font-size:20px;line-height:24px;font-weight:700;letter-spacing:.076px;padding:0 12px;margin:0}
  .section-h.big{font-size:21px;letter-spacing:0;padding:0 16px}
  .sub{font-size:16px;font-weight:300;color:var(--ink-2);padding:0 12px;margin:0;line-height:1.4}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;gap:1px}
  .card-pad{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px}
  .card-title{font-size:21px;font-weight:700;line-height:22px;letter-spacing:-.086px;margin:0}
  .card-body{font-size:16px;font-weight:300;line-height:1.4;margin:0}
  .step-head{background:var(--surface);padding:24px 16px}
  .step-head .card-title{line-height:1.2}

  .rowlink{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface);border:0;width:100%;
    padding:0 16px;min-height:60px;
    font-family:var(--font);font-size:16px;font-weight:300;color:var(--ink);
    text-align:left;cursor:pointer;
  }
  .rowlink:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
  .rowlink[disabled]{cursor:default;color:var(--ink-3)}

  .updaterow{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:0;width:100%;
    padding:16px;cursor:pointer;font-family:var(--font);text-align:left;
  }
  .updaterow:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
  .updaterow .badge{
    width:40px;height:40px;border-radius:20px;background:var(--template);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .updaterow .lbl{flex:1;font-size:21px;font-weight:700;color:var(--ink)}

  /* two data tiles: status + tasks */
  .tiles{display:flex;gap:1px;background:var(--divider)}
  .tile{
    flex:1;min-width:0;background:var(--surface);
    display:flex;align-items:center;gap:12px;
    padding:8px 16px;min-height:72px;
  }
  .tile .lbl{min-width:0}
  .tile .k{font-size:16px;font-weight:700;line-height:1.25}
  .tile .v{font-size:14px;font-weight:300;line-height:1.3;color:var(--ink)}

  .detailsrow{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface);border:0;width:100%;
    padding:12px 16px;font-family:var(--font);font-size:16px;font-weight:300;
    color:var(--ink);text-align:left;cursor:pointer;
  }
  .detailsrow:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}

  /* ---------- task cards ---------- */
  .task{
    background:var(--surface);border-radius:10px;padding:16px;
    display:flex;flex-direction:column;gap:0;width:100%;
    border:2px solid transparent;
  }
  .task.selectable{cursor:pointer}
  .task.picked{border-color:var(--success)}
  .task-top{display:flex;align-items:center;gap:15px;width:100%}
  .task-check{
    appearance:none;border:0;background:none;padding:0;margin:0;flex:none;
    position:relative;
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;border-radius:40px;
  }
  .task-check:focus-visible{outline:2px solid var(--brand);outline-offset:0}
  .task-check::after{
    content:"";position:absolute;left:6px;top:6px;right:6px;bottom:6px;
    border-radius:50%;border:2px solid var(--success);opacity:0;pointer-events:none;
  }
  .task-check.pulse::after{animation:ringwave .62s ease-out both}
  .task-check.pulse svg{animation:checkpop .44s cubic-bezier(.34,1.56,.64,1) both}
  .task-check.pulse .tickpath{animation:draw .32s .1s ease-out both}
  .task-check.pulse.off::after{animation:none}
  .task-check.pulse.off svg{animation:uncheck .34s ease both}

  @keyframes checkpop{0%{transform:scale(.35);opacity:.25}55%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes uncheck{0%{transform:scale(1)}45%{transform:scale(.78);opacity:.55}100%{transform:scale(1);opacity:1}}
  @keyframes ringwave{0%{transform:scale(.7);opacity:.6}100%{transform:scale(2.1);opacity:0}}
  @keyframes draw{from{stroke-dashoffset:32}to{stroke-dashoffset:0}}
  @keyframes cardflash{0%{background:#E4F2EB}70%{background:#F4FAF7}100%{background:var(--surface)}}
  .task.flash{animation:cardflash .9s ease both}
  .task-name{transition:color .3s ease}
  .dotwrap.swap svg{animation:checkpop .4s cubic-bezier(.34,1.56,.64,1) both}
  .ringprog{transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1),stroke .35s ease}
  .task-name{
    flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.25;
    text-align:left;background:none;border:0;padding:0;font-family:var(--font);
    color:var(--ink);cursor:pointer;
  }
  .task-name:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:2px}
  .task.done .task-name{color:var(--ink-2)}
  .tagrow{display:flex;align-items:center;gap:15px;margin-top:4px}
  .tagrow .spacer{width:40px;flex:none}
  .tags{display:flex;gap:8px;flex-wrap:wrap}
  .tag{
    height:28px;padding:0 12px;border-radius:999px;
    display:inline-flex;align-items:center;
    font-size:14px;font-weight:300;color:var(--ink);
  }
  .tag.them{background:var(--tag-them)}
  .tag.you{background:var(--tag-you)}

  /* ---------- task detail ---------- */
  .btn{
    appearance:none;border:0;width:100%;height:48px;border-radius:12px;
    font-family:var(--font);font-size:18px;font-weight:300;
    display:flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;
  }
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.done{background:var(--success);color:#fff}
  .btn[data-act="toggle"]{transition:background-color .35s ease}
  .btn.cheer .tickpath{animation:draw .34s .06s ease-out both}
  .btn.cheer svg{animation:checkpop .44s cubic-bezier(.34,1.56,.64,1) both}
  .btn.green{background:var(--success);color:#fff;font-size:16px}
  .btn.plain{background:var(--surface);color:var(--ink);font-size:16px}

  .callout{
    background:var(--secondary-bg);
    border-left:4px solid var(--brand);
    border-radius:4px;padding:24px;
    font-size:16px;font-weight:300;line-height:1.25;
  }
  .callout.warn{border-left-color:var(--warning)}

  .kvgroup{background:var(--divider);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;gap:1px}
  .kv{
    background:var(--surface);display:flex;align-items:flex-start;justify-content:space-between;
    gap:16px;padding:19px 16px;min-height:60px;
  }
  .kv .k{font-size:16px;font-weight:700;flex:none;max-width:45%}
  .kv .v{font-size:16px;font-weight:300;text-align:right;line-height:1.35}

  .panel{background:var(--panel);border-radius:12px;padding:24px 16px;display:flex;flex-direction:column;gap:14px}
  .panel p{margin:0;font-size:16px;font-weight:300;line-height:1.4}
  .panel ul,.panel ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:4px}
  .panel li{font-size:16px;font-weight:300;line-height:1.4}
  .minilabel{font-size:16px;font-weight:700;padding:0 16px;margin:0}

  .needlist{background:var(--panel);border-radius:12px;padding:0 16px;display:flex;flex-direction:column}
  .needlist div{
    padding:19px 0;font-size:16px;font-weight:300;line-height:1.35;
    border-bottom:.5px solid #999;
  }
  .needlist div:last-child{border-bottom:0}

  .extlink{
    display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
    background:var(--page);border:0;border-radius:12px;min-height:60px;padding:12px 18px;
    color:var(--brand);font-family:var(--font);font-size:16px;font-weight:300;
    text-align:left;text-decoration:none;cursor:pointer;
    transition:background-color .18s ease;
  }
  .extlink:hover{background:#DCEAF6}
  .extlink:active{background:#CFE2F3}
  .extlink:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* ---------- what you've told us ---------- */
  .kvcard{background:var(--divider);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;gap:1px}
  .kvcard .row{
    background:var(--surface);display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:16px;min-height:80px;
  }
  .kvcard .row .lbl{display:flex;flex-direction:column;gap:10px;min-width:0}
  .kvcard .row .lbl b{font-size:16px;font-weight:700}
  .kvcard .row .lbl span{font-size:16px;font-weight:300;line-height:1.3}
  .editbtn{
    appearance:none;border:0;background:none;padding:6px 10px;border-radius:12px;
    color:var(--brand);font-family:var(--font);font-size:16px;font-weight:300;cursor:pointer;flex:none;
  }
  .editbtn:focus-visible{outline:2px solid var(--brand);outline-offset:0}

  /* ---------- profile selection ---------- */
  .profile-screen{background:var(--brand)}
  .profile-screen .body{padding:0 12px 32px}
  .brandtitle{text-align:center;color:#fff;font-size:32px;line-height:1.25;padding:0 12px;margin:0 0 24px}
  .brandtitle b{font-weight:700;display:block}
  .brandtitle span{font-weight:300;display:block}
  /* Figma lays the profiles out as a 300px-wide row starting 23px from the
     frame edge, so the next card peeks in — a horizontal carousel, not a stack. */
  .profiles{
    display:flex;gap:16px;align-items:stretch;
    overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scroll-padding-left:23px;
    -webkit-overflow-scrolling:touch;
    margin:0 -12px;
    padding:0 23px 6px;
    scrollbar-width:none;
  }
  .profiles::-webkit-scrollbar{display:none}
  .pcard{
    background:#fff;border-radius:16px;padding:24px;
    display:flex;flex-direction:column;gap:16px;
    flex:0 0 300px;max-width:300px;
    scroll-snap-align:start;
  }
  .pcard .btn{margin-top:auto}
  .pcard .head{display:flex;align-items:center;gap:16px;padding:8px 0}
  .pcard .head .glyph{
    width:64px;height:64px;border-radius:32px;flex:none;
    background:var(--page);display:flex;align-items:center;justify-content:center;
  }
  .pcard .head h3{margin:0;font-size:34px;font-weight:700;line-height:1}
  .pcard .desc{margin:0;font-size:16px;font-weight:300;line-height:1.35;color:var(--ink)}
  .facts{display:flex;flex-direction:column;gap:8px}
  .fact{display:flex;align-items:center;gap:16px;font-size:14px;font-weight:300;color:var(--ink-3);line-height:1.3}
  .fact svg{flex:none}
  .selectnote{color:#fff;font-size:16px;font-weight:300;text-align:center;margin:24px 0 0;padding:0 12px}

  /* ---------- chat ---------- */
  .chatbody{
    flex:1;min-height:0;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:16px;
  }
  .msg{display:flex;width:100%}
  .msg.a{justify-content:flex-start}
  .msg.u{justify-content:flex-end}
  .bubble{
    border-radius:18px;padding:16px;font-size:16px;font-weight:300;line-height:20px;
    animation:pop .28s ease both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bubble{overflow-wrap:anywhere}
  .msg.a .bubble{background:var(--surface);color:var(--ink);width:100%}
  .msg.u .bubble{background:var(--brand-dark);color:#fff;max-width:88%}
  .bubble p{margin:0 0 10px}
  .bubble p:last-child{margin:0}
  .bubble ul{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:2px}
  .typing{display:flex;gap:5px;align-items:center;padding:4px 2px}
  .typing i{width:7px;height:7px;border-radius:7px;background:var(--ink-4);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .plancard{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%}
  .plancard .name{font-size:18px;font-weight:700;line-height:20px;padding:8px 0 8px 8px;margin:0}

  .composer{
    flex:none;background:var(--page);padding:8px 16px 24px;
    display:flex;flex-direction:column;gap:8px;
  }
  .hint{font-size:12px;color:var(--ink-2);text-align:center;margin:0;min-height:15px}

  .fade{animation:fadein .26s ease both}

  /* ---------- sandwich carer additions ----------
     Layout: phone on the left, "How this works" panel on the right; stacks below 980px. */
  :root{
    color-scheme:dark;
    --side-bg:rgba(255,255,255,.045);
    --side-line:rgba(255,255,255,.11);
    --side-ink:#e3eaf1;
    --side-mute:#9fb0c2;
    --st-today:#5fd09a;
    --st-pilot:#8cc0f0;
    --st-imagined:#f2c25c;
    --tag-kids:#F1E3C6;

    --lv-prep-bg:#D2E2F1; --lv-prep-ink:#0F385C;

  .duo{display:flex;gap:32px;align-items:center;justify-content:center;width:100%;max-width:1100px}

    background:var(--side-bg);border:1px solid var(--side-line);border-radius:20px;

    display:flex;flex-direction:column;gap:18px;
  }
  .sidepanel[hidden]{display:none!important}
  .sp-eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mute);margin:0}
  .sp-title{font-size:24px;line-height:1.2;font-weight:700;margin:0;text-wrap:balance}
  .sp-body{font-size:15px;line-height:1.5;font-weight:300;margin:0;color:var(--side-ink)}
  .sp-h{font-size:13px;font-weight:700;color:var(--side-mute);margin:0;letter-spacing:.02em}
  .sp-rows{display:flex;flex-direction:column;gap:10px}
  .sp-row{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;font-weight:300}
  .pill{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap;margin-top:1px}

  .sp-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--side-line)}

  .sp-ladder .lvrow span:last-child{font-size:14px;line-height:1.4;font-weight:300;color:var(--side-ink)}

  @media (max-width:980px){
    .duo{flex-direction:column;align-items:center}
    .sidepanel{flex:none;width:100%;max-width:420px;max-height:none}

  .textbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .changed{background:var(--green-tint);border:2px solid var(--success);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .changed b{color:var(--success)}
  .changed p{margin:0;font-size:15px;font-weight:300;line-height:1.4}

  /* task detail level banner */
  .lvbanner{margin:0 12px;padding:16px;border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
  .lvbanner p{margin:0;font-size:15px;line-height:1.4;font-weight:300}
  .receipt{background:var(--green-tint);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;margin:0 12px}
  .receipt b{color:var(--success);font-size:15px}
  .receipt div{font-size:14px;font-weight:300;line-height:1.4}

  /* flows */
  .src{display:inline-block;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--panel-2);border-radius:6px;padding:2px 6px;margin-top:6px}
  .src.told{background:var(--tag-you)}
  .src.gov{background:var(--lv-auto-bg);color:var(--lv-auto-ink)}
  .kv .v{min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}

  .choice{display:flex;flex-direction:column;gap:8px}

    appearance:none;width:100%;text-align:left;cursor:pointer;font-family:var(--font);

  .screen{color-scheme:light}
  /* one colour for anything the agent does */
  :root{
    /* palette from the agentic services mark */
    --navy:#02064A; --violet:#BC52FF; --cyan:#12E2F7; --mist:#C0EAFD;
    --agent:var(--cyan); --agent-ink:var(--navy); --agent-on-dark:var(--cyan);
    --brand:var(--navy); --brand-dark:var(--navy);
    --page:#EEF1FB; --template:#E4F7FD;
    --stage:#1d1f23; --stage-2:#111214;
    --tag-them:var(--mist); --tag-you:#EBD9FF; --tag-kids:#DEE2F7;
    --st-pilot:#86cdd8; --st-imagined:#c3a2dd; --st-today:#8cc5a6;

  const s = state.status[id], t = T(id);
  if(s==="todo")      return t.due ? `<span class="st due">${esc(t.due)}</span>` : `<span class="st">To do</span>`;
  if(s==="ready")     return `<span class="st due">Ready to check</span>`;
  if(s==="blocked")   return `<span class="st wait">${esc(t.blockedText||"Waiting")}</span>`;
  if(s==="booked")    return `<span class="st ok">Booked</span>`;
  if(s==="submitted") return `<span class="st wait">Sent. Waiting for a decision</span>`;
  if(s==="waiting")   return `<span class="st wait">Waiting for the GP</span>`;
  if(s==="done")      return `<span class="st ok">Done</span>`;
  if(s==="ruled")     return `<span class="st">Not eligible</span>`;
  if(s==="attention") return `<span class="st due">Needs you. Due 26 January</span>`;
  return "";
}
const isDone = s => ["done","booked","submitted","waiting"].includes(s);
const stepCounts = step => {
  const ids = step.tasks.filter(id=>state.status[id]!=="ruled");
  return {done:ids.filter(id=>isDone(state.status[id])).length, total:ids.length};
};
const stepStatus = step => {
  const {done,total} = stepCounts(step);
  if(done===0) return {label:"Not started",key:"none"};
  if(done<total) return {label:"In progress",key:"part"};
  return {label:"Complete",key:"done"};
};
function tiles(step){
  const {done,total} = stepCounts(step), st = stepStatus(step);
  return `<div class="tiles">
    <div class="tile"><span>${I.statusDot(st.key)}</span><span class="lbl"><span class="k">Status</span><br><span class="v">${st.label}</span></span></div>
    <div class="tile"><span>${I.ring(done,total)}</span><span class="lbl"><span class="k">Tasks</span><br><span class="v">${done} of ${total}</span></span></div>
  </div>`;
}
function taskRow(id){
  const t = T(id), s = state.status[id], ag = LEVELS[t.level].agent;
  return `<button class="trow${isDone(s)?" isdone":""}${s==="blocked"?" locked":""}" data-act="task" data-task="${id}" type="button">

}

function chatUpdate(opts={}){
  const cb = el.querySelector("#chatbody");
  if(!cb) return;
  const typingNode = cb.querySelector(".typing-msg");
  const rendered = cb.querySelectorAll(".msg:not(.typing-msg)").length;
  for(let i=rendered;i<state.chatLog.length;i++){
    const holder = document.createElement("div");
    holder.innerHTML = messageHTML(state.chatLog[i]);
    const node = holder.firstElementChild;
    if(opts.instant) node.querySelector(".bubble,.plancard,.consentcard,.gathercard,.ctxcard")?.style.setProperty("animation","none");
    cb.insertBefore(node, typingNode || null);
  }
  if(state.typing && !typingNode){
    const holder = document.createElement("div");
    holder.innerHTML = typingHTML();
    cb.appendChild(holder.firstElementChild);
  } else if(!state.typing && typingNode){
    typingNode.remove();
  }
  const next = SC()[state.chatIndex];
  const pending = (!state.chatBusy && next && next.r==="u") ? next.t : null;
  const field = el.querySelector(".field"), send = el.querySelector(".send"), hint = el.querySelector(".hint");
  if(field){ field.textContent = pending || "Ask or tell me something"; field.classList.toggle("empty", !pending); }
  if(send) send.disabled = !pending;
  if(hint) hint.innerHTML = pending ? "Tap send to reply" : state.script==="choose" ? "Choose what Nadia does, in the panel" : "&nbsp;";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  requestAnimationFrame(()=>cb.scrollTo({top:cb.scrollHeight, behavior:(opts.instant||reduce)?"auto":"smooth"}));
}

function chatStep(){
  if(state.chatIndex >= SC().length){ state.chatBusy=false; state.typing=false; chatUpdate(); return; }
  const item = SC()[state.chatIndex];
  if(item.r==="u"){ state.chatBusy=false; state.typing=false; chatUpdate(); return; }
  if(item.r==="gather"){
    state.chatLog.push(item); state.chatIndex++; state.chatBusy=true; state.typing=false;
    state.gatherOn = 0; chatUpdate();
    const run = state.run;
    const tick = ()=>{
      if(run!==state.run) return;
      state.gatherOn++;
      advanceRun(state.gatherOn, "#gatherlist");
      if(state.gatherOn<GATHER.length) setTimeout(tick, 1100);
      else setTimeout(()=>{ if(run===state.run) chatStep(); }, 600);
    };
    setTimeout(tick, 1100);
    return;
  }
  if(item.r==="consent" || item.r==="alert" || item.r==="corrcard"){
    state.chatLog.push(item); state.chatIndex++; state.chatBusy=true; state.typing=false;
    chatUpdate(); renderSide(); return;          // waits for Allow
  }
  state.chatBusy = true; state.typing = true; chatUpdate();
  const dwell = item.r==="plan" ? 700 : Math.min(1500, 420 + (item.t?item.t.length:0)*7);
  const run = state.run;
  setTimeout(()=>{
    if(run!==state.run) return;
    state.typing = false;
    state.chatLog.push(item); state.chatIndex++;
    if(state.view==="chat") chatUpdate();
    setTimeout(()=>{ if(run===state.run) chatStep(); }, 320);
  }, dwell);
}
function sendReply(){
  const item = SC()[state.chatIndex];
  if(!item || item.r!=="u" || state.chatBusy) return;
  state.chatBusy = true;
  state.chatLog.push(item); state.chatIndex++;
  chatUpdate();
  const run = state.run;
  setTimeout(()=>{ if(run===state.run) chatStep(); }, 420);
}

function runChange(items, then){
  const c = state.change, run = state.run;
  c.on = 0; render();
  const tick = ()=>{
    if(run!==state.run || state.change!==c) return;
    c.on++; advanceRun(c.on);
    if(c.on<items.length) setTimeout(tick, 1100);
    else setTimeout(()=>{ if(run===state.run && state.change===c) then(); }, 700);
  };
  setTimeout(tick, 1100);
}

function flowShell(title, inner, {label="Cancel"}={}){
  return `<div class="screen white">
    ${statusBar()}
    ${nav({back:true,label,small:true,chip:true})}
    <div class="body white"><div class="stack">
      <h2 class="title-sm">${esc(title)}</h2>
      ${inner}
    </div></div>
    ${state.toast?`<div class="toast">${esc(state.toast)}</div>`:""}
  </div>`;
}
const kvSrc = rows => `<div style="padding:0 12px"><div class="kvgroup">${rows.map(([k,v,src])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}${src?`<span class="src ${src.startsWith("You")?"told":"gov"}">${esc(src)}</span>`:""}</span></div>`).join("")}</div></div>`;
const pad = h => `<div style="padding:0 12px;display:flex;flex-direction:column;gap:12px">${h}</div>`;
const TICK = `<span class="rtick">${I.tickWhite}</span>`;
const runSlot = (i,on) => i<on ? TICK : i===on ? LOGO(22,true) : `<span class="ring"></span>`;
const runList = (items,on) => `<div style="padding:0 12px"><div class="runlist" id="runlist">${items.map((x,i)=>`<div class="${i<on?"on":i===on?"now":""}"><span class="slot">${runSlot(i,on)}</span><span>${esc(x)}</span></div>`).join("")}</div></div>`;
function advanceRun(on, sel="#runlist"){
  const rows = el.querySelectorAll(sel+" > div");
  rows.forEach((row,i)=>{
    const want = i<on ? "on" : i===on ? "now" : "";
    if(row.className===want) return;
    row.className = want;
    row.querySelector(".slot").innerHTML = runSlot(i,on);
    if(i<on) row.querySelector(".rtick").classList.add("pop");
  });
}

function viewFlow(){

  const hrs = state.hours;

      const note = hrs===0
        ? `<div class="obs"><b>Check before you send</b>You'll only stay eligible if you get Carer's Allowance. You cannot get it until your mum's Attendance Allowance is approved. If you stop work before then, your codes could stop in January.</div>`

        ${pad(`<button class="btn green" data-act="next" type="button" ${d.att?"":"disabled style='opacity:.45'"}>Send to HMRC</button>`)}

  }

  if(f.task==="needs_assess" || f.task==="carers_assess"){
    const slots = ["Tuesday 20 October, 2pm","Thursday 22 October, 10am","Monday 26 October, 11:30am"];
    if(d.slot===undefined) d.slot=1;

    if(d.both===undefined) d.both=true;

      ${pad(`<div class="callout">The council will ask your mum if she agrees to the assessment. It's her decision.</div><button class="btn green" data-act="book" type="button">Book visit</button>`)}

  if(f.task==="aa_claim"){

    if(f.stage==="review"){

      const ready = d.night!==undefined && d.att;

        <p class="intro on-ink">I've filled in your mum's answers from what you told me. Check them with her. There's one question you need to answer.</p>

    return flowShell("If you worked fewer days", `

    `);

  if(f.task==="flex_request"){

  if(f.task==="council_tax"){

          <li>If she makes one now, she decides. Otherwise a court may have to.</li>
          <li>Someone who knows her must confirm she understands it and is not being pressured.</li>

        <button class="btn green" data-act="lpastart" type="button">Start the application</button>`)}
    `);
  }
  if(f.task==="vtax"){
    if(f.stage==="review"){

  }
  return flowShell("", "");
}

document.getElementById("mumphone").addEventListener("click", e=>{
  const b = e.target.closest("[data-mum]"); if(!b || !state.flow) return;

function panelKey(){
  if(state.showQs) return "questions";
  if(state.view==="home" && state.phase==="jan" && state.fixed && state.vtax==="done") return "questions";
  if(state.view==="intro") return "intro";
  if(state.view==="home") return state.phase==="now" ? (state.reachedPlan?"home_plan":"home_now") : "home_"+state.phase;
  if(state.view==="lock") return "lock_"+state.phase;
  if(state.view==="perms") return "perms";
  if(state.view==="chat" && state.script==="fix") return "fix";
  if(state.view==="chat" && state.script==="choose") return "choose";
  if(state.view==="chat" && state.script==="corr") return "corr";
  if(state.view==="chat" && state.script==="qa") return state.chatLog.some(m=>m.r==="alert") ? "qa_alert" : "qa";
  if(state.view==="chat") return state.chatLog.some(m=>m.r==="consent") ? "consent" : "chat";
  if(state.view==="told") return "told";
  if(state.view==="change") return "change";
  if(state.view==="plan" || state.view==="step") return state.phase==="later" ? "later" : state.phase==="jan" ? "home_jan" : "plan";
  const id = state.view==="flow" ? state.flow.task : state.taskId;
  const map = {reconfirm:"reconfirm",needs_assess:"needs",carers_assess:"needs",aa_claim:"aa",pension_credit:"checked",council_tax:"ctax",hours:"whatif",flex_request:"flex",carers_allowance:"ca",lpa:"lpa",vtax:"vtax",fix:"fix"};
  return map[id] || "plan";
}
function renderSide(){
  side.hidden = !state.panel;
  if(!state.panel) return;
  const p = PANEL[panelKey()];
  const modes = p.modes ? `<p class="sp-h">How the assistant acts</p><div class="sp-modes">${p.modes.map(([m,t])=>`<p><b>${esc(m)}.</b> ${esc(t)}</p>`).join("")}</div>` : "";
  const choices = p.choices ? `<div class="sp-choices">${p.choices.map(([k,t,d])=>`<button class="sp-choice" data-side="${k}" type="button"><b>${esc(t)}</b><span>${esc(d)}</span></button>`).join("")}</div>` : "";
  const qs = p.qs ? `<div class="sp-qs">${p.qs.map(([k,q,where])=>`<button class="sp-q" data-q="${k}" type="button"><span class="q">${esc(q)}</span><span class="w">See it: ${esc(where)} →</span></button>`).join("")}</div>` : "";
  const facts = p.facts ? `<ul class="sp-needs">${p.facts.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>` : "";
  const foot = p.foot ? `<p class="sp-foot">${esc(p.foot)}</p>` : "";
  const needs = p.needs ? `<p class="sp-h">What has to exist</p><ul class="sp-needs">${p.needs.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>` : "";
  side.innerHTML = `<p class="sp-eyebrow">${esc(p.eyebrow)}</p>
    <h2 class="sp-title">${esc(p.title)}</h2>
    <p class="sp-body">${esc(p.body)}</p>${p.body2?`<p class="sp-body">${esc(p.body2)}</p>`:""}
    ${choices}${qs}${facts}${modes}${needs}${foot}`;
}

/* ============================================================
   Render + routing
   ============================================================ */
function render(){
  if(state.view==="chat" && el.querySelector("#chatbody")){ chatUpdate(); renderSide(); return; }
  const map = {intro:viewIntro,home:viewHome,lock:viewLock,perms:viewPerms,chat:viewChat,plan:viewPlan,told:viewTold,step:viewStep,task:viewTask,flow:viewFlow,change:viewChange};
  const key = state.view + state.phase + (state.taskId||"") + (state.stepId||"") + (state.flow?state.flow.task+state.flow.stage:"") + (state.view==="change"&&state.change?state.change.stage:"");
  const same = el.dataset.view === key;
  const prevScroll = el.querySelector(".body")?.scrollTop || 0;
  el.innerHTML = map[state.view]();
  const scr = el.firstElementChild;
  if(!same){ scr.classList.add("fade"); if(state.dir==="back") scr.classList.add("back"); }
  else { const b = el.querySelector(".body"); if(b) b.scrollTop = prevScroll; }
  el.dataset.view = key;
  if(state.view==="chat") chatUpdate({instant:true});
  renderSide();
  renderMum();
  const jb = document.getElementById("jump");
  jb.disabled = !state.reachedPlan || state.phase==="jan";
  jb.textContent = state.phase==="now" ? "Jump to 18 November" : "Jump to 20 January";
}
function go(view,opts={}){
  setQs(false);
  state.dir = opts.back ? "back" : "fwd";
  state.view = view;
  if(opts.stepId!==undefined) state.stepId = opts.stepId;
  if(opts.taskId!==undefined) state.taskId = opts.taskId;
  render();
}
function goBack(){
  switch(state.view){
    case "flow": state.flow=null; if(state.fromHome){ state.fromHome=false; go("home",{back:true}); } else go("task",{back:true}); break;
    case "chat": if(state.script==="corr"){ corrBack(); break; } state.run++; go("home",{back:true}); break;
    case "perms": go("home",{back:true}); break;
    case "change": state.run++; state.change=null; go("plan",{back:true}); break;
    case "task": go(state.stepId?"step":"plan",{back:true}); break;
    case "step": state.stepId=null; go("plan",{back:true}); break;
    case "told": go("plan",{back:true}); break;
    case "plan": go("home",{back:true}); break;
    default: go("intro",{back:true});
  }
}
function toast(msg){
  state.toast = msg; render();
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ state.toast=null; render(); }, 3400);
}
function startFlow(id){
  const stage = {reconfirm:"review",aa_claim:"ask",carers_allowance:"review",vtax:"review"}[id] || "main";
  state.taskId = id;
  state.flow = {task:id, stage, data:{}};
  go("flow");
}
function runSteps(n){
  const f = state.flow, run = state.run;
  f.data.on = 0; render();
  const tick = ()=>{
    if(run!==state.run || state.flow!==f) return;
    f.data.on++;
    if(f.data.on<n){ advanceRun(f.data.on); setTimeout(tick, 1300); }
    else { advanceRun(f.data.on); setTimeout(()=>{ if(run===state.run && state.flow===f) render(); }, 450); }
  };
  setTimeout(tick, 1300);
}
function finishTo(id, status, receipt, msg){
  state.status[id] = status;
  if(receipt) state.receipts[id] = receipt;
  state.flow = null;
  if(state.fromHome){ state.fromHome=false; go("home",{back:true}); if(msg) toast(msg); return; }
  state.taskId = id;
  go("task",{back:true});
  if(msg) toast(msg);
}

function jumpAhead(){
  if(state.phase==="jan" || !state.reachedPlan) return;
  state.run++;
  state.flow = null; state.stepId = null; state.taskId = null; state.change = null;
  state.fromHome = false; state.script = "plan"; state.toast = null; state.sinceOpen = false;
  if(state.phase==="now") applyLater(); else applyJan();
}
function applyLater(){
  if(state.hours===null){

  }
  state.updating = false;
  state.phase = "later";
  if(state.status.reconfirm!=="done"){

    state.receipts.reconfirm = {title:"Reconfirmed on 20 October",lines:["Tax-Free Childcare and both 30 hours codes valid until 26 January 2027","Codes shared with Little Acorns Nursery"]};
  }
  if(!isDone(state.status.aa_claim)){
    state.receipts.aa_claim = {title:"Sent to DWP on 14 October",lines:["Reference AA 7Q4 2219","Your mum gave permission on her phone","You and your mum checked the answers"]};
  }

  if(state.status.needs_assess!=="done"){

function applyJan(){

  }

function startFix(){
  state.run++;
  state.script = "fix"; state.flow = null;
  state.chatIndex = 1; state.chatLog = [FIX[0]]; state.chatBusy = false; state.typing = false;
  go("chat");
  const run = state.run;
  setTimeout(()=>{ if(run===state.run) chatStep(); }, 700);
}

/* ---------- events ---------- */
el.addEventListener("click", e=>{
  const btn = e.target.closest("[data-act]");
  if(!btn) return;
  const act = btn.dataset.act;
  const f = state.flow;

  if(act==="noop"){ e.preventDefault(); return; }
  if(act==="back"){ goBack(); return; }
  if(act==="restart"){ restart(); return; }
  if(act==="begin"){ go("home"); return; }
  if(act==="homechat"){ startChat(); return; }
  if(act==="corr"){ startCorr(); return; }
  if(act==="corrback"){ corrBack(); return; }
  if(act==="corryes"){
    if(state.newJob) return;
    state.newJob = true; state.standing.payroll = true;
    const b = el.querySelector("#corrcard [data-act=corryes]");
    if(b) b.outerHTML = `<span class="done-note">Updated</span>`;
    state.chatIndex = state.corrScript.length; state.chatBusy = true; state.typing = true; chatUpdate();
    const run = state.run;
    setTimeout(()=>{
      if(run!==state.run) return;
      state.typing = false;
      state.chatLog.push({r:"a",t:"Done. Your new employer is now used across your plan and your forms."});
      state.chatLog.push({r:"corrback"});
      state.chatBusy = false; chatUpdate();
    }, 900);
    return;
  }
  if(act==="travelyes" || act==="travelno"){
    if(state.alertDecided) return;
    const yes = act==="travelyes";
    state.alertDecided = true; state.standing.travel = yes;
    const card = el.querySelector("#alertcard .row2");
    if(card) card.outerHTML = `<span class="done-note">${yes?"Turned on":"Not now"}</span>`;
    state.chatIndex = QA.length; state.chatBusy = true; state.typing = true; chatUpdate();
    const run = state.run;
    setTimeout(()=>{
      if(run!==state.run) return;
      state.typing = false;
      state.chatLog.push({r:"a",t: yes ? "Done. I'll keep an eye on India and let you know if anything changes. You can stop this at any time." : "No problem. Ask me again any time."});
      state.chatLog.push({r:"home"});
      state.chatBusy = false; chatUpdate(); renderSide();
    }, 900);
    return;
  }
  if(act==="ask"){
    if(!state.reachedPlan){ startChoose(); return; }
    else toast("You can ask or tell me anything here. In this demo the conversations are scripted.");
    return;
  }
  if(act==="perms"){ state.flow=null; go("perms"); return; }
  if(act==="perm"){ state.standing[btn.dataset.k] = btn.checked; render(); return; }
  if(act==="stopread"){ toast("In a real version, this would stop me reading this record."); return; }
  if(act==="standing"){ state.standing.reconfirm = btn.checked; return; }
  if(act==="lockopen"){ state.svcOpen = state.phase==="jan" ? "childcare" : null; go("home"); return; }
  if(act==="svcopen"){ state.svcOpen = state.svcOpen===btn.dataset.k ? null : btn.dataset.k; render(); return; }
  if(act==="since"){ state.sinceOpen = !state.sinceOpen; render(); return; }
  if(act==="svc"){ toast(`In a real version, this opens your ${btn.dataset.name.toLowerCase()} details.`); return; }
  if(act==="plan"){ state.stepId=null; go("plan"); return; }
  if(act==="homeflow"){ state.fromHome = true; startFlow(btn.dataset.task); return; }
  if(act==="fix"){ startFix(); return; }
  if(act==="fixsend"){
    if(state.fixed) return;
    state.fromHome = true; state.taskId = "fix";
    state.flow = {task:"fix", stage:"run", data:{}};
    go("flow"); runSteps(RUNS.fix.length);
    return;
  }
  if(act==="fixdone"){
    state.fixed = true;
    state.status.reconfirm = "done";
    state.receipts.reconfirm = {title:"Reconfirmed on 20 January",lines:["Codes valid until 26 April 2027","Tom's new job added. I'll check HMRC's records match after his first payday"]};
    state.flow = null; state.fromHome = false; state.script = "plan"; state.svcOpen = null;
    go("home",{back:true});
    toast("Childcare reconfirmed until 26 April.");
    return;
  }
  if(act==="vtaxdone"){
    state.vtax = "done"; state.flow = null; state.fromHome = false; state.svcOpen = null;
    go("home",{back:true});
    toast("Car tax renewed until 31 January 2028.");
    return;
  }
  if(act==="send"){ sendReply(); return; }
  if(act==="allow"){
    if(state.consented) return;
    state.consented = true;
    const card = el.querySelector("#consentcard .row2");
    if(card) card.outerHTML = `<span class="done-note">Allowed</span>`;
    state.chatBusy = false;
    const run = state.run;
    setTimeout(()=>{ if(run===state.run) chatStep(); }, 380);
    return;
  }
  if(act==="startplan"){ state.reachedPlan = true; state.stepId=null; go("plan"); return; }
  if(act==="told"){ go("told"); return; }
  if(act==="step"){ go("step",{stepId:btn.dataset.step}); return; }
  if(act==="task"){ state.flow=null; state.fromHome=false; go("task",{taskId:btn.dataset.task}); return; }
  if(act==="flow"){ startFlow(btn.dataset.task); return; }
  if(act==="manual"){ toast("This would open the service on GOV.UK."); return; }
  if(act==="change"){ state.change = {stage:"tell"}; go("change"); return; }
  if(act==="chgcheck"){ state.change.stage="check"; runChange(CHG_CHECK, ()=>{ state.change.stage="result"; state.change.on=0; render(); }); return; }
  if(act==="chgatt"){ state.change.att = btn.checked; render(); return; }
  if(act==="chgsend"){
    if(!state.change.att) return;
    state.change.stage="run";
    state.change.items = chgRun();
    const applied = ["submitted","done"].includes(state.status.carers_allowance);
    runChange(state.change.items, ()=>{
      const line = applied ? "Change reported on 2 December: paused 4 January to 28 February, restarts 1 March" : "Your application includes 4 days a week in January and February";
      if(state.receipts.carers_allowance) state.receipts.carers_allowance.lines.push(line);
      else state.receipts.carers_allowance = applied ? {title:"Change reported on 2 December",lines:["Paused 4 January to 28 February, restarts 1 March"]} : {title:"Change added on 2 December",lines:[line]};
      if(state.receipts.reconfirm) state.receipts.reconfirm.lines.push("January reconfirmation includes 4 days a week in January and February");
      state.changeDone = true;
      state.change = null;
      go("plan",{back:true});
      toast(applied ? "DWP and HMRC have been told. Nothing to pay back." : "Your application and childcare reconfirmation are updated.");
    });
    return;
  }

  if(act==="attest"){ f.data.att = btn.checked; render(); return; }
  if(act==="tog"){ f.data[btn.dataset.k] = btn.checked; return; }
  if(act==="slot"){ f.data.slot = +btn.dataset.v; render(); return; }
  if(act==="night"){ f.data.night = +btn.dataset.v; render(); return; }
  if(act==="pick"){ f.data.pick = +btn.dataset.v; render(); return; }

  if(act==="next"){
    if(f.task==="reconfirm"){
      if(f.stage==="review"){ if(!f.data.att) return; f.stage="run"; runSteps(RUNS.reconfirm.length); return; }
      if(f.stage==="run"){ f.stage="share"; render(); return; }
    }
    if(f.task==="aa_claim"){
      if(f.stage==="ask"){ f.stage="mum"; render(); return; }
      if(f.stage==="mum"){ f.stage="review"; render(); return; }
      if(f.stage==="review"){ if(f.data.night===undefined||!f.data.att) return; f.stage="run"; runSteps(RUNS.aa.length); return; }
    }
    if(f.task==="vtax" && f.stage==="review"){ f.stage="run"; runSteps(RUNS.vtax.length); return; }
    if(f.task==="carers_allowance" && f.stage==="review"){ if(!f.data.att) return; f.stage="run"; runSteps(RUNS.ca.length); return; }
    return;
  }
  if(act==="share"){
    state.svcOpen = null;
    const shared = btn.dataset.v==="1";
    finishTo("reconfirm","done",{title:"Reconfirmed on 14 October",lines:["Tax-Free Childcare and both 30 hours codes valid until 26 January 2027", shared?"Codes shared with Little Acorns Nursery":"Codes not shared with the nursery",state.standing.reconfirm?"From now on I'll reconfirm every 3 months and tell you when it's done":"Next reconfirmation: I'll fill it in for you in January"]},
      "Childcare reconfirmed until 26 January.");
    return;
  }
  if(act==="book"){
    const slots = ["Tuesday 20 October, 2pm","Thursday 22 October, 10am","Monday 26 October, 11:30am"];
    const when = slots[f.data.slot];
    state.status.needs_assess = "booked";
    state.receipts.needs_assess = {title:`Booked for ${when}`,lines:["Home visit from Leeds City Council adult social care", f.data.share?"What you told me about your mum's needs has been shared":"Nothing shared in advance","The council will ask your mum if she agrees"]};
    if(f.data.both){
      state.status.carers_assess = "booked";
      state.receipts.carers_assess = {title:`Booked for ${when}`,lines:["At the same visit as your mum's assessment"]};
    }
    finishTo(f.task,"booked",state.receipts[f.task]||{title:`Booked for ${when}`,lines:["On its own visit"]},
      f.data.both ? "Both assessments booked for the same visit." : "Visit booked.");
    return;
  }
  if(act==="choosehours"){
    state.hours = f.data.pick;
    const h = HOURS[state.hours];
    finishTo("hours","done",{title:`You chose ${state.hours===0?"to stop work":h.label.toLowerCase()+" a week"}`,lines:[h.ca?"Carer's Allowance: you could get it once your mum gets Attendance Allowance":"Carer's Allowance: you would earn too much", h.child==="keep"?"Childcare: you keep your codes":"Childcare: check the timing first","I've written your flexible working request"]},
      "Your plan now uses the days you chose.");
    return;
  }
  if(act==="copy"){
    const txt = el.querySelector(".draft")?.textContent || "";
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Request copied."),()=>toast("Select the text to copy it.")); }catch(err){ toast("Select the text to copy it."); }
    return;
  }
  if(act==="markdone"){
    finishTo("flex_request","done",{title:"You sent your request",lines:["Your employer must reply within 2 months","I'll remind you in 4 weeks if you haven't heard"]},"Marked as sent.");
    return;
  }
  if(act==="finish"){
    const id = f.task;
    if(id==="aa_claim") finishTo(id,"submitted",{title:"Sent to DWP on 14 October",lines:["Reference AA 7Q4 2219","Your mum gave permission on her phone","You and your mum checked the answers","I added a note about your mum's fall"]},"Your mum's application has been sent to DWP.");
    if(id==="carers_allowance") finishTo(id,"submitted",{title:"Sent to DWP on 25 November",lines:["Reference CA 3R8 5510","Backdated to 18 November","Earnings worked out from your pay and childcare costs"]},"Your Carer's Allowance application has been sent.");
    return;
  }
  if(act==="gp"){
    finishTo("council_tax","waiting",{title:"Form sent to Chapel Allerton Surgery",lines:["Waiting for Dr Okafor to sign","The council will apply the discount once it has the certificate"]},"Form sent to mum's GP.");
    return;
  }
  if(act==="lpastart"){
    finishTo("lpa","done",{title:"Application started",lines:["Your details are filled in","Next, your mum reads it and signs it. Then someone who knows her signs to confirm she understands it","Then register it with the Office of the Public Guardian (£92)"]},"Application started. Your mum signs it herself.");
    return;
  }
});

function showQuestion(k){

side.addEventListener("click", e=>{

function startCorr(){
  state.run++;
  const fromForm = state.view==="flow" && state.flow;
  state.corrFrom = {flow: fromForm ? state.flow : null, view: state.view==="told" ? "told" : "home"};
  if(fromForm) state.flow.data.att = false;
  state.flow = null;
  state.script = "corr"; state.corrScript = corrScript(!!fromForm);
  state.chatBusy = false; state.typing = false;
  if(fromForm){ state.chatLog = [state.corrScript[0]]; state.chatIndex = 1; } else { state.chatLog = []; state.chatIndex = 0; }
  el.dataset.view = ""; go("chat");
  const run = state.run;
  setTimeout(()=>{ if(run===state.run) chatStep(); }, fromForm ? 600 : 300);

function corrBackLabel(){
  const f = state.corrFrom && state.corrFrom.flow;
  if(f) return f.task==="carers_allowance" ? "Back to your claim" : "Back to your reconfirmation";
  return state.corrFrom && state.corrFrom.view==="told" ? "Back to your plan details" : "Back to home";
}
function corrBack(){
  state.run++;
  const from = state.corrFrom || {}; state.corrFrom = null; state.script = "plan";
  if(from.flow){ state.flow = from.flow; go("flow",{back:true}); }
  else go(from.view==="told" ? "told" : "home", {back:true});
}
function restart(){
  state.run++;
  Object.assign(state,{updating:false,change:null,changeDone:false,view:"intro",stepId:null,taskId:null,status:{...START_STATUS},receipts:{},hours:null,phase:"now",flow:null,
    chatIndex:0,chatLog:[],chatBusy:false,typing:false,consented:false,toast:null,reachedPlan:false,
    script:"plan",standing:{reconfirm:false,recheck:true,earnings:true,travel:false,payroll:false},alertDecided:false,newJob:false,corrFrom:null,fromHome:false,caAwarded:false,vtax:"later",fixed:false});
  el.dataset.view="";
  render();
}
state.run = 0;

/* ---------- stage controls ---------- */
const deviceEl = document.getElementById("device");
const frameBtn = document.getElementById("frametoggle");
function setFrame(on){
  deviceEl.classList.toggle("framed", on);
  frameBtn.textContent = `Device frame: ${on?"on":"off"}`;
  frameBtn.setAttribute("aria-pressed", String(on));
  try{ localStorage.setItem("sc-frame", on?"1":"0"); }catch(e){}
}
let framedPref = true;
try{ const v = localStorage.getItem("sc-frame"); if(v!==null) framedPref = v==="1"; }catch(e){}
setFrame(framedPref);
frameBtn.addEventListener("click", ()=> setFrame(!deviceEl.classList.contains("framed")));

const panelBtn = document.getElementById("paneltoggle");
function setPanel(on){
  state.panel = on;
  panelBtn.textContent = `How this works: ${on?"on":"off"}`;
  panelBtn.setAttribute("aria-pressed", String(on));
  try{ localStorage.setItem("sc-panel", on?"1":"0"); }catch(e){}
  renderSide();
}
try{ const v = localStorage.getItem("sc-panel"); if(v!==null) state.panel = v==="1"; }catch(e){}
panelBtn.addEventListener("click", ()=> setPanel(!state.panel));
document.getElementById("jump").addEventListener("click", jumpAhead);
document.getElementById("restart").addEventListener("click", restart);
function setQs(on){
  state.showQs = on;
  const b = document.getElementById("qbtn");
  if(b) b.setAttribute("aria-pressed", String(on));
}
document.getElementById("qbtn").addEventListener("click", ()=>{
  setQs(!state.showQs);
  if(!state.panel) setPanel(true); else renderSide();
});

setPanel(state.panel);
render();
</script>
