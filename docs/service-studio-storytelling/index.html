ition: border-color 0.3s;\n\t}\n\n\t.step-body .text {\n\t\ttransition: opacity 0.2s;\n\t}\n\n\t.start-disc {\n\t\twidth: 100%;\n\t\theight: 100%;\n\t\tbackground: var(--black);\n\t\tborder: 2px solid #ffffff;\n\t\tborder-radius: 50%;\n\t\tbox-shadow: 0 0 0 1.5px var(--black);\n\t}\n\n\t/* The step being worked on: a blue outline with a soft blue halo, a small square at the top and bottom to\n\t\tconnect from, and a small toolbar beside it. */\n\t.node::before {\n\t\tcontent: '';\n\t\tposition: absolute;\n\t\tinset: -10px -20px;\n\t\tborder-radius: 12px;\n\t\tbackground: rgba(29, 112, 184, 0.1);\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t}\n\n\t.node.selected::before {\n\t\topacity: 1;\n\t}\n\n\t.node.selected .step-body {\n\t\tborder: 2px solid var(--blue);\n\t}\n\n\t.sq {\n\t\tposition: absolute;\n\t\tleft: 50%;\n\t\twidth: 12px;\n\t\theight: 12px;\n\t\tbackground: var(--blue);\n\t\tborder: 2px solid #ffffff;\n\t\tborder-radius: 4px;\n\t\tbox-shadow: 0 0 0 1px var(--blue);\n\t\ttransform: translate(-50%, -50%);\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t}\n\n\t.sq.top { top: 0; }\n\t.sq.bot { top: 100%; }\n\n\t.node.selected .sq {\n\t\topacity: 1;\n\t}\n\n\t.toolbar {\n\t\tposition: absolute;\n\t\ttop: 50%;\n\t\tleft: calc(100% + 34px);\n\t\tdisplay: flex;\n\t\tgap: 2px;\n\t\tpadding: 4px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--soft-border);\n\t\tborder-radius: 12px;\n\t\ttransform: translateY(-50%);\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t}\n\n\t.node.selected .toolbar {\n\t\topacity: 1;\n\t}\n\n\t.tb {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\twidth: 32px;\n\t\theight: 32px;\n\t\tborder-radius: 8px;\n\t}\n\n\t.tb.on {\n\t\tbackground: var(--blue-tint);\n\t}\n\n\t/* The editor for the selected step, docked on the right. It slides in when a step is selected. */\n\t.panel {\n\t\tposition: absolute;\n\t\ttop: 96px;\n\t\tleft: 960px;\n\t\twidth: 384px;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 20px;\n\t\topacity: 0;\n\t\ttransform: translateX(40px);\n\t\ttransition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);\n\t}\n\n\t.panel.in {\n\t\topacity: 1;\n\t\ttransform: none;\n\t}\n\n\t.head {\n\t\tdisplay: flex;\n\t\talign-items: flex-start;\n\t\tjustify-content: space-between;\n\t\tgap: 16px;\n\t}\n\n\t.eyebrow {\n\t\tfont-size: 0.875rem;\n\t\tline-height: 18px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.title {\n\t\tmargin-top: 6px;\n\t\tfont-size: 1.5rem;\n\t\tfont-weight: 700;\n\t\tline-height: 30px;\n\t\ttransition: opacity 0.2s;\n\t}\n\n\t.nav {\n\t\tdisplay: flex;\n\t\tflex-shrink: 0;\n\t\tgap: 6px;\n\t}\n\n\t.nb {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\twidth: 32px;\n\t\theight: 32px;\n\t\tborder: 1px solid var(--soft-border);\n\t\tborder-radius: 8px;\n\t}\n\n\t.f {\n\t\tposition: relative;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 8px;\n\t}\n\n\t.lab {\n\t\tfont-size: 0.875rem;\n\t\tfont-weight: 700;\n\t\tline-height: 18px;\n\t}\n\n\t.control {\n\t\tposition: relative;\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: space-between;\n\t\theight: 44px;\n\t\tpadding: 0 14px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 8px;\n\t\tfont-size: 0.9375rem;\n\t\tline-height: 18px;\n\t\ttransition: border-color 0.15s, box-shadow 0.15s;\n\t}\n\n\t.control.area {\n\t\talign-items: flex-start;\n\t\theight: 76px;\n\t\tpadding: 12px 14px;\n\t\tline-height: 21px;\n\t}\n\n\t.control.focus {\n\t\tborder-color: var(--blue);\n\t\tbox-shadow: 0 0 0 1px var(--blue), 0 0 0 4px rgba(29, 112, 184, 0.16);\n\t}\n\n\t.val {\n\t\twhite-space: pre-wrap;\n\t\toverflow-wrap: anywhere;\n\t}\n\n\t.val.sel {\n\t\tbackground: #b9d6ee;\n\t}\n\n\t.caret {\n\t\tdisplay: none;\n\t\twidth: 2px;\n\t\theight: 18px;\n\t\tmargin-left: 1px;\n\t\tvertical-align: text-bottom;\n\t\tbackground: var(--black);\n\t\tanimation: blink 1s steps(1) infinite;\n\t}\n\n\t.control.focus .caret {\n\t\tdisplay: inline-block;\n\t}\n\n\t@keyframes blink {\n\t\t50% { opacity: 0; }\n\t}\n\n\t.chev {\n\t\tflex-shrink: 0;\n\t\ttransition: transform 0.2s;\n\t}\n\n\t.control.focus .chev {\n\t\ttransform: rotate(180deg);\n\t}\n\n\t/* The small coloured label a step type is shown with. */\n\t.tag {\n\t\tdisplay: inline-block;\n\t\tpadding: 2px 9px;\n\t\tborder-radius: 4px;\n\t\tfont-size: 0.8125rem;\n\t\tline-height: 16px;\n\t\ttransition: background-color 0.2s;\n\t}\n\n\t.menu {\n\t\tposition: absolute;\n\t\tz-index: 5;\n\t\ttop: 76px;\n\t\tleft: 0;\n\t\twidth: 100%;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 2px;\n\t\tpadding: 6px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--soft-border);\n\t\tborder-radius: 12px;\n\t\tbox-shadow: 0 10px 24px -16px rgba(11, 12, 12, 0.35);\n\t\topacity: 0;\n\t\tpointer-events: none;\n\t\ttransition: opacity 0.15s;\n\t}\n\n\t.menu.open {\n\t\topacity: 1;\n\t}\n\n\t.opt {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 12px;\n\t\theight: 46px;\n\t\tpadding: 0 10px;\n\t\tborder-radius: 8px;\n\t\tfont-size: 0.8125rem;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.opt .tag {\n\t\tflex-shrink: 0;\n\t\twidth: 94px;\n\t\ttext-align: center;\n\t}\n\n\t.opt .desc {\n\t\tflex-grow: 1;\n\t}\n\n\t.opt .tick {\n\t\tdisplay: none;\n\t\tflex-shrink: 0;\n\t}\n\n\t.opt.chosen .tick {\n\t\tdisplay: block;\n\t}\n\n\t.opt.chosen .desc,\n\t.opt.hover .desc {\n\t\tcolor: var(--text);\n\t}\n\n\t.opt.hover {\n\t\tbackground: var(--blue-tint);\n\t}\n\n\t.actions {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t}\n\n\t.btn {\n\t\tdisplay: inline-flex;\n\t\talign-items: center;\n\t\tjustify-content: center;\n\t\theight: 40px;\n\t\tpadding: 0 20px;\n\t\tbackground: var(--green);\n\t\tborder-radius: 8px;\n\t\tcolor: #ffffff;\n\t\tfont-size: 0.875rem;\n\t\tfont-weight: 700;\n\t\ttransition: transform 0.1s, filter 0.1s;\n\t}\n\n\t.btn.pressed {\n\t\ttransform: translateY(1px);\n\t\tfilter: brightness(0.92);\n\t}\n\n\t.applied {\n\t\tdisplay: inline-flex;\n\t\talign-items: center;\n\t\tgap: 8px;\n\t\tmargin-left: 18px;\n\t\tfont-size: 0.875rem;\n\t\tfont-weight: 700;\n\t\tcolor: var(--green);\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t}\n\n\t.applied.on {\n\t\topacity: 1;\n\t}\n\n\t/* The pointer sits above everything, at stage level, and finds its targets by measuring them. */\n\t.cursor {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 0;\n\t\theight: 0;\n\t\tpointer-events: none;\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t\tz-index: 10;\n\t}\n\n\t.cursor.visible {\n\t\topacity: 1;\n\t}\n\n\t.cursor svg {\n\t\tposition: absolute;\n\t\ttop: -2px;\n\t\tleft: -2px;\n\t\tfilter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));\n\t}\n\n\t.cursor .click {\n\t\tposition: absolute;\n\t\ttop: -18px;\n\t\tleft: -18px;\n\t\twidth: 36px;\n\t\theight: 36px;\n\t\tborder: 2px solid var(--blue);\n\t\tborder-radius: 50%;\n\t\topacity: 0;\n\t}\n\n\t.cursor.clicking .click {\n\t\tanimation: click 0.45s ease-out;\n\t}\n\n\t@keyframes click {\n\t\t0% { opacity: 0.8; transform: scale(0.4); }\n\t\t100% { opacity: 0; transform: scale(1.3); }\n\t}\n\n\t@media (prefers-reduced-motion: reduce) {\n\t\t.node,\n\t\t.node::before,\n\t\t.sq,\n\t\t.toolbar,\n\t\t.fadeable,\n\t\t.step-body,\n\t\t.step-body .text,\n\t\t.panel,\n\t\t.title,\n\t\t.control,\n\t\t.chev,\n\t\t.tag,\n\t\t.menu,\n\t\t.btn,\n\t\t.applied {\n\t\t\ttransition: none;\n\t\t}\n\n\t\t.node.pop > .inner,\n\t\t.cursor.clicking .click,\n\t\t.caret {\n\t\t\tanimation: none;\n\t\t}\n\t}\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n\t<h1 class=\"sr-only\">Editing a step in Service Studio<\/h1>\n\n\t<div class=\"viewport\" id=\"viewport\">\n\t\t<!-- The drawing is for sight only. What is happening is repeated in plain text just below for screen readers. -->\n\t\t<div class=\"stage\" id=\"stage\" aria-hidden=\"true\">\n\t\t\t<div class=\"canvas\" id=\"canvas\">\n\t\t\t\t<div class=\"world fadeable\" id=\"world\">\n\t\t\t\t\t<svg class=\"edges\" id=\"edges\" width=\"900\" height=\"900\"><\/svg>\n\t\t\t\t\t<div id=\"nodes\"><\/div>\n\t\t\t\t<\/div>\n\t\t\t<\/div>\n\t\t\t<div class=\"canvas-fade\"><\/div>\n\n\t\t\t<div class=\"panel fadeable\" id=\"panel\">\n\t\t\t\t<div class=\"head\">\n\t\t\t\t\t<div>\n\t\t\t\t\t\t<div class=\"eyebrow\">Editing \u00b7 step 4 of 4<\/div>\n\t\t\t\t\t\t<div class=\"title\" id=\"head-title\">Choose how to enter your address<\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t\t<div class=\"nav\">\n\t\t\t\t\t\t<span class=\"nb\"><svg width=\"10\" height=\"6\" viewBox=\"0 0 10 6\"><path d=\"M1 5 L5 1 L9 5\" fill=\"none\" stroke=\"#b1b4b6\" stroke-width=\"1.6\"/><\/svg><\/span>\n\t\t\t\t\t\t<span class=\"nb\"><svg width=\"10\" height=\"6\" viewBox=\"0 0 10 6\"><path d=\"M1 1 L5 5 L9 1\" fill=\"none\" stroke=\"#0b0c0c\" stroke-width=\"1.6\"/><\/svg><\/span>\n\t\t\t\t\t<\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"f\">\n\t\t\t\t\t<div class=\"lab\">Step name<\/div>\n\t\t\t\t\t<div class=\"control\" id=\"name\"><span class=\"text\"><span class=\"val\"><\/span><i class=\"caret\"><\/i><\/span><\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"f\">\n\t\t\t\t\t<div class=\"lab\">Step description<\/div>\n\t\t\t\t\t<div class=\"control area\" id=\"desc\"><span class=\"text\"><span class=\"val\"><\/span><i class=\"caret\"><\/i><\/span><\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"f\">\n\t\t\t\t\t<div class=\"lab\">Step type<\/div>\n\t\t\t\t\t<div class=\"control\" id=\"type\">\n\t\t\t\t\t\t<span class=\"tag\" id=\"type-tag\"><\/span>\n\t\t\t\t\t\t<svg class=\"chev\" width=\"11\" height=\"7\" viewBox=\"0 0 11 7\"><path d=\"M1 1 L5.5 6 L10 1\" fill=\"none\" stroke=\"#0b0c0c\" stroke-width=\"1.6\"/><\/svg>\n\t\t\t\t\t<\/div>\n\t\t\t\t\t<div class=\"menu\" id=\"menu\"><\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"actions\">\n\t\t\t\t\t<span class=\"btn\" id=\"apply\">Apply changes<\/span>\n\t\t\t\t\t<span class=\"applied\" id=\"applied\"><svg width=\"14\" height=\"11\" viewBox=\"0 0 14 11\"><path d=\"M1.5 5.5L5 9L12.5 1.5\" fill=\"none\" stroke=\"#00703c\" stroke-width=\"2.4\"/><\/svg>Changes applied<\/span>\n\t\t\t\t<\/div>\n\t\t\t<\/div>\n\n\t\t\t<div class=\"cursor\" id=\"cursor\">\n\t\t\t\t<span class=\"click\"><\/span>\n\t\t\t\t<svg width=\"18\" height=\"24\" viewBox=\"0 0 22 28\"><path d=\"M2 2 L2 22 L7 17 L11 26 L14 24.5 L10 16 L17 16 Z\" fill=\"#0b0c0c\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><\/svg>\n\t\t\t<\/div>\n\t\t<\/div>\n\t<\/div>\n\t<p class=\"sr-only\" id=\"live\" aria-live=\"polite\"><\/p>\n<\/main>\n\n<script>\n\t// The part of the service shown on the canvas, by centre. The last step is the one that gets edited.\n\tconst NODES = {\n\t\tbegin: { kind: 'start', x: 450, y: 280, w: 36, h: 36 },\n\t\tcheck: { kind: 'step', x: 450, y: 360, w: 260, h: 42, text: 'Check you can use this service' },\n\t\tlicence: { kind: 'step', x: 450, y: 440, w: 260, h: 42, text: 'Enter your driving licence number' },\n\t\tidentity: { kind: 'step', x: 450, y: 520, w: 260, h: 42, text: 'Confirm your identity' },\n\t\tchoose: { kind: 'step', x: 450, y: 600, w: 260, h: 42, text: 'Choose how to enter your address' }\n\t};\n\tconst LINES = [['begin', 'check'], ['check', 'licence'], ['licence', 'identity'], ['identity', 'choose']];\n\n\t// What the step starts with, and what it is changed to. appendText is typed on the end of the old\n\t// description rather than replacing it.\n\tconst START = {\n\t\tname: 'Choose how to enter your address',\n\t\tdesc: 'Fork between postcode lookup and manual entry.',\n\t\ttype: 'Information'\n\t};\n\tconst EDIT = {\n\t\tname: 'Choose how to find your address',\n\t\tappendText: ' Postcode lookup only covers Great Britain.',\n\t\ttype: 'API endpoint'\n\t};\n\n\t// The kinds of step, each with the colours of its label and a short description for the menu.\n\tconst TYPES = [\n\t\t{ name: 'Information', desc: 'Shows content', bg: '#e6e6e2', fg: '#0b0c0c' },\n\t\t{ name: 'API endpoint', desc: 'Calls an endpoint', bg: '#d7e4f4', fg: '#0b0c0c' },\n\t\t{ name: 'Phone', desc: 'Citizen is asked to call', bg: '#e3ddf1', fg: '#2d1f63' },\n\t\t{ name: 'In person', desc: 'Citizen visits', bg: '#cce2d8', fg: '#005a30' },\n\t\t{ name: 'Letter', desc: 'Sent by post', bg: '#fbe5d0', fg: '#6b3a00' }\n\t];\n\n\tconst OVERVIEW = { s: 1, fx: 450, fy: 450 };\n\tconst SVG_NS = 'http://www.w3.org/2000/svg';\n\tconst $ = (id) => document.getElementById(id);\n\n\tconst stage = $('stage');\n\tconst viewport = $('viewport');\n\tconst canvas = $('canvas');\n\tconst world = $('world');\n\tconst cursorEl = $('cursor');\n\tconst panel = $('panel');\n\n\tconst nodeEls = {};\n\tconst optionEls = {};\n\tlet cam = { ...OVERVIEW };\n\tlet cursor = { x: 780, y: 760 };\n\n\t/**\n\t * Draws the stage once: a shape for every entry in NODES, the lines between them, and the options of the\n\t * step type menu. The timeline only ever shows and changes these, it never creates them.\n\t */\n\tfunction build() {\n\t\tfor (const [id, c] of Object.entries(NODES)) {\n\t\t\tconst el = document.createElement('div');\n\t\t\tel.className = `node ${c.kind}`;\n\t\t\tel.style.width = c.w + 'px';\n\t\t\tel.style.height = c.h + 'px';\n\t\t\tel.style.transform = `translate(${c.x - c.w / 2}px, ${c.y - c.h / 2}px)`;\n\t\t\tel.innerHTML =\n\t\t\t\tc.kind === 'step'\n\t\t\t\t\t? `<div class=\"inner step-body\"><span class=\"text\">${c.text}<\/span><\/div>\n\t\t\t\t\t\t<i class=\"sq top\"><\/i><i class=\"sq bot\"><\/i>\n\t\t\t\t\t\t<div class=\"toolbar\">\n\t\t\t\t\t\t\t<span class=\"tb on\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M2 12 L2.6 9.4 L9.6 2.4 L11.6 4.4 L4.6 11.4 Z\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><\/svg><\/span>\n\t\t\t\t\t\t\t<span class=\"tb\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><rect x=\"4\" y=\"4\" width=\"8\" height=\"8\" rx=\"1.5\" fill=\"none\" stroke=\"#505a5f\" stroke-width=\"1.5\"/><path d=\"M2 9 V3 Q2 2 3 2 H9\" fill=\"none\" stroke=\"#505a5f\" stroke-width=\"1.5\"/><\/svg><\/span>\n\t\t\t\t\t\t\t<span class=\"tb\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M2.5 4 H11.5 M5 4 V2.5 H9 V4 M4 4 L4.5 12 H9.5 L10 4\" fill=\"none\" stroke=\"#d4351c\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><\/svg><\/span>\n\t\t\t\t\t\t<\/div>`\n\t\t\t\t\t: `<div class=\"inner\"><div class=\"start-disc\"><\/div><\/div>`;\n\t\t\t$('nodes').appendChild(el);\n\t\t\tnodeEls[id] = el;\n\t\t}\n\n\t\tfor (const [from, to] of LINES) {\n\t\t\tconst a = NODES[from];\n\t\t\tconst b = NODES[to];\n\t\t\tconst path = document.createElementNS(SVG_NS, 'path');\n\t\t\tpath.setAttribute('class', 'edge');\n\t\t\tpath.setAttribute('d', `M${a.x} ${a.y + a.h / 2}V${b.y - b.h / 2}`);\n\t\t\t$('edges').appendChild(path);\n\t\t}\n\n\t\tfor (const type of TYPES) {\n\t\t\tconst row = document.createElement('div');\n\t\t\trow.className = 'opt';\n\t\t\trow.innerHTML = `<span class=\"tag\" style=\"background:${type.bg};color:${type.fg}\">${type.name}<\/span><span class=\"desc\">${type.desc}<\/span><svg class=\"tick\" width=\"14\" height=\"11\" viewBox=\"0 0 14 11\"><path d=\"M1.5 5.5 L5 9 L12.5 1.5\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2.2\"/><\/svg>`;\n\t\t\t$('menu').appendChild(row);\n\t\t\toptionEls[type.name] = row;\n\t\t}\n\t}\n\n\t/**\n\t * Scales the fixed size stage to the width it has been given.\n\t */\n\tfunction fit() {\n\t\tstage.style.transform = `scale(${viewport.clientWidth / 1440})`;\n\t}\n\n\tconst clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\n\tconst lerp = (a, b, t) => a + (b - a) * t;\n\tconst easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);\n\n\t/**\n\t * Runs onFrame with a 0 to 1 progress value over the given milliseconds, and resolves when it is done.\n\t */\n\tfunction tween(ms, onFrame, ease = easeInOut) {\n\t\treturn new Promise((resolve) => {\n\t\t\tconst start = performance.now();\n\t\t\tfunction frame(now) {\n\t\t\t\tconst t = clamp((now - start) / ms, 0, 1);\n\t\t\t\tonFrame(ease(t));\n\t\t\t\tif (t < 1) requestAnimationFrame(frame);\n\t\t\t\telse resolve();\n\t\t\t}\n\t\t\trequestAnimationFrame(frame);\n\t\t});\n\t}\n\n\tconst wait = (ms) => tween(ms, () => {}, (t) => t);\n\n\t/**\n\t * Sets the view: the zoom, and the point of the drawing that sits in the middle of the canvas. The dot\n\t * grid is moved and spaced with it so the whole canvas, not just the shapes, appears to zoom.\n\t */\n\tfunction setCamera(s, fx, fy) {\n\t\tcam = { s, fx, fy };\n\t\tconst tx = 450 - fx * s;\n\t\tconst ty = 450 - fy * s;\n\t\tworld.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;\n\t\tcanvas.style.backgroundSize = `${30 * s}px ${30 * s}px`;\n\t\tcanvas.style.backgroundPosition = `${tx}px ${ty}px`;\n\t}\n\n\t/**\n\t * Eases the view to a new zoom and centre.\n\t */\n\tfunction moveCamera(s, fx, fy, ms) {\n\t\tconst from = { ...cam };\n\t\treturn tween(ms, (e) =>\n\t\t\tsetCamera(from.s * Math.pow(s / from.s, e), lerp(from.fx, fx, e), lerp(from.fy, fy, e))\n\t\t);\n\t}\n\n\t/**\n\t * Puts the pointer at a point on the stage.\n\t */\n\tfunction setCursor(x, y) {\n\t\tcursor = { x, y };\n\t\tcursorEl.style.transform = `translate(${x}px, ${y}px)`;\n\t}\n\n\t/**\n\t * Finds the middle of an element on the stage, wherever it has got to, including while the view is\n\t * zoomed or the editor is still sliding in.\n\t */\n\tfunction centreOf(el, dx = 0, dy = 0) {\n\t\tconst box = stage.getBoundingClientRect();\n\t\tconst scale = box.width / 1440;\n\t\tconst r = el.getBoundingClientRect();\n\t\treturn { x: (r.left + r.width / 2 - box.left) / scale + dx, y: (r.top + r.height / 2 - box.top) / scale + dy };\n\t}\n\n\t/**\n\t * Slides the pointer to the middle of an element.\n\t */\n\tfunction moveToEl(el, ms = 700, dx = 0, dy = 0) {\n\t\tconst from = { ...cursor };\n\t\tconst to = centreOf(el, dx, dy);\n\t\treturn tween(ms, (e) => setCursor(lerp(from.x, to.x, e), lerp(from.y, to.y, e)));\n\t}\n\n\t/**\n\t * Moves to an element and clicks it, with a ring that spreads from the point of the click.\n\t */\n\tasync function click(el, ms = 700, dx = 0, dy = 0) {\n\t\tawait moveToEl(el, ms, dx, dy);\n\t\tcursorEl.classList.remove('clicking');\n\t\tvoid cursorEl.offsetWidth;\n\t\tcursorEl.classList.add('clicking');\n\t\tawait wait(220);\n\t}\n\n\t/**\n\t * Presses a button down and lets it up again.\n\t */\n\tasync function press(el) {\n\t\tel.classList.add('pressed');\n\t\tawait wait(160);\n\t\tel.classList.remove('pressed');\n\t}\n\n\t/**\n\t * Tells screen readers what is happening, in plain words.\n\t */\n\tfunction say(text) {\n\t\t$('live').textContent = text;\n\t}\n\n\tconst valOf = (field) => field.querySelector('.val');\n\tconst setFocus = (field, on) => field.classList.toggle('focus', on);\n\n\t/**\n\t * Types text onto the end of whatever a field already says, a letter at a time.\n\t */\n\tasync function typeOnto(field, text, ms) {\n\t\tconst val = valOf(field);\n\t\tconst base = val.textContent;\n\t\tawait tween(ms, (e) => {\n\t\t\tval.textContent = base + text.slice(0, Math.round(e * text.length));\n\t\t}, (t) => t);\n\t}\n\n\t/**\n\t * Replaces what a field says: the old text is highlighted, as if selected, then typed over.\n\t */\n\tasync function typeOver(field, text, ms) {\n\t\tconst val = valOf(field);\n\t\tval.classList.add('sel');\n\t\tawait wait(500);\n\t\tval.classList.remove('sel');\n\t\tval.textContent = '';\n\t\tawait typeOnto(field, text, ms);\n\t}\n\n\t/**\n\t * Shows a step type in the field as its coloured label, and ticks it in the menu.\n\t */\n\tfunction showType(name) {\n\t\tconst type = TYPES.find((t) => t.name === name);\n\t\tconst tag = $('type-tag');\n\t\ttag.textContent = type.name;\n\t\ttag.style.background = type.bg;\n\t\ttag.style.color = type.fg;\n\t\tfor (const [key, row] of Object.entries(optionEls)) row.classList.toggle('chosen', key === name);\n\t}\n\n\t/**\n\t * Puts everything back to the start: the step unselected, the editor closed and its fields as they were.\n\t */\n\tfunction reset() {\n\t\tworld.classList.remove('fade');\n\t\tpanel.classList.remove('fade', 'in');\n\t\tcursorEl.classList.remove('visible', 'clicking');\n\t\tsetCamera(OVERVIEW.s, OVERVIEW.fx, OVERVIEW.fy);\n\t\tsetCursor(780, 760);\n\t\tfor (const [id, c] of Object.entries(NODES)) {\n\t\t\tnodeEls[id].classList.remove('show', 'selected', 'pop');\n\t\t\tif (c.text) nodeEls[id].querySelector('.text').textContent = c.text;\n\t\t}\n\t\t$('head-title').textContent = START.name;\n\t\tvalOf($('name')).textContent = START.name;\n\t\tvalOf($('desc')).textContent = START.desc;\n\t\tshowType(START.type);\n\t\tfor (const id of ['name', 'desc', 'type']) setFocus($(id), false);\n\t\t$('menu').classList.remove('open');\n\t\tObject.values(optionEls).forEach((o) => o.classList.remove('hover'));\n\t\t$('applied').classList.remove('on');\n\t}\n\n\t/**\n\t * The whole story, in order: a step is selected, its editor opens, and its name, description and type\n\t * are changed before the changes are applied.\n\t */\n\tasync function run() {\n\t\treset();\n\t\tawait wait(500);\n\t\tObject.values(nodeEls).forEach((el) => el.classList.add('show'));\n\t\tawait wait(1200);\n\n\t\t// Select the step on the canvas, and bring the editor in beside it.\n\t\tsay('Selecting a step on the canvas');\n\t\tcursorEl.classList.add('visible');\n\t\tawait click(nodeEls.choose, 900);\n\t\tnodeEls.choose.classList.add('selected');\n\t\tpanel.classList.add('in');\n\t\tawait moveCamera(1.15, 450, 600, 900);\n\t\tawait wait(500);\n\n\t\t// Rename the step.\n\t\tsay('Changing the step name');\n\t\tawait click($('name'));\n\t\tsetFocus($('name'), true);\n\t\tawait wait(300);\n\t\tawait typeOver($('name'), EDIT.name, 1100);\n\t\tawait wait(400);\n\n\t\t// Add to the description.\n\t\tsay('Adding to the step description');\n\t\tsetFocus($('name'), false);\n\t\tawait click($('desc'), 700, 120, 20);\n\t\tsetFocus($('desc'), true);\n\t\tawait wait(300);\n\t\tawait typeOnto($('desc'), EDIT.appendText, 1300);\n\t\tawait wait(400);\n\n\t\t// Change the type from the menu.\n\t\tsay('Choosing a step type');\n\t\tsetFocus($('desc'), false);\n\t\tawait click($('type'));\n\t\tsetFocus($('type'), true);\n\t\t$('menu').classList.add('open');\n\t\tawait wait(500);\n\t\tconst option = optionEls[EDIT.type];\n\t\tawait moveToEl(option, 700, -40);\n\t\toption.classList.add('hover');\n\t\tawait wait(450);\n\t\tawait click(option, 150, -40);\n\t\tshowType(EDIT.type);\n\t\t$('menu').classList.remove('open');\n\t\tsetFocus($('type'), false);\n\t\tawait wait(600);\n\n\t\t// Apply the changes: the step on the canvas takes the new name.\n\t\tsay('Applying the changes');\n\t\tawait click($('apply'), 800);\n\t\tawait press($('apply'));\n\t\t$('applied').classList.add('on');\n\t\t$('head-title').textContent = EDIT.name;\n\t\tconst label = nodeEls.choose.querySelector('.text');\n\t\tlabel.style.opacity = '0';\n\t\tawait wait(220);\n\t\tlabel.textContent = EDIT.name;\n\t\tlabel.style.opacity = '1';\n\t\tnodeEls.choose.classList.add('pop');\n\t\tawait wait(2800);\n\n\t\tcursorEl.classList.remove('visible');\n\t\tworld.classList.add('fade');\n\t\tpanel.classList.add('fade');\n\t\tawait wait(1000);\n\t}\n\n\t/**\n\t * Runs the story over and over.\n\t */\n\tasync function loop() {\n\t\twhile (true) await run();\n\t}\n\n\t/**\n\t * Shows the finished result straight away, with nothing moving, for anyone who has asked their device\n\t * to reduce motion.\n\t */\n\tfunction showFinal() {\n\t\treset();\n\t\tObject.values(nodeEls).forEach((el) => el.classList.add('show'));\n\t\tnodeEls.choose.classList.add('selected');\n\t\tnodeEls.choose.querySelector('.text').textContent = EDIT.name;\n\t\tsetCamera(1.15, 450, 600);\n\t\tpanel.classList.add('in');\n\t\t$('head-title').textContent = EDIT.name;\n\t\tvalOf($('name')).textContent = EDIT.name;\n\t\tvalOf($('desc')).textContent = START.desc + EDIT.appendText;\n\t\tshowType(EDIT.type);\n\t\t$('applied').classList.add('on');\n\t\tsay('The step has been renamed, described and given a new type');\n\t}\n\n\tbuild();\n\tfit();\n\tnew ResizeObserver(fit).observe(viewport);\n\n\tif (matchMedia('(prefers-reduced-motion: reduce)').matches) showFinal();\n\telse loop();\n<\/script>\n<\/body>\n<\/html>\n" },
		{ name: "Adding context for the agent", source: "<!doctype html>\n<html lang=\"en-GB\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Service Studio: adding context for the agent<\/title>\n<!--\n\tA self contained animation of adding context for the agent in Service Studio. A step is selected, and in\n\tits editor a web page is added, then a note about that page saying what it is for. Everything it needs\n\tis in this one file, so it can be shared or opened on its own. To change what is shown, edit the NODES,\n\tthe CONTEXT values and the run() timeline in the script at the bottom.\n-->\n<style>\n\t:root {\n\t\t--text: #0b0c0c;\n\t\t--secondary-text: #505a5f;\n\t\t--muted: #737373;\n\t\t--border: #b1b4b6;\n\t\t--soft-border: #d8d8d3;\n\t\t--node-border: #c9cac6;\n\t\t--line: #7b8387;\n\t\t--blue: #1d70b8;\n\t\t--blue-tint: #e8f1f8;\n\t\t--green: #00703c;\n\t\t--black: #0b0c0c;\n\t}\n\n\t* {\n\t\tbox-sizing: border-box;\n\t}\n\n\tbody {\n\t\tmargin: 0;\n\t\tpadding: 20px;\n\t\tmin-height: 100vh;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tbackground: #ffffff;\n\t\tcolor: var(--text);\n\t\tfont-family: 'GDS Transport', arial, sans-serif;\n\t}\n\n\t/* The animation is kept as wide as the window allows, but never so wide that its height runs off the bottom. */\n\t.wrap {\n\t\twidth: min(100%, 1440px, calc((100vh - 40px) * 1.6));\n\t}\n\n\t.sr-only {\n\t\tposition: absolute;\n\t\twidth: 1px;\n\t\theight: 1px;\n\t\tmargin: -1px;\n\t\tpadding: 0;\n\t\toverflow: hidden;\n\t\tclip: rect(0, 0, 0, 0);\n\t\twhite-space: nowrap;\n\t\tborder: 0;\n\t}\n\n\t/* The stage is drawn at a fixed 1440 by 900 and scaled to fit, so every position below is in the same\n\t\tsimple coordinates whatever size the page is viewed at. */\n\t.viewport {\n\t\tposition: relative;\n\t\twidth: 100%;\n\t\taspect-ratio: 1440 / 900;\n\t\toverflow: hidden;\n\t\tbackground: #ffffff;\n\t}\n\n\t.stage {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 1440px;\n\t\theight: 900px;\n\t\ttransform-origin: 0 0;\n\t}\n\n\t/* The window onto the drawing: a square of dotted canvas. What is inside it, the world, is what gets\n\t\tzoomed and moved. */\n\t.canvas {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 900px;\n\t\theight: 900px;\n\t\toverflow: hidden;\n\t\tbackground-image: radial-gradient(circle at 2px 2px, #e6e6e2 1.2px, transparent 1.7px);\n\t\tbackground-size: 30px 30px;\n\t}\n\n\t.world {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 900px;\n\t\theight: 900px;\n\t\ttransform-origin: 0 0;\n\t}\n\n\t.fadeable {\n\t\ttransition: opacity 0.6s ease;\n\t}\n\n\t.fadeable.fade {\n\t\topacity: 0;\n\t}\n\n\t/* Softens the right hand edge of the canvas into the white behind the editor. */\n\t.canvas-fade {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 780px;\n\t\twidth: 120px;\n\t\theight: 900px;\n\t\tbackground: linear-gradient(90deg, rgba(255, 255, 255, 0), #ffffff);\n\t\tpointer-events: none;\n\t}\n\n\t.edges {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\tpointer-events: none;\n\t}\n\n\t.edge {\n\t\tfill: none;\n\t\tstroke: var(--line);\n\t\tstroke-width: 1.5;\n\t\tstroke-linecap: round;\n\t}\n\n\t.node {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\topacity: 0;\n\t\ttransition: opacity 0.4s ease;\n\t}\n\n\t.node.show {\n\t\topacity: 1;\n\t}\n\n\t.inner {\n\t\tposition: relative;\n\t\twidth: 100%;\n\t\theight: 100%;\n\t}\n\n\t.step-body {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: center;\n\t\tpadding: 0 10px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--node-border);\n\t\tborder-radius: 6px;\n\t\tfont-size: 0.875rem;\n\t\tfont-weight: 700;\n\t\tline-height: 1.2;\n\t\ttext-align: center;\n\t}\n\n\t.start-disc {\n\t\twidth: 100%;\n\t\theight: 100%;\n\t\tbackground: var(--black);\n\t\tborder: 2px solid #ffffff;\n\t\tborder-radius: 50%;\n\t\tbox-shadow: 0 0 0 1.5px var(--black);\n\t}\n\n\t/* The step being worked on: a blue outline with a soft blue halo, a small square at the top and bottom to\n\t\tconnect from, and a small toolbar beside it. */\n\t.node::before {\n\t\tcontent: '';\n\t\tposition: absolute;\n\t\tinset: -10px -20px;\n\t\tborder-radius: 12px;\n\t\tbackground: rgba(29, 112, 184, 0.1);\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t}\n\n\t.node.selected::before {\n\t\topacity: 1;\n\t}\n\n\t.node.selected .step-body {\n\t\tborder: 2px solid var(--blue);\n\t}\n\n\t.sq {\n\t\tposition: absolute;\n\t\tleft: 50%;\n\t\twidth: 12px;\n\t\theight: 12px;\n\t\tbackground: var(--blue);\n\t\tborder: 2px solid #ffffff;\n\t\tborder-radius: 4px;\n\t\tbox-shadow: 0 0 0 1px var(--blue);\n\t\ttransform: translate(-50%, -50%);\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t}\n\n\t.sq.top { top: 0; }\n\t.sq.bot { top: 100%; }\n\n\t.node.selected .sq {\n\t\topacity: 1;\n\t}\n\n\t.toolbar {\n\t\tposition: absolute;\n\t\ttop: 50%;\n\t\tleft: calc(100% + 34px);\n\t\tdisplay: flex;\n\t\tgap: 2px;\n\t\tpadding: 4px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--soft-border);\n\t\tborder-radius: 12px;\n\t\ttransform: translateY(-50%);\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t}\n\n\t.node.selected .toolbar {\n\t\topacity: 1;\n\t}\n\n\t.tb {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\twidth: 32px;\n\t\theight: 32px;\n\t\tborder-radius: 8px;\n\t}\n\n\t.tb.on {\n\t\tbackground: var(--blue-tint);\n\t}\n\n\t/* The editor for the selected step, docked on the right. It slides in when a step is selected. */\n\t.panel {\n\t\tposition: absolute;\n\t\ttop: 96px;\n\t\tleft: 960px;\n\t\twidth: 384px;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 20px;\n\t\topacity: 0;\n\t\ttransform: translateX(40px);\n\t\ttransition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);\n\t}\n\n\t.panel.in {\n\t\topacity: 1;\n\t\ttransform: none;\n\t}\n\n\t.head {\n\t\tdisplay: flex;\n\t\talign-items: flex-start;\n\t\tjustify-content: space-between;\n\t\tgap: 16px;\n\t}\n\n\t.eyebrow {\n\t\tfont-size: 0.875rem;\n\t\tline-height: 18px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.title {\n\t\tmargin-top: 6px;\n\t\tfont-size: 1.5rem;\n\t\tfont-weight: 700;\n\t\tline-height: 30px;\n\t}\n\n\t.nav {\n\t\tdisplay: flex;\n\t\tflex-shrink: 0;\n\t\tgap: 6px;\n\t}\n\n\t.nb {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\twidth: 32px;\n\t\theight: 32px;\n\t\tborder: 1px solid var(--soft-border);\n\t\tborder-radius: 8px;\n\t}\n\n\t.f {\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 8px;\n\t}\n\n\t.lab {\n\t\tfont-size: 0.875rem;\n\t\tfont-weight: 700;\n\t\tline-height: 18px;\n\t}\n\n\t.control {\n\t\tposition: relative;\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: space-between;\n\t\tmin-height: 44px;\n\t\tpadding: 0 14px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 8px;\n\t\tfont-size: 0.9375rem;\n\t\tline-height: 18px;\n\t\ttransition: border-color 0.15s, box-shadow 0.15s;\n\t}\n\n\t.control.small {\n\t\tmin-height: 40px;\n\t\tpadding: 0 12px;\n\t\tfont-size: 0.8125rem;\n\t}\n\n\t.control.area {\n\t\talign-items: flex-start;\n\t\tmin-height: 88px;\n\t\tpadding: 10px 12px;\n\t\tline-height: 20px;\n\t}\n\n\t.control.focus {\n\t\tborder-color: var(--blue);\n\t\tbox-shadow: 0 0 0 1px var(--blue), 0 0 0 4px rgba(29, 112, 184, 0.16);\n\t}\n\n\t.val {\n\t\twhite-space: pre-wrap;\n\t\toverflow-wrap: anywhere;\n\t}\n\n\t.val:empty::before {\n\t\tcontent: attr(data-ph);\n\t\tcolor: var(--muted);\n\t}\n\n\t.control.focus .val:empty::before {\n\t\tcontent: '';\n\t}\n\n\t.caret {\n\t\tdisplay: none;\n\t\twidth: 2px;\n\t\theight: 17px;\n\t\tmargin-left: 1px;\n\t\tvertical-align: text-bottom;\n\t\tbackground: var(--black);\n\t\tanimation: blink 1s steps(1) infinite;\n\t}\n\n\t.control.focus .caret {\n\t\tdisplay: inline-block;\n\t}\n\n\t@keyframes blink {\n\t\t50% { opacity: 0; }\n\t}\n\n\t.tag {\n\t\tdisplay: inline-block;\n\t\tpadding: 2px 9px;\n\t\tborder-radius: 4px;\n\t\tfont-size: 0.8125rem;\n\t\tline-height: 16px;\n\t}\n\n\t/* A part that grows open: it holds nothing until switched on, then eases to its full height. */\n\t.rv {\n\t\tdisplay: grid;\n\t\tgrid-template-rows: 0fr;\n\t\topacity: 0;\n\t\ttransition: grid-template-rows 0.45s ease, opacity 0.3s ease;\n\t}\n\n\t.rv.on {\n\t\tgrid-template-rows: 1fr;\n\t\topacity: 1;\n\t}\n\n\t.rv > .clip {\n\t\tmin-height: 0;\n\t\toverflow: hidden;\n\t}\n\n\t.rv .pad {\n\t\tpadding-top: 16px;\n\t}\n\n\t.ctx-sum {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 9px;\n\t\tcolor: var(--blue);\n\t\tfont-size: 0.9375rem;\n\t\tline-height: 18px;\n\t\ttext-decoration: underline 1px;\n\t\ttext-underline-offset: 3px;\n\t}\n\n\t.ctx-sum svg {\n\t\tflex-shrink: 0;\n\t\ttransition: transform 0.3s;\n\t}\n\n\t.ctx.open .ctx-sum svg {\n\t\ttransform: rotate(180deg);\n\t}\n\n\t.hint {\n\t\tmargin: 0;\n\t\tfont-size: 0.8125rem;\n\t\tline-height: 19px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.card {\n\t\tdisplay: flex;\n\t\talign-items: flex-start;\n\t\tgap: 12px;\n\t\tpadding: 13px;\n\t\tborder: 1px solid var(--soft-border);\n\t\tborder-radius: 10px;\n\t}\n\n\t.tile {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tflex-shrink: 0;\n\t\twidth: 30px;\n\t\theight: 30px;\n\t\tborder-radius: 8px;\n\t\tbackground: var(--blue-tint);\n\t}\n\n\t.tile.grey {\n\t\tbackground: #efefeb;\n\t}\n\n\t.card .body {\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tflex-grow: 1;\n\t\tgap: 2px;\n\t}\n\n\t.card .name {\n\t\tfont-size: 0.875rem;\n\t\tfont-weight: 700;\n\t\tline-height: 19px;\n\t}\n\n\t.card .link {\n\t\tfont-size: 0.78rem;\n\t\tline-height: 17px;\n\t\tcolor: var(--blue);\n\t\ttext-decoration: underline;\n\t}\n\n\t.card .for {\n\t\tmargin: 4px 0 2px;\n\t\tpadding-left: 10px;\n\t\tborder-left: 2px solid var(--soft-border);\n\t\tfont-size: 0.8125rem;\n\t\tline-height: 18px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.card .read {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 5px;\n\t\tpadding-top: 2px;\n\t\tfont-size: 0.75rem;\n\t\tline-height: 16px;\n\t\tcolor: var(--green);\n\t}\n\n\t/* The note about a page is part of that page's card, so it sits inside it and is empty until written. */\n\t.card .for:empty {\n\t\tdisplay: none;\n\t}\n\n\t.card .x {\n\t\tfont-size: 1.125rem;\n\t\tline-height: 18px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.form {\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 12px;\n\t\tpadding: 16px;\n\t\tborder: 1.5px solid var(--blue);\n\t\tborder-radius: 12px;\n\t}\n\n\t.form h3 {\n\t\tmargin: 0;\n\t\tfont-size: 0.9375rem;\n\t\tline-height: 18px;\n\t}\n\n\t.form .f {\n\t\tgap: 7px;\n\t}\n\n\t.form .lab {\n\t\tfont-size: 0.8125rem;\n\t\tline-height: 16px;\n\t}\n\n\t.help {\n\t\tfont-size: 0.75rem;\n\t\tline-height: 17px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.help-row {\n\t\tdisplay: flex;\n\t\tjustify-content: space-between;\n\t}\n\n\t.btn-row {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 18px;\n\t}\n\n\t.btn {\n\t\tdisplay: inline-flex;\n\t\talign-items: center;\n\t\tjustify-content: center;\n\t\theight: 40px;\n\t\tpadding: 0 20px;\n\t\tbackground: var(--green);\n\t\tborder-radius: 8px;\n\t\tcolor: #ffffff;\n\t\tfont-size: 0.875rem;\n\t\tfont-weight: 700;\n\t\ttransition: transform 0.1s, filter 0.1s;\n\t}\n\n\t.btn.pressed,\n\t.dash.pressed {\n\t\ttransform: translateY(1px);\n\t\tfilter: brightness(0.92);\n\t}\n\n\t.cancel {\n\t\tcolor: var(--blue);\n\t\tfont-size: 0.875rem;\n\t\ttext-decoration: underline 1px;\n\t}\n\n\t.dashes {\n\t\tdisplay: flex;\n\t\tgap: 10px;\n\t}\n\n\t.dash {\n\t\tdisplay: inline-flex;\n\t\talign-items: center;\n\t\tpadding: 9px 14px;\n\t\tborder: 1px dashed var(--blue);\n\t\tborder-radius: 8px;\n\t\tcolor: var(--blue);\n\t\tfont-size: 0.8125rem;\n\t\tfont-weight: 700;\n\t\tline-height: 16px;\n\t\ttransition: transform 0.1s, filter 0.1s;\n\t}\n\n\t/* The pointer sits above everything, at stage level, and finds its targets by measuring them. */\n\t.cursor {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 0;\n\t\theight: 0;\n\t\tpointer-events: none;\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t\tz-index: 10;\n\t}\n\n\t.cursor.visible {\n\t\topacity: 1;\n\t}\n\n\t.cursor svg {\n\t\tposition: absolute;\n\t\ttop: -2px;\n\t\tleft: -2px;\n\t\tfilter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));\n\t}\n\n\t.cursor .click {\n\t\tposition: absolute;\n\t\ttop: -18px;\n\t\tleft: -18px;\n\t\twidth: 36px;\n\t\theight: 36px;\n\t\tborder: 2px solid var(--blue);\n\t\tborder-radius: 50%;\n\t\topacity: 0;\n\t}\n\n\t.cursor.clicking .click {\n\t\tanimation: click 0.45s ease-out;\n\t}\n\n\t@keyframes click {\n\t\t0% { opacity: 0.8; transform: scale(0.4); }\n\t\t100% { opacity: 0; transform: scale(1.3); }\n\t}\n\n\t@media (prefers-reduced-motion: reduce) {\n\t\t.node,\n\t\t.node::before,\n\t\t.sq,\n\t\t.toolbar,\n\t\t.fadeable,\n\t\t.panel,\n\t\t.control,\n\t\t.rv,\n\t\t.ctx-sum svg,\n\t\t.btn,\n\t\t.dash {\n\t\t\ttransition: none;\n\t\t}\n\n\t\t.cursor.clicking .click,\n\t\t.caret {\n\t\t\tanimation: none;\n\t\t}\n\t}\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n\t<h1 class=\"sr-only\">Adding context for the agent in Service Studio<\/h1>\n\n\t<div class=\"viewport\" id=\"viewport\">\n\t\t<!-- The drawing is for sight only. What is happening is repeated in plain text just below for screen readers. -->\n\t\t<div class=\"stage\" id=\"stage\" aria-hidden=\"true\">\n\t\t\t<div class=\"canvas\" id=\"canvas\">\n\t\t\t\t<div class=\"world fadeable\" id=\"world\">\n\t\t\t\t\t<svg class=\"edges\" id=\"edges\" width=\"900\" height=\"900\"><\/svg>\n\t\t\t\t\t<div id=\"nodes\"><\/div>\n\t\t\t\t<\/div>\n\t\t\t<\/div>\n\t\t\t<div class=\"canvas-fade\"><\/div>\n\n\t\t\t<div class=\"panel fadeable\" id=\"panel\">\n\t\t\t\t<div class=\"head\">\n\t\t\t\t\t<div>\n\t\t\t\t\t\t<div class=\"eyebrow\">Editing \u00b7 step 4 of 4<\/div>\n\t\t\t\t\t\t<div class=\"title\" id=\"head-title\"><\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t\t<div class=\"nav\">\n\t\t\t\t\t\t<span class=\"nb\"><svg width=\"10\" height=\"6\" viewBox=\"0 0 10 6\"><path d=\"M1 5 L5 1 L9 5\" fill=\"none\" stroke=\"#b1b4b6\" stroke-width=\"1.6\"/><\/svg><\/span>\n\t\t\t\t\t\t<span class=\"nb\"><svg width=\"10\" height=\"6\" viewBox=\"0 0 10 6\"><path d=\"M1 1 L5 5 L9 1\" fill=\"none\" stroke=\"#0b0c0c\" stroke-width=\"1.6\"/><\/svg><\/span>\n\t\t\t\t\t<\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"f\">\n\t\t\t\t\t<div class=\"lab\">Step type<\/div>\n\t\t\t\t\t<div class=\"control\"><span class=\"tag\" id=\"type-tag\"><\/span><svg width=\"11\" height=\"7\" viewBox=\"0 0 11 7\"><path d=\"M1 1 L5.5 6 L10 1\" fill=\"none\" stroke=\"#0b0c0c\" stroke-width=\"1.6\"/><\/svg><\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"ctx\" id=\"ctx\">\n\t\t\t\t\t<div class=\"ctx-sum\" id=\"ctx-sum\">\n\t\t\t\t\t\t<svg width=\"12\" height=\"11\" viewBox=\"0 0 12 12\"><path d=\"M1 10 L11 10 L6 1 Z\" fill=\"#1d70b8\"/><\/svg>\n\t\t\t\t\t\t<span>Add context for the agent<\/span>\n\t\t\t\t\t<\/div>\n\n\t\t\t\t\t<div class=\"rv\" id=\"ctx-body\"><div class=\"clip\"><div class=\"pad\">\n\t\t\t\t\t\t<p class=\"hint\">Pages and notes the agent can read when it handles this step.<\/p>\n\n\t\t\t\t\t\t<div class=\"rv\" id=\"card-url\"><div class=\"clip\"><div class=\"pad\">\n\t\t\t\t\t\t\t<div class=\"card\">\n\t\t\t\t\t\t\t\t<span class=\"tile\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M6 8 L8 6 M5.2 9.8 L3.6 11.4 A1.8 1.8 0 0 1 1 8.8 L3.2 6.6 M8.8 4.2 L10.4 2.6 A1.8 1.8 0 0 1 13 5.2 L10.8 7.4\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><\/svg><\/span>\n\t\t\t\t\t\t\t\t<div class=\"body\">\n\t\t\t\t\t\t\t\t\t<span class=\"name\">Change your address on a driving licence<\/span>\n\t\t\t\t\t\t\t\t\t<span class=\"link\">gov.uk/change-address-on-driving-licence<\/span>\n\t\t\t\t\t\t\t\t\t<span class=\"read\"><svg width=\"10\" height=\"8\" viewBox=\"0 0 14 11\"><path d=\"M1.5 5.5 L5 9 L12.5 1.5\" fill=\"none\" stroke=\"#00703c\" stroke-width=\"2.4\"/><\/svg>Page read \u00b7 just now<\/span>\n\t\t\t\t\t\t\t\t\t<span class=\"for\" id=\"for-text\"><\/span>\n\t\t\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t\t\t<span class=\"x\">\u00d7<\/span>\n\t\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<\/div><\/div><\/div>\n\n\t\t\t\t\t\t<div class=\"rv\" id=\"form-url\"><div class=\"clip\"><div class=\"pad\">\n\t\t\t\t\t\t\t<div class=\"form\">\n\t\t\t\t\t\t\t\t<h3>Add a web page<\/h3>\n\t\t\t\t\t\t\t\t<div class=\"f\">\n\t\t\t\t\t\t\t\t\t<div class=\"lab\">Web address<\/div>\n\t\t\t\t\t\t\t\t\t<div class=\"control small\" id=\"url\"><span class=\"text\"><span class=\"val\" data-ph=\"\"><\/span><i class=\"caret\"><\/i><\/span><\/div>\n\t\t\t\t\t\t\t\t\t<div class=\"help\">We read the page and keep a copy. The agent can quote from it.<\/div>\n\t\t\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t\t\t<div class=\"btn-row\"><span class=\"btn\" id=\"confirm-url\">Add URL<\/span><span class=\"cancel\">Cancel<\/span><\/div>\n\t\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<\/div><\/div><\/div>\n\n\t\t\t\t\t\t<div class=\"rv\" id=\"form-note\"><div class=\"clip\"><div class=\"pad\">\n\t\t\t\t\t\t\t<div class=\"form\">\n\t\t\t\t\t\t\t\t<h3>Add a note about this page<\/h3>\n\t\t\t\t\t\t\t\t<div class=\"f\">\n\t\t\t\t\t\t\t\t\t<div class=\"lab\">What is it for?<\/div>\n\t\t\t\t\t\t\t\t\t<div class=\"control small area\" id=\"note\"><span class=\"text\"><span class=\"val\" data-ph=\"e.g. Eligibility rules\"><\/span><i class=\"caret\"><\/i><\/span><\/div>\n\t\t\t\t\t\t\t\t\t<div class=\"help help-row\"><span>Only the agent sees this.<\/span><span id=\"count\">0 of 500 characters<\/span><\/div>\n\t\t\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t\t\t<div class=\"btn-row\"><span class=\"btn\" id=\"confirm-note\">Save note<\/span><span class=\"cancel\">Cancel<\/span><\/div>\n\t\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<\/div><\/div><\/div>\n\n\t\t\t\t\t\t<div class=\"rv on\" id=\"add-row\"><div class=\"clip\"><div class=\"pad\">\n\t\t\t\t\t\t\t<div class=\"dashes\"><span class=\"dash\" id=\"add-url\">+ Add URL<\/span><span class=\"dash\" id=\"add-note\">+ Add note<\/span><\/div>\n\t\t\t\t\t\t<\/div><\/div><\/div>\n\t\t\t\t\t<\/div><\/div><\/div>\n\t\t\t\t<\/div>\n\t\t\t<\/div>\n\n\t\t\t<div class=\"cursor\" id=\"cursor\">\n\t\t\t\t<span class=\"click\"><\/span>\n\t\t\t\t<svg width=\"18\" height=\"24\" viewBox=\"0 0 22 28\"><path d=\"M2 2 L2 22 L7 17 L11 26 L14 24.5 L10 16 L17 16 Z\" fill=\"#0b0c0c\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><\/svg>\n\t\t\t<\/div>\n\t\t<\/div>\n\t<\/div>\n\t<p class=\"sr-only\" id=\"live\" aria-live=\"polite\"><\/p>\n<\/main>\n\n<script>\n\t// The part of the service shown on the canvas, by centre. The last step is the one that is selected. It\n\t// has the name and type it ended up with in the animation of editing a step.\n\tconst NODES = {\n\t\tbegin: { kind: 'start', x: 450, y: 280, w: 36, h: 36 },\n\t\tcheck: { kind: 'step', x: 450, y: 360, w: 260, h: 42, text: 'Check you can use this service' },\n\t\tlicence: { kind: 'step', x: 450, y: 440, w: 260, h: 42, text: 'Enter your driving licence number' },\n\t\tidentity: { kind: 'step', x: 450, y: 520, w: 260, h: 42, text: 'Confirm your identity' },\n\t\tchoose: { kind: 'step', x: 450, y: 600, w: 260, h: 42, text: 'Choose how to find your address' }\n\t};\n\tconst LINES = [['begin', 'check'], ['check', 'licence'], ['licence', 'identity'], ['identity', 'choose']];\n\n\t// What is typed in: a web address, then a note about that page that says what it is for. The note belongs\n\t// to the page, so it is shown inside the page's own card.\n\tconst CONTEXT = {\n\t\tstepName: 'Choose how to find your address',\n\t\tstepType: { name: 'API endpoint', bg: '#d7e4f4', fg: '#0b0c0c' },\n\t\turl: 'https://www.gov.uk/change-address-on-driving-licence',\n\t\tnote: 'Use this information to outline citizen needs'\n\t};\n\tconst NOTE_LIMIT = 500;\n\n\tconst OVERVIEW = { s: 1, fx: 450, fy: 450 };\n\tconst SVG_NS = 'http://www.w3.org/2000/svg';\n\tconst $ = (id) => document.getElementById(id);\n\n\tconst stage = $('stage');\n\tconst viewport = $('viewport');\n\tconst canvas = $('canvas');\n\tconst world = $('world');\n\tconst cursorEl = $('cursor');\n\tconst panel = $('panel');\n\n\tconst nodeEls = {};\n\tlet cam = { ...OVERVIEW };\n\tlet cursor = { x: 780, y: 760 };\n\n\t/**\n\t * Draws the stage once: a shape for every entry in NODES and the lines between them. The timeline only\n\t * ever shows and changes these, it never creates them.\n\t */\n\tfunction build() {\n\t\tfor (const [id, c] of Object.entries(NODES)) {\n\t\t\tconst el = document.createElement('div');\n\t\t\tel.className = `node ${c.kind}`;\n\t\t\tel.style.width = c.w + 'px';\n\t\t\tel.style.height = c.h + 'px';\n\t\t\tel.style.transform = `translate(${c.x - c.w / 2}px, ${c.y - c.h / 2}px)`;\n\t\t\tel.innerHTML =\n\t\t\t\tc.kind === 'step'\n\t\t\t\t\t? `<div class=\"inner step-body\"><span class=\"text\">${c.text}<\/span><\/div>\n\t\t\t\t\t\t<i class=\"sq top\"><\/i><i class=\"sq bot\"><\/i>\n\t\t\t\t\t\t<div class=\"toolbar\">\n\t\t\t\t\t\t\t<span class=\"tb on\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M2 12 L2.6 9.4 L9.6 2.4 L11.6 4.4 L4.6 11.4 Z\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><\/svg><\/span>\n\t\t\t\t\t\t\t<span class=\"tb\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><rect x=\"4\" y=\"4\" width=\"8\" height=\"8\" rx=\"1.5\" fill=\"none\" stroke=\"#505a5f\" stroke-width=\"1.5\"/><path d=\"M2 9 V3 Q2 2 3 2 H9\" fill=\"none\" stroke=\"#505a5f\" stroke-width=\"1.5\"/><\/svg><\/span>\n\t\t\t\t\t\t\t<span class=\"tb\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M2.5 4 H11.5 M5 4 V2.5 H9 V4 M4 4 L4.5 12 H9.5 L10 4\" fill=\"none\" stroke=\"#d4351c\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><\/svg><\/span>\n\t\t\t\t\t\t<\/div>`\n\t\t\t\t\t: `<div class=\"inner\"><div class=\"start-disc\"><\/div><\/div>`;\n\t\t\t$('nodes').appendChild(el);\n\t\t\tnodeEls[id] = el;\n\t\t}\n\n\t\tfor (const [from, to] of LINES) {\n\t\t\tconst a = NODES[from];\n\t\t\tconst b = NODES[to];\n\t\t\tconst path = document.createElementNS(SVG_NS, 'path');\n\t\t\tpath.setAttribute('class', 'edge');\n\t\t\tpath.setAttribute('d', `M${a.x} ${a.y + a.h / 2}V${b.y - b.h / 2}`);\n\t\t\t$('edges').appendChild(path);\n\t\t}\n\n\t\t$('head-title').textContent = CONTEXT.stepName;\n\t\tconst tag = $('type-tag');\n\t\ttag.textContent = CONTEXT.stepType.name;\n\t\ttag.style.background = CONTEXT.stepType.bg;\n\t\ttag.style.color = CONTEXT.stepType.fg;\n\t}\n\n\t/**\n\t * Scales the fixed size stage to the width it has been given.\n\t */\n\tfunction fit() {\n\t\tstage.style.transform = `scale(${viewport.clientWidth / 1440})`;\n\t}\n\n\tconst clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\n\tconst lerp = (a, b, t) => a + (b - a) * t;\n\tconst easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);\n\n\t/**\n\t * Runs onFrame with a 0 to 1 progress value over the given milliseconds, and resolves when it is done.\n\t */\n\tfunction tween(ms, onFrame, ease = easeInOut) {\n\t\treturn new Promise((resolve) => {\n\t\t\tconst start = performance.now();\n\t\t\tfunction frame(now) {\n\t\t\t\tconst t = clamp((now - start) / ms, 0, 1);\n\t\t\t\tonFrame(ease(t));\n\t\t\t\tif (t < 1) requestAnimationFrame(frame);\n\t\t\t\telse resolve();\n\t\t\t}\n\t\t\trequestAnimationFrame(frame);\n\t\t});\n\t}\n\n\tconst wait = (ms) => tween(ms, () => {}, (t) => t);\n\n\t/**\n\t * Sets the view: the zoom, and the point of the drawing that sits in the middle of the canvas. The dot\n\t * grid is moved and spaced with it so the whole canvas, not just the shapes, appears to zoom.\n\t */\n\tfunction setCamera(s, fx, fy) {\n\t\tcam = { s, fx, fy };\n\t\tconst tx = 450 - fx * s;\n\t\tconst ty = 450 - fy * s;\n\t\tworld.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;\n\t\tcanvas.style.backgroundSize = `${30 * s}px ${30 * s}px`;\n\t\tcanvas.style.backgroundPosition = `${tx}px ${ty}px`;\n\t}\n\n\t/**\n\t * Eases the view to a new zoom and centre.\n\t */\n\tfunction moveCamera(s, fx, fy, ms) {\n\t\tconst from = { ...cam };\n\t\treturn tween(ms, (e) =>\n\t\t\tsetCamera(from.s * Math.pow(s / from.s, e), lerp(from.fx, fx, e), lerp(from.fy, fy, e))\n\t\t);\n\t}\n\n\t/**\n\t * Puts the pointer at a point on the stage.\n\t */\n\tfunction setCursor(x, y) {\n\t\tcursor = { x, y };\n\t\tcursorEl.style.transform = `translate(${x}px, ${y}px)`;\n\t}\n\n\t/**\n\t * Finds the middle of an element on the stage, wherever it has got to, including while the view is\n\t * zoomed or the editor is still sliding in.\n\t */\n\tfunction centreOf(el, dx = 0, dy = 0) {\n\t\tconst box = stage.getBoundingClientRect();\n\t\tconst scale = box.width / 1440;\n\t\tconst r = el.getBoundingClientRect();\n\t\treturn { x: (r.left + r.width / 2 - box.left) / scale + dx, y: (r.top + r.height / 2 - box.top) / scale + dy };\n\t}\n\n\t/**\n\t * Slides the pointer to the middle of an element.\n\t */\n\tfunction moveToEl(el, ms = 700, dx = 0, dy = 0) {\n\t\tconst from = { ...cursor };\n\t\tconst to = centreOf(el, dx, dy);\n\t\treturn tween(ms, (e) => setCursor(lerp(from.x, to.x, e), lerp(from.y, to.y, e)));\n\t}\n\n\t/**\n\t * Moves to an element and clicks it, with a ring that spreads from the point of the click.\n\t */\n\tasync function click(el, ms = 700, dx = 0, dy = 0) {\n\t\tawait moveToEl(el, ms, dx, dy);\n\t\tcursorEl.classList.remove('clicking');\n\t\tvoid cursorEl.offsetWidth;\n\t\tcursorEl.classList.add('clicking');\n\t\tawait wait(220);\n\t}\n\n\t/**\n\t * Presses a button down and lets it up again.\n\t */\n\tasync function press(el) {\n\t\tel.classList.add('pressed');\n\t\tawait wait(160);\n\t\tel.classList.remove('pressed');\n\t}\n\n\t/**\n\t * Tells screen readers what is happening, in plain words.\n\t */\n\tfunction say(text) {\n\t\t$('live').textContent = text;\n\t}\n\n\tconst valOf = (field) => field.querySelector('.val');\n\tconst setFocus = (field, on) => field.classList.toggle('focus', on);\n\tconst open = (id, on) => $(id).classList.toggle('on', on);\n\n\t/**\n\t * Types text into a field, a letter at a time, calling onChange with what is there so far.\n\t */\n\tasync function typeInto(field, text, ms, onChange) {\n\t\tconst val = valOf(field);\n\t\tawait tween(ms, (e) => {\n\t\t\tval.textContent = text.slice(0, Math.round(e * text.length));\n\t\t\tif (onChange) onChange(val.textContent);\n\t\t}, (t) => t);\n\t}\n\n\t/**\n\t * Puts everything back to the start: the step unselected, the editor closed and nothing added yet.\n\t */\n\tfunction reset() {\n\t\tworld.classList.remove('fade');\n\t\tpanel.classList.remove('fade', 'in');\n\t\tcursorEl.classList.remove('visible', 'clicking');\n\t\tsetCamera(OVERVIEW.s, OVERVIEW.fx, OVERVIEW.fy);\n\t\tsetCursor(780, 760);\n\t\tObject.values(nodeEls).forEach((el) => el.classList.remove('show', 'selected'));\n\t\t$('ctx').classList.remove('open');\n\t\topen('ctx-body', false);\n\t\topen('card-url', false);\n\t\topen('form-url', false);\n\t\topen('form-note', false);\n\t\topen('add-row', true);\n\t\tfor (const id of ['url', 'note']) {\n\t\t\tvalOf($(id)).textContent = '';\n\t\t\tsetFocus($(id), false);\n\t\t}\n\t\t$('count').textContent = `0 of ${NOTE_LIMIT} characters`;\n\t\t$('for-text').textContent = '';\n\t}\n\n\t/**\n\t * The whole story, in order: a step is selected, and in its editor a web page is added, followed by a note\n\t * about that page saying what it is for.\n\t */\n\tasync function run() {\n\t\treset();\n\t\tawait wait(500);\n\t\tObject.values(nodeEls).forEach((el) => el.classList.add('show'));\n\t\tawait wait(1000);\n\n\t\t// Select the step, and open the editor beside it.\n\t\tsay('Selecting a step on the canvas');\n\t\tcursorEl.classList.add('visible');\n\t\tawait click(nodeEls.choose, 900);\n\t\tnodeEls.choose.classList.add('selected');\n\t\tpanel.classList.add('in');\n\t\tawait moveCamera(1.15, 450, 600, 900);\n\t\tawait wait(500);\n\n\t\t// Open the context area.\n\t\tsay('Opening context for the agent');\n\t\tawait click($('ctx-sum'), 800, -40);\n\t\t$('ctx').classList.add('open');\n\t\topen('ctx-body', true);\n\t\tawait wait(800);\n\n\t\t// Add a web page. Only the address is asked for.\n\t\tsay('Adding a web page for the agent to read');\n\t\tawait click($('add-url'));\n\t\tawait press($('add-url'));\n\t\topen('add-row', false);\n\t\topen('form-url', true);\n\t\tawait wait(650);\n\t\tawait click($('url'));\n\t\tsetFocus($('url'), true);\n\t\tawait wait(250);\n\t\tawait typeInto($('url'), CONTEXT.url, 1500);\n\t\tsetFocus($('url'), false);\n\t\tawait wait(400);\n\t\tawait click($('confirm-url'));\n\t\tawait press($('confirm-url'));\n\t\topen('form-url', false);\n\t\topen('card-url', true);\n\t\topen('add-row', true);\n\t\tawait wait(1200);\n\n\t\t// Add a note, from the button beside Add URL, about that page and what it is for. It ends up inside the page's own card.\n\t\tsay('Adding a note about what the web page is for');\n\t\tawait click($('add-note'));\n\t\tawait press($('add-note'));\n\t\topen('add-row', false);\n\t\topen('form-note', true);\n\t\tawait wait(650);\n\t\tawait click($('note'));\n\t\tsetFocus($('note'), true);\n\t\tawait wait(250);\n\t\tawait typeInto($('note'), CONTEXT.note, 1500, (text) => {\n\t\t\t$('count').textContent = `${text.length} of ${NOTE_LIMIT} characters`;\n\t\t});\n\t\tsetFocus($('note'), false);\n\t\tawait wait(400);\n\t\tawait click($('confirm-note'));\n\t\tawait press($('confirm-note'));\n\t\t$('for-text').textContent = CONTEXT.note;\n\t\topen('form-note', false);\n\t\topen('add-row', true);\n\t\tawait wait(3000);\n\n\t\tcursorEl.classList.remove('visible');\n\t\tworld.classList.add('fade');\n\t\tpanel.classList.add('fade');\n\t\tawait wait(1000);\n\t}\n\n\t/**\n\t * Runs the story over and over.\n\t */\n\tasync function loop() {\n\t\twhile (true) await run();\n\t}\n\n\t/**\n\t * Shows the finished result straight away, with nothing moving, for anyone who has asked their device\n\t * to reduce motion.\n\t */\n\tfunction showFinal() {\n\t\treset();\n\t\tObject.values(nodeEls).forEach((el) => el.classList.add('show'));\n\t\tnodeEls.choose.classList.add('selected');\n\t\tsetCamera(1.15, 450, 600);\n\t\tpanel.classList.add('in');\n\t\t$('ctx').classList.add('open');\n\t\t$('for-text').textContent = CONTEXT.note;\n\t\topen('ctx-body', true);\n\t\topen('card-url', true);\n\t\tsay('A web page, with a note on what it is for, has been added for the agent');\n\t}\n\n\tbuild();\n\tfit();\n\tnew ResizeObserver(fit).observe(viewport);\n\n\tif (matchMedia('(prefers-reduced-motion: reduce)').matches) showFinal();\n\telse loop();\n<\/script>\n<\/body>\n<\/html>\n" },
		{ name: "The owner choosing how the agent moves", source: "<!doctype html>\n<html lang=\"en-GB\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Service Studio: how the agent moves through the steps<\/title>\n<!--\n\tA self contained animation of a service owner choosing how the agent moves through the steps of a\n\tservice. Strict keeps the numbered order exactly. Agentic lets the agent reorder the steps, and the\n\torder it picks is shown. Everything it needs is in this one file, so it can be shared or opened on its\n\town. To change what is shown, edit the STEPS, ORDER and TEXT in the script at the bottom and the run()\n\ttimeline.\n-->\n<style>\n\t:root {\n\t\t--text: #0b0c0c;\n\t\t--secondary-text: #505a5f;\n\t\t--border: #d8d8d3;\n\t\t--blue: #1d70b8;\n\t\t--blue-tint: #e8f1f8;\n\t\t--selected-tint: #f3f8fc;\n\t\t--green: #00703c;\n\t\t--green-tint: #cce2d8;\n\t\t--green-pale: #e5f0ea;\n\t\t--grey-tint: #f1f1ee;\n\t\t--divider: #ecece8;\n\t}\n\n\t* {\n\t\tbox-sizing: border-box;\n\t}\n\n\tbody {\n\t\tmargin: 0;\n\t\tpadding: 20px;\n\t\tmin-height: 100vh;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tbackground: #ffffff;\n\t\tcolor: var(--text);\n\t\tfont-family: arial, sans-serif;\n\t}\n\n\t/* The animation is kept as wide as the window allows, but never so wide that its height runs off the bottom. */\n\t.wrap {\n\t\twidth: min(100%, 1440px, calc((100vh - 40px) * 1.6));\n\t}\n\n\t.sr-only {\n\t\tposition: absolute;\n\t\twidth: 1px;\n\t\theight: 1px;\n\t\tmargin: -1px;\n\t\tpadding: 0;\n\t\toverflow: hidden;\n\t\tclip: rect(0, 0, 0, 0);\n\t\twhite-space: nowrap;\n\t\tborder: 0;\n\t}\n\n\t/* The stage is drawn at a fixed 1440 by 900 and scaled to fit, so every position below is in the same\n\t\tsimple coordinates whatever size the page is viewed at. */\n\t.viewport {\n\t\tposition: relative;\n\t\twidth: 100%;\n\t\taspect-ratio: 1440 / 900;\n\t\toverflow: hidden;\n\t\tbackground: #ffffff;\n\t}\n\n\t.stage {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 1440px;\n\t\theight: 900px;\n\t\ttransform-origin: 0 0;\n\t\ttransition: opacity 0.7s ease;\n\t}\n\n\t.stage.fade {\n\t\topacity: 0;\n\t}\n\n\t/* Anything that arrives during the story starts hidden and slightly low, then settles into place. */\n\t.arrive {\n\t\topacity: 0;\n\t\ttransform: translateY(8px);\n\t\ttransition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);\n\t}\n\n\t.arrive.show {\n\t\topacity: 1;\n\t\ttransform: none;\n\t}\n\n\t.card {\n\t\tposition: absolute;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 14px;\n\t}\n\n\t/* The service owner card */\n\t.owner-card {\n\t\tleft: 72px;\n\t\ttop: 40px;\n\t\twidth: 440px;\n\t\theight: 260px;\n\t\tpadding: 26px;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 18px;\n\t}\n\n\t.owner-head {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: space-between;\n\t}\n\n\t.card-title {\n\t\tfont-size: 20px;\n\t\tfont-weight: 700;\n\t\tline-height: 26px;\n\t}\n\n\t.saved {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 6px;\n\t\tpadding: 3px 10px;\n\t\tbackground: var(--green-pale);\n\t\tborder-radius: 12px;\n\t\tcolor: var(--green);\n\t\tfont-size: 12px;\n\t\tline-height: 16px;\n\t}\n\n\t.card-text {\n\t\tfont-size: 14px;\n\t\tline-height: 21px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.person {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 14px;\n\t\tpadding: 14px 16px;\n\t\tborder: 1.5px solid var(--blue);\n\t\tborder-radius: 10px;\n\t}\n\n\t.avatar {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tflex-shrink: 0;\n\t\twidth: 40px;\n\t\theight: 40px;\n\t\tbackground: var(--blue);\n\t\tborder-radius: 50%;\n\t\tcolor: #ffffff;\n\t\tfont-size: 14px;\n\t\tfont-weight: 700;\n\t}\n\n\t.person-name {\n\t\tfont-size: 16px;\n\t\tfont-weight: 700;\n\t\tline-height: 20px;\n\t}\n\n\t.person-role {\n\t\tmargin-top: 2px;\n\t\tfont-size: 13px;\n\t\tline-height: 18px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.small-print {\n\t\tfont-size: 13px;\n\t\tline-height: 16px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.arrow {\n\t\tposition: absolute;\n\t\tleft: 512px;\n\t\ttop: 160px;\n\t\tclip-path: inset(0 100% 0 0);\n\t}\n\n\t/* The checks under the owner card. A check that is still being decided is a dashed circle, and turns into\n\t\ta tick once it is settled. */\n\t.checks-card {\n\t\tleft: 72px;\n\t\ttop: 340px;\n\t\twidth: 440px;\n\t\tpadding: 8px 26px;\n\t}\n\n\t.check-row {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 12px;\n\t\tpadding: 14px 0;\n\t\tborder-bottom: 1px solid var(--divider);\n\t\tfont-size: 15px;\n\t\tline-height: 18px;\n\t\topacity: 0;\n\t\ttransition: opacity 0.35s ease;\n\t}\n\n\t.check-row.show {\n\t\topacity: 1;\n\t}\n\n\t.check-row:last-child {\n\t\tborder-bottom: 0;\n\t}\n\n\t.check-row .label {\n\t\tfont-weight: 700;\n\t\ttransition: color 0.3s ease;\n\t}\n\n\t.check-row.done .label {\n\t\tfont-weight: 400;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.mark-slot {\n\t\tposition: relative;\n\t\tflex-shrink: 0;\n\t\twidth: 22px;\n\t\theight: 22px;\n\t}\n\n\t.mark-slot .waiting {\n\t\tposition: absolute;\n\t\tinset: 0;\n\t\tborder: 2px dashed var(--blue);\n\t\tborder-radius: 50%;\n\t\tanimation: turn 6s linear infinite;\n\t\ttransition: opacity 0.25s ease;\n\t}\n\n\t.mark-slot .ticked {\n\t\tposition: absolute;\n\t\tinset: 0;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tbackground: var(--green-tint);\n\t\tborder-radius: 50%;\n\t\topacity: 0;\n\t\ttransition: opacity 0.25s ease;\n\t}\n\n\t.check-row.done .waiting {\n\t\topacity: 0;\n\t}\n\n\t.check-row.done .ticked {\n\t\topacity: 1;\n\t}\n\n\t@keyframes turn {\n\t\tto { transform: rotate(360deg); }\n\t}\n\n\t/* The panel where the owner chooses how the agent moves */\n\t.panel {\n\t\tleft: 600px;\n\t\ttop: 40px;\n\t\twidth: 768px;\n\t\tpadding: 26px;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 16px;\n\t}\n\n\t.panel-sub {\n\t\tmargin-top: 6px;\n\t\tfont-size: 14px;\n\t\tline-height: 21px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.options {\n\t\tdisplay: flex;\n\t\tgap: 16px;\n\t}\n\n\t/* An option is a card with a radio button. The chosen one gets a thicker blue edge and a pale blue ground. */\n\t.option {\n\t\tflex: 1;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 12px;\n\t\theight: 134px;\n\t\tpadding: 16px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 12px;\n\t\ttransition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;\n\t}\n\n\t.option.chosen {\n\t\tbackground: var(--selected-tint);\n\t\tborder-color: var(--blue);\n\t\tbox-shadow: inset 0 0 0 1px var(--blue);\n\t}\n\n\t.option-head {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 10px;\n\t\tfont-size: 16px;\n\t\tfont-weight: 700;\n\t\tline-height: 20px;\n\t}\n\n\t.radio {\n\t\tposition: relative;\n\t\tflex-shrink: 0;\n\t\twidth: 20px;\n\t\theight: 20px;\n\t\tborder: 2px solid var(--secondary-text);\n\t\tborder-radius: 50%;\n\t\ttransition: border-color 0.25s ease;\n\t}\n\n\t.radio::after {\n\t\tcontent: '';\n\t\tposition: absolute;\n\t\tinset: 3px;\n\t\tbackground: var(--blue);\n\t\tborder-radius: 50%;\n\t\ttransform: scale(0);\n\t\ttransition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);\n\t}\n\n\t.option.chosen .radio {\n\t\tborder-color: var(--blue);\n\t}\n\n\t.option.chosen .radio::after {\n\t\ttransform: scale(1);\n\t}\n\n\t.option-text {\n\t\tfont-size: 13px;\n\t\tline-height: 19px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.order-section {\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 2px;\n\t\tpadding-top: 6px;\n\t\tborder-top: 1px solid var(--divider);\n\t}\n\n\t.order-title {\n\t\tpadding-top: 14px;\n\t\tfont-size: 16px;\n\t\tfont-weight: 700;\n\t\tline-height: 22px;\n\t}\n\n\t/* Held to two lines so the list below does not shift when the wording changes. */\n\t.order-sub {\n\t\tmin-height: 38px;\n\t\tfont-size: 13px;\n\t\tline-height: 19px;\n\t\tcolor: var(--secondary-text);\n\t\ttransition: opacity 0.2s ease;\n\t}\n\n\t.order-sub.swap {\n\t\topacity: 0;\n\t}\n\n\t/* The list is a stack of fixed height rows. A row is moved by changing its top, which slides it. */\n\t.list {\n\t\tposition: relative;\n\t\theight: 376px;\n\t}\n\n\t.row {\n\t\tposition: absolute;\n\t\tleft: 0;\n\t\tright: 0;\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 12px;\n\t\theight: 34px;\n\t\tpadding: 0 14px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 10px;\n\t\tfont-size: 14px;\n\t\tline-height: 18px;\n\t\ttransition: top 0.8s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s ease, border-color 0.4s ease;\n\t}\n\n\t.row.optional {\n\t\tborder-style: dashed;\n\t\tborder-color: #b1b4b6;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.row.moved {\n\t\tbackground: var(--selected-tint);\n\t\tborder-color: var(--blue);\n\t}\n\n\t.grip {\n\t\tflex-shrink: 0;\n\t\ttransition: opacity 0.3s ease;\n\t}\n\n\t/* The grip is faded when the agent chooses the order, as the owner no longer drags the rows. */\n\t.list.agentic .grip {\n\t\topacity: 0.25;\n\t}\n\n\t.step-number {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tflex-shrink: 0;\n\t\twidth: 22px;\n\t\theight: 22px;\n\t\tbackground: var(--blue-tint);\n\t\tborder-radius: 50%;\n\t\tcolor: var(--blue);\n\t\tfont-size: 12px;\n\t\tfont-weight: 700;\n\t}\n\n\t.row.optional .step-number {\n\t\tbackground: var(--grey-tint);\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.row-name {\n\t\tflex-grow: 1;\n\t}\n\n\t.tag {\n\t\tpadding: 2px 9px;\n\t\tborder-radius: 4px;\n\t\tfont-size: 12px;\n\t\tline-height: 16px;\n\t\tbackground: var(--green-pale);\n\t\tcolor: var(--green);\n\t}\n\n\t/* Says where a step gets its answers from: records the agent already has, or the person. */\n\t.tag.kind {\n\t\tbackground: var(--blue-tint);\n\t\tcolor: var(--blue);\n\t}\n\n\t.tag.kind.from-person {\n\t\tbackground: var(--grey-tint);\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.row.optional .tag:not(.kind) {\n\t\tbackground: var(--grey-tint);\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.caption {\n\t\tposition: absolute;\n\t\tleft: 72px;\n\t\ttop: 690px;\n\t\twidth: 440px;\n\t\tdisplay: flex;\n\t\tgap: 14px;\n\t\topacity: 0.35;\n\t\ttransition: opacity 0.4s ease;\n\t}\n\n\t.caption.active,\n\t.caption.done {\n\t\topacity: 1;\n\t}\n\n\t.caption-title {\n\t\tfont-size: 18px;\n\t\tfont-weight: 700;\n\t\tline-height: 24px;\n\t}\n\n\t.caption-sub {\n\t\tmargin-top: 3px;\n\t\tfont-size: 14px;\n\t\tline-height: 20px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t/* The pointer sits above everything, at stage level, and finds its targets by measuring them. */\n\t.cursor {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 0;\n\t\theight: 0;\n\t\tpointer-events: none;\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t\tz-index: 10;\n\t}\n\n\t.cursor.visible {\n\t\topacity: 1;\n\t}\n\n\t.cursor svg {\n\t\tposition: absolute;\n\t\ttop: -2px;\n\t\tleft: -2px;\n\t\tfilter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));\n\t}\n\n\t.cursor .click {\n\t\tposition: absolute;\n\t\ttop: -18px;\n\t\tleft: -18px;\n\t\twidth: 36px;\n\t\theight: 36px;\n\t\tborder: 2px solid var(--blue);\n\t\tborder-radius: 50%;\n\t\topacity: 0;\n\t}\n\n\t.cursor.clicking .click {\n\t\tanimation: click 0.45s ease-out;\n\t}\n\n\t@keyframes click {\n\t\t0% { opacity: 0.8; transform: scale(0.4); }\n\t\t100% { opacity: 0; transform: scale(1.3); }\n\t}\n\n\t@media (prefers-reduced-motion: reduce) {\n\t\t.arrive,\n\t\t.check-row,\n\t\t.option,\n\t\t.radio,\n\t\t.radio::after,\n\t\t.order-sub,\n\t\t.row,\n\t\t.grip,\n\t\t.caption,\n\t\t.stage {\n\t\t\ttransition: none;\n\t\t}\n\n\t\t.mark-slot .waiting {\n\t\t\tanimation: none;\n\t\t}\n\n\t\t.cursor.clicking .click {\n\t\t\tanimation: none;\n\t\t}\n\t}\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n\t<h1 class=\"sr-only\">A service owner chooses between strict and agentic navigation for the agent<\/h1>\n\n\t<div class=\"viewport\" id=\"viewport\">\n\t\t<!-- The drawing is for sight only. What is happening is repeated in plain text just below for screen readers. -->\n\t\t<div class=\"stage\" id=\"stage\" aria-hidden=\"true\">\n\n\t\t\t<div class=\"card owner-card arrive\" id=\"owner-card\">\n\t\t\t\t<div class=\"owner-head\">\n\t\t\t\t\t<div class=\"card-title\">Service owner<\/div>\n\t\t\t\t\t<div class=\"saved\"><svg width=\"10\" height=\"8\" viewBox=\"0 0 14 11\"><path d=\"M1.5 5.5 L5 9 L12.5 1.5\" fill=\"none\" stroke=\"#00703c\" stroke-width=\"2.6\" /><\/svg>Saved<\/div>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"card-text\">Accountable for the service once it is live. They sign off and are told when it changes.<\/div>\n\t\t\t\t<div class=\"person\">\n\t\t\t\t\t<div class=\"avatar\">PN<\/div>\n\t\t\t\t\t<div style=\"flex-grow: 1;\">\n\t\t\t\t\t\t<div class=\"person-name\">Priya Nair<\/div>\n\t\t\t\t\t\t<div class=\"person-role\">Head of Licensing Policy \u00b7 DVLA<\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t\t<svg width=\"14\" height=\"9\" viewBox=\"0 0 14 9\"><path d=\"M1.5 1.5 L7 7 L12.5 1.5\" fill=\"none\" stroke=\"#505a5f\" stroke-width=\"2\" /><\/svg>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"small-print\">Created by Jen Sykes \u00b7 Only the owner can sign off<\/div>\n\t\t\t<\/div>\n\n\t\t\t<svg class=\"arrow\" id=\"arrow\" width=\"70\" height=\"40\" viewBox=\"0 0 70 40\">\n\t\t\t\t<path d=\"M6 20 H54\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1 6\" />\n\t\t\t\t<path d=\"M52 13 L62 20 L52 27\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n\t\t\t<\/svg>\n\n\t\t\t<div class=\"card checks-card arrive\" id=\"checks-card\">\n\t\t\t\t<div class=\"check-row\" id=\"check-owner\"><span class=\"mark-slot\"><span class=\"waiting\"><\/span><span class=\"ticked\" data-tick><\/span><\/span><span class=\"label\">Owner saved \u00b7 Priya Nair<\/span><\/div>\n\t\t\t\t<div class=\"check-row\" id=\"check-mode\"><span class=\"mark-slot\"><span class=\"waiting\"><\/span><span class=\"ticked\" data-tick><\/span><\/span><span class=\"label\" id=\"check-mode-label\"><\/span><\/div>\n\t\t\t\t<div class=\"check-row\" id=\"check-ready\"><span class=\"mark-slot\"><span class=\"waiting\"><\/span><span class=\"ticked\" data-tick><\/span><\/span><span class=\"label\">Ready to sign off<\/span><\/div>\n\t\t\t<\/div>\n\n\t\t\t<div class=\"card panel arrive\" id=\"panel\">\n\t\t\t\t<div>\n\t\t\t\t\t<div class=\"card-title\">How the agent moves through the steps<\/div>\n\t\t\t\t\t<div class=\"panel-sub\">Steps marked required are never skipped.<\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"options\">\n\t\t\t\t\t<div class=\"option chosen\" id=\"option-strict\">\n\t\t\t\t\t\t<div class=\"option-head\"><span class=\"radio\"><\/span>Strict<\/div>\n\t\t\t\t\t\t<svg width=\"140\" height=\"20\" viewBox=\"0 0 140 20\">\n\t\t\t\t\t\t\t<g fill=\"#ffffff\" stroke=\"#505a5f\" stroke-width=\"1.4\"><rect x=\"2\" y=\"4\" width=\"28\" height=\"12\" /><rect x=\"56\" y=\"4\" width=\"28\" height=\"12\" /><rect x=\"110\" y=\"4\" width=\"28\" height=\"12\" /><\/g>\n\t\t\t\t\t\t\t<path d=\"M30 10 H56 M84 10 H110\" fill=\"none\" stroke=\"#505a5f\" stroke-width=\"1.4\" />\n\t\t\t\t\t\t<\/svg>\n\t\t\t\t\t\t<div class=\"option-text\">Follows the journey in order and asks every step, one at a time.<\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t\t<div class=\"option\" id=\"option-agentic\">\n\t\t\t\t\t\t<div class=\"option-head\"><span class=\"radio\"><\/span>Agentic<\/div>\n\t\t\t\t\t\t<svg width=\"140\" height=\"20\" viewBox=\"0 0 140 20\">\n\t\t\t\t\t\t\t<g fill=\"#ffffff\" stroke=\"#505a5f\" stroke-width=\"1.4\"><rect x=\"2\" y=\"4\" width=\"28\" height=\"12\" /><rect x=\"110\" y=\"4\" width=\"28\" height=\"12\" /><\/g>\n\t\t\t\t\t\t\t<rect x=\"56\" y=\"4\" width=\"28\" height=\"12\" fill=\"#f1f1ee\" stroke=\"#b1b4b6\" stroke-dasharray=\"3 3\" />\n\t\t\t\t\t\t\t<path d=\"M30 10 H56 M84 10 H110\" fill=\"none\" stroke=\"#b1b4b6\" stroke-width=\"1.4\" stroke-dasharray=\"3 3\" />\n\t\t\t\t\t\t<\/svg>\n\t\t\t\t\t\t<div class=\"option-text\">Skips answers it already has and reorders where the journey allows.<\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"order-section\">\n\t\t\t\t\t<div class=\"order-title\" id=\"order-title\"><\/div>\n\t\t\t\t\t<div class=\"order-sub\" id=\"order-sub\"><\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"list\" id=\"list\"><\/div>\n\t\t\t<\/div>\n\n\t\t\t<div class=\"caption\" id=\"caption\"><\/div>\n\n\t\t\t<div class=\"cursor\" id=\"cursor\">\n\t\t\t\t<span class=\"click\"><\/span>\n\t\t\t\t<svg width=\"18\" height=\"24\" viewBox=\"0 0 22 28\"><path d=\"M2 2 L2 22 L7 17 L11 26 L14 24.5 L10 16 L17 16 Z\" fill=\"#0b0c0c\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-linejoin=\"round\" /><\/svg>\n\t\t\t<\/div>\n\t\t<\/div>\n\t<\/div>\n\t<p class=\"sr-only\" id=\"live\" aria-live=\"polite\"><\/p>\n<\/main>\n\n<script>\n\t// The steps of the service, each keeping the number it has in the journey. A step either gets its answers\n\t// from records the agent already has, or has to ask the person. Required steps are never skipped, and an\n\t// optional step is shown with a dashed edge.\n\tconst STEPS = {\n\t\teligibility: { number: 1, name: 'Check you can use this service', source: 'records', required: true },\n\t\tchange: { number: 2, name: 'Choose what you want to change', source: 'person', required: true },\n\t\taccount: { number: 3, name: 'Get your name and date of birth from your account', source: 'records', required: true },\n\t\taddress: { number: 4, name: 'Enter your new address', source: 'person', required: true },\n\t\tidentity: { number: 5, name: 'Check your identity with GOV.UK One Login', source: 'records', required: true },\n\t\treason: { number: 6, name: 'Tell us why your address changed', source: 'person', required: false },\n\t\tlicence: { number: 7, name: 'Look up your driving licence record', source: 'records', required: true },\n\t\tphoto: { number: 8, name: 'Upload a photo of your licence', source: 'person', required: false },\n\t\tpenalties: { number: 9, name: 'Check for penalty points or restrictions', source: 'records', required: true },\n\t\tsubmit: { number: 10, name: 'Confirm and submit your change', source: 'person', required: true }\n\t};\n\n\tconst SOURCE_LABEL = { records: 'From records', person: 'Asks the person' };\n\n\t// The order in each mode. Strict is the numbered order of the journey, set by the owner, which mixes the\n\t// two kinds of step. Agentic does everything it can from records first, then asks the person for all of\n\t// their input together at the end, so they are asked once and nothing they type is held up by a check.\n\tconst ORDER = {\n\t\tstrict: ['eligibility', 'change', 'account', 'address', 'identity', 'reason', 'licence', 'photo', 'penalties', 'submit'],\n\t\tagentic: ['eligibility', 'account', 'identity', 'licence', 'penalties', 'change', 'address', 'reason', 'photo', 'submit']\n\t};\n\n\t// The words that change with the mode.\n\tconst TEXT = {\n\t\tstrict: {\n\t\t\ttitle: 'Order the agent follows',\n\t\t\tsub: 'Drag to change the order. Strict keeps this order exactly.',\n\t\t\tcheck: 'Agent navigation chosen \u00b7 Strict',\n\t\t\tlive: 'Strict chosen. The agent follows the steps in their numbered order.'\n\t\t},\n\t\tagentic: {\n\t\t\ttitle: 'Order the agent chooses',\n\t\t\tsub: 'Everything it can find in records comes first. The person is only asked for their own input at the end, in one go.',\n\t\t\tcheck: 'Agent navigation chosen \u00b7 Agentic',\n\t\t\tlive: 'Agentic chosen. The agent reorders the steps, using records first and asking the person for their input last.'\n\t\t}\n\t};\n\n\tconst CAPTION = { title: 'The owner decides', sub: 'Choose who owns it and how the agent moves.' };\n\n\tconst TICK = '<svg width=\"11\" height=\"9\" viewBox=\"0 0 14 11\"><path d=\"M1.5 5.5 L5 9 L12.5 1.5\" fill=\"none\" stroke=\"#00703c\" stroke-width=\"2.6\"/><\/svg>';\n\tconst GRIP = '<svg class=\"grip\" width=\"10\" height=\"14\" viewBox=\"0 0 10 14\"><g fill=\"#b1b4b6\"><circle cx=\"2\" cy=\"2\" r=\"1.4\"/><circle cx=\"8\" cy=\"2\" r=\"1.4\"/><circle cx=\"2\" cy=\"7\" r=\"1.4\"/><circle cx=\"8\" cy=\"7\" r=\"1.4\"/><circle cx=\"2\" cy=\"12\" r=\"1.4\"/><circle cx=\"8\" cy=\"12\" r=\"1.4\"/><\/g><\/svg>';\n\tconst ROW_HEIGHT = 34;\n\tconst ROW_GAP = 4;\n\tconst $ = (id) => document.getElementById(id);\n\n\tconst stage = $('stage');\n\tconst viewport = $('viewport');\n\tconst cursorEl = $('cursor');\n\tconst caption = $('caption');\n\tconst list = $('list');\n\tconst rowEls = {};\n\tlet cursor = { x: 1250, y: 740 };\n\tlet mode = 'strict';\n\n\t/**\n\t * Draws the parts of the stage that come from the lists above: a row for each step, the ticks and the\n\t * caption. The timeline only ever shows and changes these, it never creates them.\n\t */\n\tfunction build() {\n\t\tfor (const [id, step] of Object.entries(STEPS)) {\n\t\t\tconst row = document.createElement('div');\n\t\t\trow.className = `row${step.required ? '' : ' optional'}`;\n\t\t\trow.innerHTML = `${GRIP}<span class=\"step-number\">${step.number}<\/span><span class=\"row-name\">${step.name}<\/span><span class=\"tag kind from-${step.source}\">${SOURCE_LABEL[step.source]}<\/span><span class=\"tag\">${step.required ? 'Required' : 'Optional'}<\/span>`;\n\t\t\tlist.appendChild(row);\n\t\t\trowEls[id] = row;\n\t\t}\n\t\tdocument.querySelectorAll('[data-tick]').forEach((el) => (el.innerHTML = TICK));\n\t\tcaption.innerHTML = `\n\t\t\t<div><div class=\"caption-title\">${CAPTION.title}<\/div><div class=\"caption-sub\">${CAPTION.sub}<\/div><\/div>`;\n\t\tplaceRows('strict');\n\t}\n\n\t/**\n\t * Puts each row at the place it has in the given order. The rows slide there, as their top is eased.\n\t */\n\tfunction placeRows(which) {\n\t\tORDER[which].forEach((id, index) => {\n\t\t\trowEls[id].style.top = `${index * (ROW_HEIGHT + ROW_GAP)}px`;\n\t\t\t// A small delay for each place down the list makes the rows ripple into position rather than all jolt at once.\n\t\t\trowEls[id].style.transitionDelay = `${index * 30}ms`;\n\t\t});\n\t}\n\n\t/**\n\t * Scales the fixed size stage to the width it has been given.\n\t */\n\tfunction fit() {\n\t\tstage.style.transform = `scale(${viewport.clientWidth / 1440})`;\n\t}\n\n\tconst clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\n\tconst lerp = (a, b, t) => a + (b - a) * t;\n\tconst easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);\n\n\t/**\n\t * Runs onFrame with a 0 to 1 progress value over the given milliseconds, and resolves when it is done.\n\t */\n\tfunction tween(ms, onFrame, ease = easeInOut) {\n\t\treturn new Promise((resolve) => {\n\t\t\tconst start = performance.now();\n\t\t\tfunction frame(now) {\n\t\t\t\tconst t = clamp((now - start) / ms, 0, 1);\n\t\t\t\tonFrame(ease(t));\n\t\t\t\tif (t < 1) requestAnimationFrame(frame);\n\t\t\t\telse resolve();\n\t\t\t}\n\t\t\trequestAnimationFrame(frame);\n\t\t});\n\t}\n\n\tconst wait = (ms) => tween(ms, () => {}, (t) => t);\n\n\t/**\n\t * Fades in a part of the stage that arrives.\n\t */\n\tfunction show(...els) {\n\t\tfor (const el of els) el.classList.add('show');\n\t}\n\n\t/**\n\t * Uncovers the dotted arrow from the left, so it seems to be drawn towards its head.\n\t */\n\tfunction uncover(ms) {\n\t\tconst el = $('arrow');\n\t\treturn tween(ms, (e) => (el.style.clipPath = `inset(0 ${(1 - e) * 100}% 0 0)`));\n\t}\n\n\t/**\n\t * Puts the pointer at a point on the stage.\n\t */\n\tfunction setCursor(x, y) {\n\t\tcursor = { x, y };\n\t\tcursorEl.style.transform = `translate(${x}px, ${y}px)`;\n\t}\n\n\t/**\n\t * Finds the middle of an element on the stage, wherever it has got to.\n\t */\n\tfunction centreOf(el, dx = 0, dy = 0) {\n\t\tconst box = stage.getBoundingClientRect();\n\t\tconst scale = box.width / 1440
