;\n\t\tconst r = el.getBoundingClientRect();\n\t\treturn { x: (r.left + r.width / 2 - box.left) / scale + dx, y: (r.top + r.height / 2 - box.top) / scale + dy };\n\t}\n\n\t/**\n\t * Moves the pointer to an element and clicks it, with a ring that spreads from the point of the click.\n\t */\n\tasync function click(el, dx = 0, dy = 0) {\n\t\tconst from = { ...cursor };\n\t\tconst to = centreOf(el, dx, dy);\n\t\tawait tween(800, (e) => setCursor(lerp(from.x, to.x, e), lerp(from.y, to.y, e)));\n\t\tcursorEl.classList.remove('clicking');\n\t\tvoid cursorEl.offsetWidth;\n\t\tcursorEl.classList.add('clicking');\n\t\tawait wait(220);\n\t}\n\n\t/**\n\t * Tells screen readers what is happening, in plain words.\n\t */\n\tfunction say(text) {\n\t\t$('live').textContent = text;\n\t}\n\n\t/**\n\t * Swaps the explanation under the list heading, fading it out and back so the change is not abrupt.\n\t */\n\tasync function setOrderText(which) {\n\t\tconst sub = $('order-sub');\n\t\tsub.classList.add('swap');\n\t\tawait wait(200);\n\t\t$('order-title').textContent = TEXT[which].title;\n\t\tsub.textContent = TEXT[which].sub;\n\t\tsub.classList.remove('swap');\n\t}\n\n\t/**\n\t * Applies a choice of mode: the chosen option, the wording, the order of the rows and the check on the\n\t * left. The rows that change place are tinted for a moment, so it is clear which ones moved.\n\t */\n\tasync function choose(which) {\n\t\tconst before = ORDER[mode];\n\t\tmode = which;\n\t\t$('option-strict').classList.toggle('chosen', which === 'strict');\n\t\t$('option-agentic').classList.toggle('chosen', which === 'agentic');\n\t\tlist.classList.toggle('agentic', which === 'agentic');\n\t\tsay(TEXT[which].live);\n\n\t\t// The check on the left goes back to deciding, then settles on the new choice.\n\t\t$('check-mode').classList.remove('done');\n\t\tsetOrderText(which);\n\t\tawait wait(350);\n\n\t\tconst moved = ORDER[which].filter((id, index) => before[index] !== id);\n\t\tplaceRows(which);\n\t\tmoved.forEach((id) => rowEls[id].classList.add('moved'));\n\t\tawait wait(1300);\n\t\t$('check-mode-label').textContent = TEXT[which].check;\n\t\t$('check-mode').classList.add('done');\n\t\tawait wait(700);\n\t\tObject.values(rowEls).forEach((row) => row.classList.remove('moved'));\n\t}\n\n\t/**\n\t * Puts everything back to the start: strict chosen and nothing on the stage yet.\n\t */\n\tfunction reset() {\n\t\tstage.classList.remove('fade');\n\t\tmode = 'strict';\n\t\tdocument.querySelectorAll('.arrive, .check-row').forEach((el) => el.classList.remove('show'));\n\t\tdocument.querySelectorAll('.check-row').forEach((el) => el.classList.remove('done'));\n\t\t$('arrow').style.clipPath = 'inset(0 100% 0 0)';\n\t\t$('option-strict').classList.add('chosen');\n\t\t$('option-agentic').classList.remove('chosen');\n\t\tlist.classList.remove('agentic');\n\t\tObject.values(rowEls).forEach((row) => row.classList.remove('moved'));\n\t\tplaceRows('strict');\n\t\t$('order-title').textContent = TEXT.strict.title;\n\t\t$('order-sub').textContent = TEXT.strict.sub;\n\t\t$('check-mode-label').textContent = TEXT.strict.check;\n\t\tcaption.classList.remove('active', 'done');\n\t\tcursorEl.classList.remove('visible', 'clicking');\n\t\tsetCursor(1250, 740);\n\t}\n\n\t/**\n\t * The whole story, in order: the owner is saved and strict is the starting choice, then the owner picks\n\t * agentic and the steps reorder, goes back to strict and the numbered order returns, and finally settles\n\t * on agentic.\n\t */\n\tasync function run() {\n\t\treset();\n\t\tcaption.classList.add('active');\n\t\tsay('A service owner is saved, and strict navigation is chosen to begin with');\n\t\tawait wait(500);\n\n\t\tshow($('owner-card'));\n\t\tawait wait(500);\n\t\tshow($('checks-card'), $('check-owner'));\n\t\tawait wait(400);\n\t\t$('check-owner').classList.add('done');\n\t\tawait uncover(600);\n\t\tshow($('panel'));\n\t\tawait wait(700);\n\t\tshow($('check-mode'), $('check-ready'));\n\t\tawait wait(500);\n\t\t$('check-mode').classList.add('done');\n\t\tawait wait(1800);\n\n\t\t// The owner picks agentic, and the steps take the order the agent would choose.\n\t\tcursorEl.classList.add('visible');\n\t\tawait click($('option-agentic'), 0, -30);\n\t\tawait choose('agentic');\n\t\tawait wait(2200);\n\n\t\t// Back to strict, and the numbered order returns exactly as it was set.\n\t\tawait click($('option-strict'), 0, -30);\n\t\tawait choose('strict');\n\t\tawait wait(1600);\n\n\t\t// And the owner settles on agentic.\n\t\tawait click($('option-agentic'), 0, -30);\n\t\tawait choose('agentic');\n\t\tcaption.classList.remove('active');\n\t\tcaption.classList.add('done');\n\t\tcursorEl.classList.remove('visible');\n\t\tawait wait(3200);\n\n\t\tstage.classList.add('fade');\n\t\tawait wait(900);\n\t}\n\n\t/**\n\t * Runs the story over and over.\n\t */\n\tasync function loop() {\n\t\twhile (true) await run();\n\t}\n\n\t/**\n\t * Shows the finished picture straight away, with nothing moving, for anyone who has asked their device\n\t * to reduce motion.\n\t */\n\tfunction showFinal() {\n\t\treset();\n\t\tmode = 'agentic';\n\t\tdocument.querySelectorAll('.arrive, .check-row').forEach((el) => el.classList.add('show'));\n\t\t$('arrow').style.clipPath = 'inset(0)';\n\t\t$('option-strict').classList.remove('chosen');\n\t\t$('option-agentic').classList.add('chosen');\n\t\tlist.classList.add('agentic');\n\t\tplaceRows('agentic');\n\t\t$('order-title').textContent = TEXT.agentic.title;\n\t\t$('order-sub').textContent = TEXT.agentic.sub;\n\t\t$('check-mode-label').textContent = TEXT.agentic.check;\n\t\tdocument.querySelectorAll('.check-row').forEach((el, index) => el.classList.toggle('done', index < 2));\n\t\tcaption.classList.add('done');\n\t\tsay(TEXT.agentic.live);\n\t}\n\n\tbuild();\n\tfit();\n\tnew ResizeObserver(fit).observe(viewport);\n\n\tif (matchMedia('(prefers-reduced-motion: reduce)').matches) showFinal();\n\telse loop();\n<\/script>\n<\/body>\n<\/html>\n" },
		{ name: "The graph becoming a schema", source: "<!doctype html>\n<html lang=\"en-GB\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Service Studio: the graph becomes a schema<\/title>\n<!--\n\tA self contained animation of a journey drawn on the graph becoming a schema, which is then sent to the\n\texecutor. Everything it needs is in this one file, so it can be shared or opened on its own. To change\n\twhat is shown, edit the SCHEMA_LINES and CAPTIONS in the script at the bottom and the run() timeline.\n-->\n<style>\n\t:root {\n\t\t--text: #0b0c0c;\n\t\t--secondary-text: #505a5f;\n\t\t--muted: #737373;\n\t\t--border: #d8d8d3;\n\t\t--node-border: #c9cac6;\n\t\t--line: #7b8387;\n\t\t--blue: #1d70b8;\n\t\t--blue-tint: #e8f1f8;\n\t\t--green: #00703c;\n\t\t--green-tint: #cce2d8;\n\t\t--divider: #ecece8;\n\t}\n\n\t* {\n\t\tbox-sizing: border-box;\n\t}\n\n\tbody {\n\t\tmargin: 0;\n\t\tpadding: 20px;\n\t\tmin-height: 100vh;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tbackground: #ffffff;\n\t\tcolor: var(--text);\n\t\tfont-family: arial, sans-serif;\n\t}\n\n\t/* The animation is kept as wide as the window allows, but never so wide that its height runs off the bottom. */\n\t.wrap {\n\t\twidth: min(100%, 1440px, calc((100vh - 40px) * 1.6));\n\t}\n\n\t.sr-only {\n\t\tposition: absolute;\n\t\twidth: 1px;\n\t\theight: 1px;\n\t\tmargin: -1px;\n\t\tpadding: 0;\n\t\toverflow: hidden;\n\t\tclip: rect(0, 0, 0, 0);\n\t\twhite-space: nowrap;\n\t\tborder: 0;\n\t}\n\n\t/* The stage is drawn at a fixed 1440 by 900 and scaled to fit, so every position below is in the same\n\t\tsimple coordinates whatever size the page is viewed at. */\n\t.viewport {\n\t\tposition: relative;\n\t\twidth: 100%;\n\t\taspect-ratio: 1440 / 900;\n\t\toverflow: hidden;\n\t\tbackground: #ffffff;\n\t}\n\n\t.stage {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 1440px;\n\t\theight: 900px;\n\t\ttransform-origin: 0 0;\n\t\ttransition: opacity 0.7s ease;\n\t}\n\n\t.stage.fade {\n\t\topacity: 0;\n\t}\n\n\t/* Anything that arrives during the story starts hidden and slightly low, then settles into place. */\n\t.arrive {\n\t\topacity: 0;\n\t\ttransform: translateY(8px);\n\t\ttransition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);\n\t}\n\n\t.arrive.show {\n\t\topacity: 1;\n\t\ttransform: none;\n\t}\n\n\t.abs {\n\t\tposition: absolute;\n\t}\n\n\t.card {\n\t\tposition: absolute;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 14px;\n\t\toverflow: hidden;\n\t}\n\n\t/* The graph card */\n\t.graph-card {\n\t\tleft: 72px;\n\t\ttop: 150px;\n\t\twidth: 380px;\n\t\theight: 460px;\n\t}\n\n\t.graph-card .grid {\n\t\tposition: absolute;\n\t\tinset: 0;\n\t\tbackground-image: radial-gradient(circle at 2px 2px, #e9e9e5 1.2px, transparent 1.7px);\n\t\tbackground-size: 26px 26px;\n\t}\n\n\t.graph-card svg {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t}\n\n\t/* A line is drawn by letting its dash grow from nothing to the whole length of the path. */\n\t.edge {\n\t\tfill: none;\n\t\tstroke: var(--line);\n\t\tstroke-width: 1.5;\n\t\tstroke-linecap: round;\n\t\tstroke-dasharray: 1;\n\t\tstroke-dashoffset: 1;\n\t}\n\n\t.node {\n\t\tposition: absolute;\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: center;\n\t\theight: 32px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--node-border);\n\t\tborder-radius: 5px;\n\t\tfont-size: 11.5px;\n\t\tfont-weight: 700;\n\t\tline-height: 14px;\n\t\ttransition: opacity 0.4s ease, box-shadow 0.3s ease;\n\t}\n\n\t.node.selected {\n\t\tborder: 2px solid var(--blue);\n\t}\n\n\t.node.glow {\n\t\tbox-shadow: 0 0 0 5px rgba(29, 112, 184, 0.22);\n\t}\n\n\t.hidden {\n\t\topacity: 0;\n\t}\n\n\t/* The condition diamond is cut from a square, so its glow is a shadow on a wrapper around it. */\n\t.diamond-wrap {\n\t\tposition: absolute;\n\t\tleft: 176px;\n\t\ttop: 114px;\n\t\twidth: 28px;\n\t\theight: 28px;\n\t\ttransition: opacity 0.4s ease, filter 0.3s ease;\n\t}\n\n\t.diamond-wrap.glow {\n\t\tfilter: drop-shadow(0 0 5px rgba(29, 112, 184, 0.9));\n\t}\n\n\t.diamond {\n\t\twidth: 28px;\n\t\theight: 28px;\n\t\tbackground: #ffdd00;\n\t\tclip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);\n\t}\n\n\t.end-dot {\n\t\tposition: absolute;\n\t\tleft: 178px;\n\t\ttop: 338px;\n\t\twidth: 24px;\n\t\theight: 24px;\n\t\tbackground: var(--green);\n\t\tborder: 2px solid #ffffff;\n\t\tborder-radius: 50%;\n\t\tbox-shadow: 0 0 0 1.5px var(--green), 0 0 0 0 rgba(29, 112, 184, 0);\n\t\ttransition: opacity 0.4s ease, box-shadow 0.3s ease;\n\t}\n\n\t.end-dot.glow {\n\t\tbox-shadow: 0 0 0 1.5px var(--green), 0 0 0 7px rgba(29, 112, 184, 0.22);\n\t}\n\n\t.end-label {\n\t\tposition: absolute;\n\t\tleft: 150px;\n\t\ttop: 370px;\n\t\twidth: 80px;\n\t\ttext-align: center;\n\t\tfont-size: 11px;\n\t\tline-height: 14px;\n\t\tcolor: var(--secondary-text);\n\t\ttransition: opacity 0.4s ease;\n\t}\n\n\t/* The arrows between the cards are dotted lines that are uncovered from the left. */\n\t.arrow {\n\t\tposition: absolute;\n\t\ttop: 360px;\n\t\twidth: 108px;\n\t\theight: 40px;\n\t\tclip-path: inset(0 100% 0 0);\n\t}\n\n\t.pill {\n\t\tposition: absolute;\n\t\ttop: 326px;\n\t\tpadding: 4px 0;\n\t\ttext-align: center;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 12px;\n\t\tfont-size: 12px;\n\t\tline-height: 16px;\n\t}\n\n\t/* The schema card */\n\t.schema-card {\n\t\tleft: 560px;\n\t\ttop: 150px;\n\t\twidth: 360px;\n\t\theight: 460px;\n\t}\n\n\t.file-head {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: space-between;\n\t\theight: 46px;\n\t\tpadding: 0 18px;\n\t\tborder-bottom: 1px solid #e5e5e0;\n\t}\n\n\t.file-name {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 8px;\n\t\tfont-size: 13px;\n\t\tfont-weight: 700;\n\t\tline-height: 16px;\n\t}\n\n\t.version {\n\t\tpadding: 2px 9px;\n\t\tbackground: #e6e6e2;\n\t\tborder-radius: 4px;\n\t\tfont-size: 12px;\n\t\tline-height: 16px;\n\t}\n\n\t.code {\n\t\tpadding: 16px 18px;\n\t\tfont-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\t\tfont-size: 12px;\n\t\tline-height: 20px;\n\t\twhite-space: pre;\n\t}\n\n\t/* A block of lines that belong together is shaded as one while it is being written. */\n\t.block {\n\t\tmargin: 0 -18px;\n\t\tpadding: 0 18px;\n\t\ttransition: background-color 0.35s ease;\n\t}\n\n\t.block.mark {\n\t\tbackground: var(--blue-tint);\n\t}\n\n\t.line {\n\t\topacity: 0;\n\t\ttransition: opacity 0.25s ease;\n\t}\n\n\t.line.show {\n\t\topacity: 1;\n\t}\n\n\t.line.grey { color: var(--muted); }\n\t.line.green { color: var(--green); }\n\t.line.blue { color: var(--blue); }\n\n\t/* The executor card */\n\t.executor-card {\n\t\tleft: 1028px;\n\t\ttop: 235px;\n\t\twidth: 340px;\n\t\theight: 290px;\n\t\tpadding: 26px;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 20px;\n\t}\n\n\t.executor-head {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 14px;\n\t}\n\n\t.play {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tflex-shrink: 0;\n\t\twidth: 46px;\n\t\theight: 46px;\n\t\tborder: 1.5px solid var(--blue);\n\t\tborder-radius: 50%;\n\t}\n\n\t.executor-title {\n\t\tfont-size: 21px;\n\t\tfont-weight: 700;\n\t\tline-height: 26px;\n\t}\n\n\t.executor-sub {\n\t\tmargin-top: 2px;\n\t\tfont-size: 13px;\n\t\tline-height: 18px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.checks {\n\t\tborder-top: 1px solid var(--divider);\n\t}\n\n\t.check-row {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 12px;\n\t\tpadding: 14px 0;\n\t\tborder-bottom: 1px solid var(--divider);\n\t\tfont-size: 15px;\n\t\tline-height: 18px;\n\t}\n\n\t.check-row:last-child {\n\t\tborder-bottom: 0;\n\t}\n\n\t.check-row .label {\n\t\tfont-weight: 700;\n\t\ttransition: color 0.3s ease;\n\t}\n\n\t.check-row.done .label {\n\t\tfont-weight: 400;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.mark-slot {\n\t\tposition: relative;\n\t\tflex-shrink: 0;\n\t\twidth: 22px;\n\t\theight: 22px;\n\t}\n\n\t.mark-slot .waiting {\n\t\tposition: absolute;\n\t\tinset: 0;\n\t\tborder: 2px dashed var(--blue);\n\t\tborder-radius: 50%;\n\t\tanimation: turn 6s linear infinite;\n\t\ttransition: opacity 0.25s ease;\n\t}\n\n\t.mark-slot .ticked {\n\t\tposition: absolute;\n\t\tinset: 0;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tbackground: var(--green-tint);\n\t\tborder-radius: 50%;\n\t\topacity: 0;\n\t\ttransition: opacity 0.25s ease;\n\t}\n\n\t.check-row.done .waiting {\n\t\topacity: 0;\n\t}\n\n\t.check-row.done .ticked {\n\t\topacity: 1;\n\t}\n\n\t@keyframes turn {\n\t\tto { transform: rotate(360deg); }\n\t}\n\n\t/* The three captions along the bottom. A caption is dim until its moment and is shown in full from then on. */\n\t.caption {\n\t\tposition: absolute;\n\t\ttop: 690px;\n\t\tdisplay: flex;\n\t\tgap: 14px;\n\t\topacity: 0.35;\n\t\ttransition: opacity 0.4s ease;\n\t}\n\n\t.caption.active,\n\t.caption.done {\n\t\topacity: 1;\n\t}\n\n\t.caption-title {\n\t\tfont-size: 18px;\n\t\tfont-weight: 700;\n\t\tline-height: 24px;\n\t}\n\n\t.caption-sub {\n\t\tmargin-top: 3px;\n\t\tfont-size: 14px;\n\t\tline-height: 20px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t@media (prefers-reduced-motion: reduce) {\n\t\t.arrive,\n\t\t.node,\n\t\t.diamond-wrap,\n\t\t.end-dot,\n\t\t.end-label,\n\t\t.line,\n\t\t.block,\n\t\t.caption,\n\t\t.stage {\n\t\t\ttransition: none;\n\t\t}\n\n\t\t.mark-slot .waiting {\n\t\t\tanimation: none;\n\t\t}\n\t}\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n\t<h1 class=\"sr-only\">How a journey drawn on the graph becomes a schema that is sent to the executor<\/h1>\n\n\t<div class=\"viewport\" id=\"viewport\">\n\t\t<!-- The drawing is for sight only. What is happening is repeated in plain text just below for screen readers. -->\n\t\t<div class=\"stage\" id=\"stage\" aria-hidden=\"true\">\n\n\t\t\t<div class=\"card graph-card arrive\" id=\"graph-card\">\n\t\t\t\t<div class=\"grid\"><\/div>\n\t\t\t\t<svg width=\"380\" height=\"460\" viewBox=\"0 0 380 460\">\n\t\t\t\t\t<path class=\"edge\" id=\"edge-1\" pathLength=\"1\" d=\"M190 82 V114\" />\n\t\t\t\t\t<path class=\"edge\" id=\"edge-2\" pathLength=\"1\" d=\"M190 142 V170 Q190 178 182 178 H105 Q97 178 97 186 V200\" />\n\t\t\t\t\t<path class=\"edge\" id=\"edge-3\" pathLength=\"1\" d=\"M190 170 Q190 178 198 178 H275 Q283 178 283 186 V200\" />\n\t\t\t\t\t<path class=\"edge\" id=\"edge-4\" pathLength=\"1\" d=\"M97 232 V300 Q97 308 105 308 H182 Q190 308 190 316 V338\" />\n\t\t\t\t<\/svg>\n\t\t\t\t<div class=\"node selected hidden\" id=\"node-choose\" style=\"left: 80px; top: 50px; width: 220px;\">Choose how to enter your address<\/div>\n\t\t\t\t<div class=\"diamond-wrap hidden\" id=\"node-condition\"><div class=\"diamond\"><\/div><\/div>\n\t\t\t\t<div class=\"node hidden\" id=\"node-postcode\" style=\"left: 17px; top: 200px; width: 160px;\">Find address by postcode<\/div>\n\t\t\t\t<div class=\"node hidden\" id=\"node-manual\" style=\"left: 203px; top: 200px; width: 160px;\">Enter address manually<\/div>\n\t\t\t\t<div class=\"end-dot hidden\" id=\"node-end\"><\/div>\n\t\t\t\t<div class=\"end-label hidden\" id=\"node-end-label\">End<\/div>\n\t\t\t<\/div>\n\n\t\t\t<svg class=\"arrow\" id=\"arrow-1\" style=\"left: 452px;\" viewBox=\"0 0 108 40\">\n\t\t\t\t<path d=\"M6 20 H92\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1 6\" />\n\t\t\t\t<path d=\"M90 13 L100 20 L90 27\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n\t\t\t<\/svg>\n\t\t\t<div class=\"pill arrive\" id=\"pill-generates\" style=\"left: 468px; width: 76px;\">Generates<\/div>\n\n\t\t\t<div class=\"card schema-card arrive\" id=\"schema-card\">\n\t\t\t\t<div class=\"file-head\">\n\t\t\t\t\t<div class=\"file-name\">\n\t\t\t\t\t\t<svg width=\"14\" height=\"16\" viewBox=\"0 0 14 16\"><path d=\"M2 1 H9 L12 4 V15 H2 Z\" fill=\"none\" stroke=\"#505a5f\" stroke-width=\"1.4\" stroke-linejoin=\"round\" /><\/svg>\n\t\t\t\t\t\tjourney.schema.json\n\t\t\t\t\t<\/div>\n\t\t\t\t\t<div class=\"version\">v1 \u00b7 draft<\/div>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"code\" id=\"code\"><\/div>\n\t\t\t<\/div>\n\n\t\t\t<svg class=\"arrow\" id=\"arrow-2\" style=\"left: 920px;\" viewBox=\"0 0 108 40\">\n\t\t\t\t<path d=\"M6 20 H92\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1 6\" />\n\t\t\t\t<path d=\"M90 13 L100 20 L90 27\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n\t\t\t<\/svg>\n\t\t\t<div class=\"pill arrive\" id=\"pill-sent\" style=\"left: 942px; width: 64px;\">Sent to<\/div>\n\n\t\t\t<div class=\"card executor-card arrive\" id=\"executor-card\">\n\t\t\t\t<div class=\"executor-head\">\n\t\t\t\t\t<div class=\"play\"><svg width=\"16\" height=\"18\" viewBox=\"0 0 16 18\"><path d=\"M3 2 L14 9 L3 16 Z\" fill=\"#1d70b8\" /><\/svg><\/div>\n\t\t\t\t\t<div>\n\t\t\t\t\t\t<div class=\"executor-title\">Executor<\/div>\n\t\t\t\t\t\t<div class=\"executor-sub\">Runs the journey from the schema<\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"checks\" id=\"checks\"><\/div>\n\t\t\t<\/div>\n\n\t\t\t<div class=\"caption\" id=\"caption-1\" style=\"left: 72px; width: 380px;\"><\/div>\n\t\t\t<div class=\"caption\" id=\"caption-2\" style=\"left: 560px; width: 360px;\"><\/div>\n\t\t\t<div class=\"caption\" id=\"caption-3\" style=\"left: 1028px; width: 340px;\"><\/div>\n\t\t<\/div>\n\t<\/div>\n\t<p class=\"sr-only\" id=\"live\" aria-live=\"polite\"><\/p>\n<\/main>\n\n<script>\n\t// The schema as it is written out, a line at a time. A line's group says which part of the graph it comes\n\t// from, so the shaded block and the highlighted shapes can follow along.\n\tconst SCHEMA_LINES = [\n\t\t{ group: 'open', text: '{', indent: 0, colour: 'grey' },\n\t\t{ group: 'open', text: '\"service\": \"change-address\",', indent: 16, colour: 'green' },\n\t\t{ group: 'open', text: '\"steps\": [', indent: 16, colour: 'blue' },\n\t\t{ group: 'choose', text: '{', indent: 32, colour: 'grey' },\n\t\t{ group: 'choose', text: '\"id\": \"choose-entry\",', indent: 48, colour: 'green' },\n\t\t{ group: 'choose', text: '\"type\": \"information\",', indent: 48, colour: 'green' },\n\t\t{ group: 'choose', text: '\"next\": \"route\"', indent: 48, colour: 'green' },\n\t\t{ group: 'choose', text: '},', indent: 32, colour: 'grey' },\n\t\t{ group: 'route', text: '{', indent: 32, colour: 'grey' },\n\t\t{ group: 'route', text: '\"id\": \"route\",', indent: 48, colour: 'green' },\n\t\t{ group: 'route', text: '\"type\": \"condition\",', indent: 48, colour: 'green' },\n\t\t{ group: 'route', text: '\"routes\": [', indent: 48, colour: 'blue' },\n\t\t{ group: 'route', text: '\"postcode\",', indent: 64, colour: 'green' },\n\t\t{ group: 'route', text: '\"manual\"', indent: 64, colour: 'green' },\n\t\t{ group: 'route', text: ']', indent: 48, colour: 'grey' },\n\t\t{ group: 'route', text: '},', indent: 32, colour: 'grey' },\n\t\t{ group: 'close', text: '\u2026', indent: 32, colour: 'grey' },\n\t\t{ group: 'close', text: ']', indent: 16, colour: 'grey' },\n\t\t{ group: 'close', text: '}', indent: 0, colour: 'grey' }\n\t];\n\n\t// The three captions along the bottom, in order.\n\tconst CAPTIONS = [\n\t\t{ title: 'Draw the journey', sub: 'Steps, conditions and ends on the canvas.' },\n\t\t{ title: 'It becomes a schema', sub: 'The graph is saved as structured code.' },\n\t\t{ title: 'The executor takes it', sub: 'It reads the schema and runs the journey.' }\n\t];\n\n\t// What the executor does with the schema it is handed, in order. The last one stays waiting, as it is\n\t// ready to run rather than finished.\n\tconst CHECKS = ['Schema received \u00b7 v1', 'Checked and valid', 'Ready to run'];\n\n\tconst TICK = '<svg width=\"11\" height=\"9\" viewBox=\"0 0 14 11\"><path d=\"M1.5 5.5 L5 9 L12.5 1.5\" fill=\"none\" stroke=\"#00703c\" stroke-width=\"2.6\"/><\/svg>';\n\tconst $ = (id) => document.getElementById(id);\n\n\tconst stage = $('stage');\n\tconst viewport = $('viewport');\n\tconst blocks = {};\n\tconst lineEls = [];\n\tconst captionEls = [];\n\tconst checkEls = [];\n\n\t/**\n\t * Draws the parts of the stage that come from the lists above: the schema lines, the captions and the\n\t * executor's checks. The timeline only ever shows and changes these, it never creates them.\n\t */\n\tfunction build() {\n\t\tconst code = $('code');\n\t\tfor (const line of SCHEMA_LINES) {\n\t\t\t// Lines that come from the same part of the graph share one block, so they can be shaded together.\n\t\t\tif (!blocks[line.group]) {\n\t\t\t\tblocks[line.group] = document.createElement('div');\n\t\t\t\tblocks[line.group].className = 'block';\n\t\t\t\tcode.appendChild(blocks[line.group]);\n\t\t\t}\n\t\t\tconst el = document.createElement('div');\n\t\t\tel.className = `line ${line.colour}`;\n\t\t\tel.style.paddingLeft = line.indent + 'px';\n\t\t\tel.textContent = line.text;\n\t\t\tblocks[line.group].appendChild(el);\n\t\t\tlineEls.push({ el, group: line.group });\n\t\t}\n\n\t\tCAPTIONS.forEach((c, i) => {\n\t\t\tconst el = $(`caption-${i + 1}`);\n\t\t\tel.innerHTML = `\n\t\t\t\t<div><div class=\"caption-title\">${c.title}<\/div><div class=\"caption-sub\">${c.sub}<\/div><\/div>`;\n\t\t\tcaptionEls.push(el);\n\t\t});\n\n\t\tfor (const label of CHECKS) {\n\t\t\tconst row = document.createElement('div');\n\t\t\trow.className = 'check-row arrive';\n\t\t\trow.innerHTML = `<span class=\"mark-slot\"><span class=\"waiting\"><\/span><span class=\"ticked\">${TICK}<\/span><\/span><span class=\"label\">${label}<\/span>`;\n\t\t\t$('checks').appendChild(row);\n\t\t\tcheckEls.push(row);\n\t\t}\n\t}\n\n\t/**\n\t * Scales the fixed size stage to the width it has been given.\n\t */\n\tfunction fit() {\n\t\tstage.style.transform = `scale(${viewport.clientWidth / 1440})`;\n\t}\n\n\tconst clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\n\tconst easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);\n\n\t/**\n\t * Runs onFrame with a 0 to 1 progress value over the given milliseconds, and resolves when it is done.\n\t */\n\tfunction tween(ms, onFrame, ease = easeInOut) {\n\t\treturn new Promise((resolve) => {\n\t\t\tconst start = performance.now();\n\t\t\tfunction frame(now) {\n\t\t\t\tconst t = clamp((now - start) / ms, 0, 1);\n\t\t\t\tonFrame(ease(t));\n\t\t\t\tif (t < 1) requestAnimationFrame(frame);\n\t\t\t\telse resolve();\n\t\t\t}\n\t\t\trequestAnimationFrame(frame);\n\t\t});\n\t}\n\n\tconst wait = (ms) => tween(ms, () => {}, (t) => t);\n\n\t/**\n\t * Fades a node in, or a part of the stage that arrives, depending on how it is marked up.\n\t */\n\tfunction show(...els) {\n\t\tfor (const el of els) {\n\t\t\tel.classList.remove('hidden');\n\t\t\tel.classList.add('show');\n\t\t}\n\t}\n\n\t/**\n\t * Draws a line from its start to its end.\n\t */\n\tfunction draw(id, ms) {\n\t\tconst path = $(id);\n\t\treturn tween(ms, (e) => (path.style.strokeDashoffset = String(1 - e)));\n\t}\n\n\t/**\n\t * Uncovers a dotted arrow from the left, so it seems to be drawn towards its head.\n\t */\n\tfunction uncover(id, ms) {\n\t\tconst el = $(id);\n\t\treturn tween(ms, (e) => (el.style.clipPath = `inset(0 ${(1 - e) * 100}% 0 0)`));\n\t}\n\n\t/**\n\t * Sets which caption is the current one. Captions before it are done and those after it wait their turn.\n\t */\n\tfunction setCaption(index, state) {\n\t\tcaptionEls[index].classList.remove('active', 'done');\n\t\tif (state) captionEls[index].classList.add(state);\n\t}\n\n\t/**\n\t * Tells screen readers what is happening, in plain words.\n\t */\n\tfunction say(text) {\n\t\t$('live').textContent = text;\n\t}\n\n\t/**\n\t * Writes out the lines of one part of the schema one after another, shading the part while it is written.\n\t */\n\tasync function writeGroup(group, ms) {\n\t\tconst lines = lineEls.filter((l) => l.group === group);\n\t\tblocks[group].classList.add('mark');\n\t\tfor (const l of lines) {\n\t\t\tl.el.classList.add('show');\n\t\t\tawait wait(ms / lines.length);\n\t\t}\n\t\tawait wait(250);\n\t\tblocks[group].classList.remove('mark');\n\t}\n\n\t/**\n\t * Puts everything back to the start, with nothing drawn yet.\n\t */\n\tfunction reset() {\n\t\tstage.classList.remove('fade');\n\t\tdocument.querySelectorAll('.arrive').forEach((el) => el.classList.remove('show'));\n\t\tdocument.querySelectorAll('.node, .diamond-wrap, .end-dot, .end-label').forEach((el) => {\n\t\t\tel.classList.add('hidden');\n\t\t\tel.classList.remove('glow');\n\t\t});\n\t\tfor (let i = 1; i <= 4; i++) $(`edge-${i}`).style.strokeDashoffset = '1';\n\t\tfor (const id of ['arrow-1', 'arrow-2']) $(id).style.clipPath = 'inset(0 100% 0 0)';\n\t\tlineEls.forEach((l) => l.el.classList.remove('show'));\n\t\tObject.values(blocks).forEach((b) => b.classList.remove('mark'));\n\t\tcaptionEls.forEach((_, i) => setCaption(i, null));\n\t\tcheckEls.forEach((row) => row.classList.remove('done'));\n\t}\n\n\t/**\n\t * The whole story, in order: the journey is drawn, each part of it is written into the schema, and the\n\t * schema is sent to the executor, which checks it and is left ready to run.\n\t */\n\tasync function run() {\n\t\treset();\n\t\tsetCaption(0, 'active');\n\t\tsay('A journey is drawn on the canvas');\n\t\tawait wait(500);\n\n\t\t// Draw the journey: a step, a condition, two branches and an end.\n\t\tshow($('graph-card'));\n\t\tawait wait(700);\n\t\tshow($('node-choose'));\n\t\tawait wait(400);\n\t\tawait draw('edge-1', 400);\n\t\tshow($('node-condition'));\n\t\tawait wait(250);\n\t\tawait Promise.all([draw('edge-2', 500), draw('edge-3', 500)]);\n\t\tshow($('node-postcode'), $('node-manual'));\n\t\tawait wait(450);\n\t\tawait draw('edge-4', 550);\n\t\tshow($('node-end'), $('node-end-label'));\n\t\tawait wait(700);\n\t\tsetCaption(0, 'done');\n\n\t\t// The graph generates the schema, each part of the graph written as it is picked out.\n\t\tsetCaption(1, 'active');\n\t\tsay('The journey is written out as a schema');\n\t\tawait uncover('arrow-1', 800);\n\t\tshow($('pill-generates'));\n\t\tawait wait(350);\n\t\tshow($('schema-card'));\n\t\tawait wait(600);\n\n\t\tfor (const line of lineEls.filter((l) => l.group === 'open')) {\n\t\t\tline.el.classList.add('show');\n\t\t\tawait wait(110);\n\t\t}\n\t\tawait wait(200);\n\n\t\t$('node-choose').classList.add('glow');\n\t\tawait writeGroup('choose', 900);\n\t\t$('node-choose').classList.remove('glow');\n\n\t\t$('node-condition').classList.add('glow');\n\t\t$('node-postcode').classList.add('glow');\n\t\t$('node-manual').classList.add('glow');\n\t\tawait writeGroup('route', 1300);\n\t\t$('node-condition').classList.remove('glow');\n\t\t$('node-postcode').classList.remove('glow');\n\t\t$('node-manual').classList.remove('glow');\n\n\t\t$('node-end').classList.add('glow');\n\t\tawait writeGroup('close', 500);\n\t\t$('node-end').classList.remove('glow');\n\t\tawait wait(500);\n\t\tsetCaption(1, 'done');\n\n\t\t// The schema is sent to the executor, which checks it.\n\t\tsetCaption(2, 'active');\n\t\tsay('The schema is sent to the executor');\n\t\tawait uncover('arrow-2', 800);\n\t\tshow($('pill-sent'));\n\t\tawait wait(350);\n\t\tshow($('executor-card'));\n\t\tawait wait(700);\n\n\t\tfor (let i = 0; i < checkEls.length; i++) {\n\t\t\tshow(checkEls[i]);\n\t\t\tawait wait(600);\n\t\t\t// The last check stays waiting, because the executor is ready to run and has not run yet.\n\t\t\tif (i < checkEls.length - 1) {\n\t\t\t\tcheckEls[i].classList.add('done');\n\t\t\t\tawait wait(350);\n\t\t\t}\n\t\t}\n\t\tsetCaption(2, 'done');\n\t\tawait wait(3200);\n\n\t\tstage.classList.add('fade');\n\t\tawait wait(900);\n\t}\n\n\t/**\n\t * Runs the story over and over.\n\t */\n\tasync function loop() {\n\t\twhile (true) await run();\n\t}\n\n\t/**\n\t * Shows the finished picture straight away, with nothing moving, for anyone who has asked their device\n\t * to reduce motion.\n\t */\n\tfunction showFinal() {\n\t\treset();\n\t\tdocument.querySelectorAll('.arrive').forEach((el) => el.classList.add('show'));\n\t\tdocument.querySelectorAll('.node, .diamond-wrap, .end-dot, .end-label').forEach((el) => el.classList.remove('hidden'));\n\t\tfor (let i = 1; i <= 4; i++) $(`edge-${i}`).style.strokeDashoffset = '0';\n\t\tfor (const id of ['arrow-1', 'arrow-2']) $(id).style.clipPath = 'inset(0)';\n\t\tlineEls.forEach((l) => l.el.classList.add('show'));\n\t\tcaptionEls.forEach((_, i) => setCaption(i, 'done'));\n\t\tcheckEls.slice(0, -1).forEach((row) => row.classList.add('done'));\n\t\tsay('The journey drawn on the graph has become a schema, which has been sent to the executor and is ready to run');\n\t}\n\n\tbuild();\n\tfit();\n\tnew ResizeObserver(fit).observe(viewport);\n\n\tif (matchMedia('(prefers-reduced-motion: reduce)').matches) showFinal();\n\telse loop();\n<\/script>\n<\/body>\n<\/html>\n" },
		{ name: "One executor serving three channels", source: "<!doctype html>\n<html lang=\"en-GB\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Service Studio: one executor, three channels<\/title>\n<!--\n\tA self contained animation of one executor serving three channels from the same schema, with every channel\n\tfollowing the steps of the service in the same order. Everything it needs is in this one file, so it can\n\tbe shared or opened on its own. To change what is shown, edit the CHANNELS and STEP_COUNT in the script at\n\tthe bottom and the run() timeline.\n-->\n<style>\n\t:root {\n\t\t--text: #0b0c0c;\n\t\t--secondary-text: #505a5f;\n\t\t--muted: #737373;\n\t\t--border: #d8d8d3;\n\t\t--blue: #1d70b8;\n\t\t--green: #00703c;\n\t\t--green-tint: #cce2d8;\n\t\t--divider: #ecece8;\n\t}\n\n\t* {\n\t\tbox-sizing: border-box;\n\t}\n\n\tbody {\n\t\tmargin: 0;\n\t\tpadding: 20px;\n\t\tmin-height: 100vh;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tbackground: #ffffff;\n\t\tcolor: var(--text);\n\t\tfont-family: arial, sans-serif;\n\t}\n\n\t/* The animation is kept as wide as the window allows, but never so wide that its height runs off the bottom. */\n\t.wrap {\n\t\twidth: min(100%, 1440px, calc((100vh - 40px) * 1.6));\n\t}\n\n\t.sr-only {\n\t\tposition: absolute;\n\t\twidth: 1px;\n\t\theight: 1px;\n\t\tmargin: -1px;\n\t\tpadding: 0;\n\t\toverflow: hidden;\n\t\tclip: rect(0, 0, 0, 0);\n\t\twhite-space: nowrap;\n\t\tborder: 0;\n\t}\n\n\t/* The stage is drawn at a fixed 1440 by 900 and scaled to fit, so every position below is in the same\n\t\tsimple coordinates whatever size the page is viewed at. */\n\t.viewport {\n\t\tposition: relative;\n\t\twidth: 100%;\n\t\taspect-ratio: 1440 / 900;\n\t\toverflow: hidden;\n\t\tbackground: #ffffff;\n\t}\n\n\t.stage {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 1440px;\n\t\theight: 900px;\n\t\ttransform-origin: 0 0;\n\t\ttransition: opacity 0.7s ease;\n\t}\n\n\t.stage.fade {\n\t\topacity: 0;\n\t}\n\n\t/* Anything that arrives during the story starts hidden and slightly low, then settles into place. */\n\t.arrive {\n\t\topacity: 0;\n\t\ttransform: translateY(8px);\n\t\ttransition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);\n\t}\n\n\t.arrive.show {\n\t\topacity: 1;\n\t\ttransform: none;\n\t}\n\n\t.card {\n\t\tposition: absolute;\n\t\tdisplay: flex;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 14px;\n\t}\n\n\t.file-name {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 8px;\n\t\tfont-size: 13px;\n\t\tfont-weight: 700;\n\t\tline-height: 16px;\n\t}\n\n\t.schema-card {\n\t\tleft: 72px;\n\t\ttop: 330px;\n\t\twidth: 250px;\n\t\theight: 150px;\n\t\tpadding: 20px;\n\t\tflex-direction: column;\n\t\tgap: 12px;\n\t}\n\n\t.mono {\n\t\tfont-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\t\tfont-size: 12px;\n\t\tline-height: 19px;\n\t}\n\n\t.mono .grey { color: var(--muted); }\n\t.mono .blue { color: var(--blue); }\n\n\t.schema-note {\n\t\tfont-size: 12px;\n\t\tline-height: 16px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t/* The dotted arrows are uncovered from the left, so they seem to be drawn towards their heads. */\n\t.arrow {\n\t\tposition: absolute;\n\t\tclip-path: inset(0 100% 0 0);\n\t}\n\n\t.executor-card {\n\t\tleft: 422px;\n\t\ttop: 285px;\n\t\twidth: 300px;\n\t\theight: 240px;\n\t\tpadding: 24px;\n\t\tflex-direction: column;\n\t\tgap: 18px;\n\t}\n\n\t.executor-head {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 14px;\n\t}\n\n\t.play {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tflex-shrink: 0;\n\t\twidth: 46px;\n\t\theight: 46px;\n\t\tborder: 1.5px solid var(--blue);\n\t\tborder-radius: 50%;\n\t}\n\n\t.executor-title {\n\t\tfont-size: 21px;\n\t\tfont-weight: 700;\n\t\tline-height: 26px;\n\t}\n\n\t.executor-sub {\n\t\tmargin-top: 2px;\n\t\tfont-size: 13px;\n\t\tline-height: 18px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.executor-body {\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tflex-grow: 1;\n\t\tjustify-content: space-between;\n\t\tpadding-top: 16px;\n\t\tborder-top: 1px solid var(--divider);\n\t\tfont-size: 14px;\n\t\tline-height: 21px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t/* The steps of the service, in order, as a row of dots joined by lines. A step lights up when it is reached. */\n\t.steps {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t}\n\n\t.dot {\n\t\tflex-shrink: 0;\n\t\twidth: 10px;\n\t\theight: 10px;\n\t\tbackground: #ffffff;\n\t\tborder: 1.5px solid #b1b4b6;\n\t\tborder-radius: 50%;\n\t\ttransition: background-color 0.25s ease, border-color 0.25s ease;\n\t}\n\n\t.join {\n\t\twidth: 16px;\n\t\theight: 2px;\n\t\tbackground: var(--border);\n\t\ttransition: background-color 0.25s ease;\n\t}\n\n\t.dot.lit {\n\t\tbackground: var(--blue);\n\t\tborder-color: var(--blue);\n\t}\n\n\t.join.lit {\n\t\tbackground: var(--blue);\n\t}\n\n\t.pill {\n\t\tposition: absolute;\n\t\tleft: 870px;\n\t\ttop: 391px;\n\t\twidth: 110px;\n\t\tpadding: 4px 0;\n\t\ttext-align: center;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 12px;\n\t\tfont-size: 12px;\n\t\tline-height: 16px;\n\t\tz-index: 2;\n\t}\n\n\t.channel-card {\n\t\tleft: 1032px;\n\t\twidth: 336px;\n\t\theight: 100px;\n\t\talign-items: center;\n\t\tpadding: 18px 20px;\n\t\tgap: 16px;\n\t}\n\n\t.channel-icon {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tflex-shrink: 0;\n\t\twidth: 56px;\n\t}\n\n\t.channel-text {\n\t\tflex-grow: 1;\n\t}\n\n\t.channel-name {\n\t\tfont-size: 18px;\n\t\tfont-weight: 700;\n\t\tline-height: 22px;\n\t}\n\n\t.channel-sub {\n\t\tmargin-top: 2px;\n\t\tfont-size: 13px;\n\t\tline-height: 18px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.channel-text .steps {\n\t\tmargin-top: 8px;\n\t}\n\n\t.tick-slot {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tflex-shrink: 0;\n\t\twidth: 22px;\n\t\theight: 22px;\n\t\tborder-radius: 50%;\n\t\tbackground: var(--green-tint);\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s ease;\n\t}\n\n\t.tick-slot.show {\n\t\topacity: 1;\n\t}\n\n\t/* The small dot that carries each step from the executor out to the channels. */\n\t.packet {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 12px;\n\t\theight: 12px;\n\t\tbackground: var(--blue);\n\t\tborder: 2px solid #ffffff;\n\t\tborder-radius: 50%;\n\t\tbox-shadow: 0 0 0 1px var(--blue);\n\t\topacity: 0;\n\t\tz-index: 3;\n\t}\n\n\t.caption {\n\t\tposition: absolute;\n\t\tleft: 72px;\n\t\ttop: 690px;\n\t\twidth: 760px;\n\t\tdisplay: flex;\n\t\tgap: 14px;\n\t\topacity: 0.35;\n\t\ttransition: opacity 0.4s ease;\n\t}\n\n\t.caption.active,\n\t.caption.done {\n\t\topacity: 1;\n\t}\n\n\t.caption-title {\n\t\tfont-size: 18px;\n\t\tfont-weight: 700;\n\t\tline-height: 24px;\n\t}\n\n\t.caption-sub {\n\t\tmargin-top: 3px;\n\t\tfont-size: 14px;\n\t\tline-height: 20px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t@media (prefers-reduced-motion: reduce) {\n\t\t.arrive,\n\t\t.dot,\n\t\t.join,\n\t\t.tick-slot,\n\t\t.caption,\n\t\t.stage {\n\t\t\ttransition: none;\n\t\t}\n\t}\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n\t<h1 class=\"sr-only\">How one executor serves the app, the web and the agent from the same schema<\/h1>\n\n\t<div class=\"viewport\" id=\"viewport\">\n\t\t<!-- The drawing is for sight only. What is happening is repeated in plain text just below for screen readers. -->\n\t\t<div class=\"stage\" id=\"stage\" aria-hidden=\"true\">\n\n\t\t\t<div class=\"card schema-card arrive\" id=\"schema-card\">\n\t\t\t\t<div class=\"file-name\">\n\t\t\t\t\t<svg width=\"14\" height=\"16\" viewBox=\"0 0 14 16\"><path d=\"M2 1 H9 L12 4 V15 H2 Z\" fill=\"none\" stroke=\"#505a5f\" stroke-width=\"1.4\" stroke-linejoin=\"round\" /><\/svg>\n\t\t\t\t\tjourney.schema.json\n\t\t\t\t<\/div>\n\t\t\t\t<div>\n\t\t\t\t\t<div class=\"mono grey\">{ \"steps\": [ \u2026 ] }<\/div>\n\t\t\t\t\t<div class=\"mono blue\">\"version\": \"v1\"<\/div>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"schema-note\">One schema, published once<\/div>\n\t\t\t<\/div>\n\n\t\t\t<svg class=\"arrow\" id=\"arrow-in\" style=\"left: 322px; top: 385px;\" width=\"100\" height=\"40\" viewBox=\"0 0 100 40\">\n\t\t\t\t<path d=\"M6 20 H84\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1 6\" />\n\t\t\t\t<path d=\"M82 13 L92 20 L82 27\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n\t\t\t<\/svg>\n\n\t\t\t<div class=\"card executor-card arrive\" id=\"executor-card\">\n\t\t\t\t<div class=\"executor-head\">\n\t\t\t\t\t<div class=\"play\"><svg width=\"16\" height=\"18\" viewBox=\"0 0 16 18\"><path d=\"M3 2 L14 9 L3 16 Z\" fill=\"#1d70b8\" /><\/svg><\/div>\n\t\t\t\t\t<div>\n\t\t\t\t\t\t<div class=\"executor-title\">Executor<\/div>\n\t\t\t\t\t\t<div class=\"executor-sub\">Reads the schema<\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"executor-body\">\n\t\t\t\t\t<div>Runs each step, applies the conditions and passes the result to any channel.<\/div>\n\t\t\t\t\t<div class=\"steps\" id=\"executor-steps\"><\/div>\n\t\t\t\t<\/div>\n\t\t\t<\/div>\n\n\t\t\t<!-- Each line out to a channel is its own graphic, so each can be uncovered in turn. -->\n\t\t\t<svg class=\"arrow\" id=\"line-app\" style=\"left: 722px; top: 240px;\" width=\"310\" height=\"320\" viewBox=\"0 0 310 320\">\n\t\t\t\t<path id=\"path-app\" d=\"M0 165 H50 Q70 165 70 145 V55 Q70 35 90 35 H300\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1 6\" />\n\t\t\t\t<path d=\"M290 28 L300 35 L290 42\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n\t\t\t<\/svg>\n\t\t\t<svg class=\"arrow\" id=\"line-web\" style=\"left: 722px; top: 240px;\" width=\"310\" height=\"320\" viewBox=\"0 0 310 320\">\n\t\t\t\t<path id=\"path-web\" d=\"M0 165 H300\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1 6\" />\n\t\t\t\t<path d=\"M290 158 L300 165 L290 172\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n\t\t\t<\/svg>\n\t\t\t<svg class=\"arrow\" id=\"line-agent\" style=\"left: 722px; top: 240px;\" width=\"310\" height=\"320\" viewBox=\"0 0 310 320\">\n\t\t\t\t<path id=\"path-agent\" d=\"M0 165 H50 Q70 165 70 185 V275 Q70 295 90 295 H300\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"1 6\" />\n\t\t\t\t<path d=\"M290 288 L300 295 L290 302\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n\t\t\t<\/svg>\n\t\t\t<div class=\"pill arrive\" id=\"pill-same\">Same schema<\/div>\n\n\t\t\t<div class=\"card channel-card arrive\" id=\"card-app\" style=\"top: 225px;\">\n\t\t\t\t<div class=\"channel-icon\">\n\t\t\t\t\t<div style=\"width: 46px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1.5px solid #505a5f; border-radius: 9px;\">\n\t\t\t\t\t\t<div style=\"width: 20px; height: 4px; border-radius: 2px; background: #c9cac6;\"><\/div>\n\t\t\t\t\t\t<div style=\"width: 20px; height: 4px; border-radius: 2px; background: #c9cac6;\"><\/div>\n\t\t\t\t\t\t<div style=\"width: 12px; height: 4px; border-radius: 2px; background: #1d70b8;\"><\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"channel-text\">\n\t\t\t\t\t<div class=\"channel-name\">App<\/div>\n\t\t\t\t\t<div class=\"channel-sub\">Native mobile screens<\/div>\n\t\t\t\t\t<div class=\"steps\"><\/div>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"tick-slot\"><\/div>\n\t\t\t<\/div>\n\t\t\t<div class=\"card channel-card arrive\" id=\"card-web\" style=\"top: 355px;\">\n\t\t\t\t<div class=\"channel-icon\">\n\t\t\t\t\t<div style=\"width: 56px; height: 46px; border: 1.5px solid #505a5f; border-radius: 7px; overflow: hidden;\">\n\t\t\t\t\t\t<div style=\"height: 11px; display: flex; align-items: center; padding-left: 4px; gap: 3px; border-bottom: 1.5px solid #505a5f;\">\n\t\t\t\t\t\t\t<div style=\"width: 4px; height: 4px; border-radius: 2px; background: #c9cac6;\"><\/div>\n\t\t\t\t\t\t\t<div style=\"width: 4px; height: 4px; border-radius: 2px; background: #c9cac6;\"><\/div>\n\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<div style=\"margin: 6px 6px 0; height: 4px; border-radius: 2px; background: #c9cac6;\"><\/div>\n\t\t\t\t\t\t<div style=\"margin: 4px 6px 0; width: 20px; height: 4px; border-radius: 2px; background: #1d70b8;\"><\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"channel-text\">\n\t\t\t\t\t<div class=\"channel-name\">Web<\/div>\n\t\t\t\t\t<div class=\"channel-sub\">GOV.UK pages in a browser<\/div>\n\t\t\t\t\t<div class=\"steps\"><\/div>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"tick-slot\"><\/div>\n\t\t\t<\/div>\n\t\t\t<div class=\"card channel-card arrive\" id=\"card-agent\" style=\"top: 485px;\">\n\t\t\t\t<div class=\"channel-icon\">\n\t\t\t\t\t<svg width=\"56\" height=\"46\" viewBox=\"0 0 56 46\"><path d=\"M4 6 H44 Q50 6 50 12 V26 Q50 32 44 32 H20 L10 40 V32 H10 Q4 32 4 26 Z\" fill=\"none\" stroke=\"#505a5f\" stroke-width=\"1.5\" stroke-linejoin=\"round\" /><path d=\"M14 19 H18 M23 14 V24 M28 11 V27 M33 15 V23 M38 19 H40\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"2\" stroke-linecap=\"round\" /><\/svg>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"channel-text\">\n\t\t\t\t\t<div class=\"channel-name\">Agent<\/div>\n\t\t\t\t\t<div class=\"channel-sub\">Guided by owner rules<\/div>\n\t\t\t\t\t<div class=\"steps\"><\/div>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"tick-slot\"><\/div>\n\t\t\t<\/div>\n\n\t\t\t<div class=\"packet\" id=\"packet-app\"><\/div>\n\t\t\t<div class=\"packet\" id=\"packet-web\"><\/div>\n\t\t\t<div class=\"packet\" id=\"packet-agent\"><\/div>\n\n\t\t\t<div class=\"caption\" id=\"caption\"><\/div>\n\t\t<\/div>\n\t<\/div>\n\t<p class=\"sr-only\" id=\"live\" aria-live=\"polite\"><\/p>\n<\/main>\n\n<script>\n\t// The channels the executor serves. The path says which dotted line out of the executor leads to each.\n\tconst CHANNELS = [\n\t\t{ id: 'app', label: 'App' },\n\t\t{ id: 'web', label: 'Web' },\n\t\t{ id: 'agent', label: 'Agent' }\n\t];\n\n\t// How many steps the service has. Each is run in turn and arrives at every channel together, so the\n\t// order of the service is the same wherever it is used.\n\tconst STEP_COUNT = 4;\n\n\tconst CAPTION = {\n\t\ttitle: 'One executor, three channels',\n\t\tsub: 'The same schema powers the app, the web service and the agent, with every step in the same order.'\n\t};\n\n\tconst TICK = '<svg width=\"11\" height=\"9\" viewBox=\"0 0 14 11\"><path d=\"M1.5 5.5 L5 9 L12.5 1.5\" fill=\"none\" stroke=\"#00703c\" stroke-width=\"2.6\"/><\/svg>';\n\tconst $ = (id) => document.getElementById(id);\n\n\tconst stage = $('stage');\n\tconst viewport = $('viewport');\n\tconst caption = $('caption');\n\n\t// Every row of dots on the stage: the executor's own first, then one for each channel.\n\tlet executorSteps;\n\tconst channelSteps = {};\n\n\t/**\n\t * Builds a row of dots joined by lines, one dot for each step of the service. Returns the dots and the\n\t * lines so they can be lit as each step is reached.\n\t */\n\tfunction buildSteps(container) {\n\t\tconst dots = [];\n\t\tconst joins = [];\n\t\tfor (let i = 0; i < STEP_COUNT; i++) {\n\t\t\tif (i > 0) {\n\t\t\t\tconst join = document.createElement('span');\n\t\t\t\tjoin.className = 'join';\n\t\t\t\tcontainer.appendChild(join);\n\t\t\t\tjoins.push(join);\n\t\t\t}\n\t\t\tconst dot = document.createElement('span');\n\t\t\tdot.className = 'dot';\n\t\t\tcontainer.appendChild(dot);\n\t\t\tdots.push(dot);\n\t\t}\n\t\treturn { dots, joins };\n\t}\n\n\t/**\n\t * Lights the step with the given number in a row of dots, and the line leading into it.\n\t */\n\tfunction lightStep(row, index) {\n\t\trow.dots[index].classList.add('lit');\n\t\tif (index > 0) row.joins[index - 1].classList.add('lit');\n\t}\n\n\t/**\n\t * Draws the parts of the stage that come from the lists above. The timeline only ever shows and changes\n\t * these, it never creates them.\n\t */\n\tfunction build() {\n\t\texecutorSteps = buildSteps($('executor-steps'));\n\t\tfor (const channel of CHANNELS) {\n\t\t\tconst card = $(`card-${channel.id}`);\n\t\t\tcard.querySelector('.tick-slot').innerHTML = TICK;\n\t\t\tchannelSteps[channel.id] = buildSteps(card.querySelector('.steps'));\n\t\t}\n\t\tcaption.innerHTML = `\n\t\t\t<div><div class=\"caption-title\">${CAPTION.title}<\/div><div class=\"caption-sub\">${CAPTION.sub}<\/div><\/div>`;\n\t}\n\n\t/**\n\t * Scales the fixed size stage to the width it has been given.\n\t */\n\tfunction fit() {\n\t\tstage.style.transform = `scale(${viewport.clientWidth / 1440})`;\n\t}\n\n\tconst clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\n\tconst easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);\n\n\t/**\n\t * Runs onFrame with a 0 to 1 progress value over the given milliseconds, and resolves when it is done.\n\t */\n\tfunction tween(ms, onFrame, ease = easeInOut) {\n\t\treturn new Promise((resolve) => {\n\t\t\tconst start = performance.now();\n\t\t\tfunction frame(now) {\n\t\t\t\tconst t = clamp((now - start) / ms, 0, 1);\n\t\t\t\tonFrame(ease(t));\n\t\t\t\tif (t < 1) requestAnimationFrame(frame);\n\t\t\t\telse resolve();\n\t\t\t}\n\t\t\trequestAnimationFrame(frame);\n\t\t});\n\t}\n\n\tconst wait = (ms) => tween(ms, () => {}, (t) => t);\n\n\t/**\n\t * Fades in a part of the stage that arrives.\n\t */\n\tfunction show(...els) {\n\t\tfor (const el of els) el.classList.add('show');\n\t}\n\n\t/**\n\t * Uncovers a dotted arrow from the left, so it seems to be drawn towards its head.\n\t */\n\tfunction uncover(id, ms) {\n\t\tconst el = $(id);\n\t\treturn tween(ms, (e) => (el.style.clipPath = `inset(0 ${(1 - e) * 100}% 0 0)`));\n\t}\n\n\t/**\n\t * Sends a small dot along each of the lines out to the channels at the same moment, and resolves when\n\t * they have all arrived.\n\t */\n\tfunction sendPackets(ms) {\n\t\treturn Promise.all(\n\t\t\tCHANNELS.map((channel) => {\n\t\t\t\tconst path = $(`path-${channel.id}`);\n\t\t\t\tconst packet = $(`packet-${channel.id}`);\n\t\t\t\tconst length = path.getTotalLength();\n\t\t\t\tpacket.style.opacity = '1';\n\t\t\t\t// The line is drawn in a graphic placed at 722, 240 on the stage, so its points are shifted to match.\n\t\t\t\treturn tween(ms, (e) => {\n\t\t\t\t\tconst point = path.getPointAtLength(e * length);\n\t\t\t\t\tpacket.style.transform = `translate(${722 + point.x - 6}px, ${240 + point.y - 6}px)`;\n\t\t\t\t}).then(() => (packet.style.opacity = '0'));\n\t\t\t})\n\t\t);\n\t}\n\n\t/**\n\t * Tells screen readers what is happening, in plain words.\n\t */\n\tfunction say(text) {\n\t\t$('live').textContent = text;\n\t}\n\n\t/**\n\t * Puts everything back to the start, with nothing drawn yet.\n\t */\n\tfunction reset() {\n\t\tstage.classList.remove('fade');\n\t\tdocument.querySelectorAll('.arrive, .tick-slot').forEach((el) => el.classList.remove('show'));\n\t\tdocument.querySelectorAll('.arrow').forEach((el) => (el.style.clipPath = 'inset(0 100% 0 0)'));\n\t\tdocument.querySelectorAll('.dot, .join').forEach((el) => el.classList.remove('lit'));\n\t\tdocument.querySelectorAll('.packet').forEach((el) => (el.style.opacity = '0'));\n\t\tcaption.classList.remove('active', 'done');\n\t}\n\n\t/**\n\t * The whole story, in order: the schema reaches the executor, which is connected to three channels, and\n\t * then each step of the service is run in turn and arrives at every channel together.\n\t */\n\tasync function run() {\n\t\treset();\n\t\tcaption.classList.add('active');\n\t\tsay('One schema is read by the executor');\n\t\tawait wait(500);\n\n\t\tshow($('schema-card'));\n\t\tawait wait(600);\n\t\tawait uncover('arrow-in', 700);\n\t\tshow($('executor-card'));\n\t\tawait wait(800);\n\n\t\t// The executor is connected to each channel in turn.\n\t\tsay('The executor is connected to the app, the web and the agent');\n\t\tawait uncover('line-app', 650);\n\t\tshow($('card-app'));\n\t\tawait uncover('line-web', 500);\n\t\tshow($('card-web'), $('pill-same'));\n\t\tawait uncover('line-agent', 650);\n\t\tshow($('card-agent'));\n\t\tawait wait(900);\n\n\t\t// Each step is run in the executor first, then handed to all three channels at once.\n\t\tsay('Each step is run in order and reaches every channel together');\n\t\tfor (let step = 0; step < STEP_COUNT; step++) {\n\t\t\tlightStep(executorSteps, step);\n\t\t\tawait wait(350);\n\t\t\tawait sendPackets(800);\n\t\t\tfor (const channel of CHANNELS) lightStep(channelSteps[channel.id], step);\n\t\t\tawait wait(450);\n\t\t}\n\n\t\tfor (const channel of CHANNELS) {\n\t\t\tshow($(`card-${channel.id}`).querySelector('.tick-slot'));\n\t\t\tawait wait(250);\n\t\t}\n\t\tcaption.classList.remove('active');\n\t\tcaption.classList.add('done');\n\t\tawait wait(3200);\n\n\t\tstage.classList.add('fade');\n\t\tawait wait(900);\n\t}\n\n\t/**\n\t * Runs the story over and over.\n\t */\n\tasync function loop() {\n\t\twhile (true) await run();\n\t}\n\n\t/**\n\t * Shows the finished picture straight away, with nothing moving, for anyone who has asked their device\n\t * to reduce motion.\n\t */\n\tfunction showFinal() {\n\t\treset();\n\t\tdocument.querySelectorAll('.arrive, .tick-slot').forEach((el) => el.classList.add('show'));\n\t\tdocument.querySelectorAll('.arrow').forEach((el) => (el.style.clipPath = 'inset(0)'));\n\t\tdocument.querySelectorAll('.dot, .join').forEach((el) => el.classList.add('lit'));\n\t\tcaption.classList.add('done');\n\t\tsay('One executor serves the app, the web and the agent from the same schema, with every step in the same order');\n\t}\n\n\tbuild();\n\tfit();\n\tnew ResizeObserver(fit).observe(viewport);\n\n\tif (matchMedia('(prefers-reduced-motion: reduce)').matches) showFinal();\n\telse loop();\n<\/script>\n<\/body>\n<\/html>\n" }
	];

	const frame = document.getElementById('frame');
	let position = 0;

	/**
	 * Shows the animation at the given place in the sequence, wrapping round at either end. The old one is
	 * faded out first and the new one is faded in once it has loaded, so it always starts from its beginning.
	 */
	function show(index) {
		position = (index + SEQUENCE.length) % SEQUENCE.length;
		const item = SEQUENCE[position];
		frame.classList.add('hidden');
		setTimeout(() => {
			frame.addEventListener('load', () => frame.classList.remove('hidden'), { once: true });
			frame.srcdoc = item.source;
			frame.title = item.name;
		}, 300);
		document.getElementById('live').textContent = `${item.name}, ${position + 1} of ${SEQUENCE.length}`;
	}

	document.getElementById('back').addEventListener('click', () => show(position - 1));
	document.getElementById('next').addEventListener('click', () => show(position + 1));

	// The arrow keys also move through the animations, unless a key press is meant for something else.
	window.addEventListener('keydown', (event) => {
		if (event.altKey || event.ctrlKey || event.metaKey) return;
		if (event.key === 'ArrowRight') show(position + 1);
		if (event.key === 'ArrowLeft') show(position - 1);
	});

	frame.srcdoc = SEQUENCE[0].source;
	frame.title = SEQUENCE[0].name;
</script>
