<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Studio: how it works</title>
<!--
	Plays the storytelling animations one after another. The two small arrows at the bottom right move back and
	on to the next one, and the left and right arrow keys do the same. Every animation is built into this one
	file, copied from the numbered files in this folder, so it can be opened or shared on its own. If one of
	the numbered files is changed, the copy of it in the SEQUENCE list below needs to be refreshed.
-->
<style>
	:root {
		--blue: #1d70b8;
		--blue-dark: #0b4778;
		--focus: #ffdd00;
		--black: #0b0c0c;
	}

	* {
		box-sizing: border-box;
	}

	html,
	body {
		width: 100%;
		height: 100%;
		margin: 0;
		overflow: hidden;
		background: #ffffff;
	}

	.sr-only {
		position: absolute;
		width: 1px;
		height: 1px;
		margin: -1px;
		padding: 0;
		overflow: hidden;
		clip: rect(0, 0, 0, 0);
		white-space: nowrap;
		border: 0;
	}

	/* The animation fills the whole window. It is faded out and back in when it is swapped. */
	.frame {
		position: fixed;
		inset: 0;
		width: 100%;
		height: 100%;
		border: 0;
		background: #ffffff;
		opacity: 1;
		transition: opacity 0.3s ease;
	}

	.frame.hidden {
		opacity: 0;
	}

	/* Two small round arrow buttons in the bottom right corner, kept clear of the animation's own content. */
	.controls {
		position: fixed;
		right: 20px;
		bottom: 20px;
		display: flex;
		gap: 10px;
	}

	.arrow {
		display: grid;
		place-items: center;
		width: 44px;
		height: 44px;
		padding: 0;
		background: #ffffff;
		border: 2px solid var(--blue);
		border-radius: 50%;
		color: var(--blue);
		cursor: pointer;
		transition: background-color 0.15s ease, color 0.15s ease;
	}

	.arrow:hover {
		background: var(--blue);
		color: #ffffff;
	}

	.arrow:focus-visible {
		outline: 3px solid var(--focus);
		outline-offset: 2px;
		box-shadow: 0 0 0 5px var(--black);
	}

	.arrow:active {
		background: var(--blue-dark);
		border-color: var(--blue-dark);
		color: #ffffff;
	}

	@media (prefers-reduced-motion: reduce) {
		.frame,
		.arrow {
			transition: none;
		}
	}
</style>
</head>
<body>
	<h1 class="sr-only">Service Studio: how it works</h1>
	<p class="sr-only" id="live" aria-live="polite"></p>

	<iframe class="frame" id="frame" title="Animation"></iframe>

	<div class="controls">
		<button class="arrow" id="back" type="button" aria-label="Previous animation" title="Previous animation">
			<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M12 2.5 L5.5 9 L12 15.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
		</button>
		<button class="arrow" id="next" type="button" aria-label="Next animation" title="Next animation">
			<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 2.5 L12.5 9 L6 15.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
		</button>
	</div>

<script>
	// The animations in the order they are shown. Each has a short name, which is read out to screen reader users
	// when it comes up, and the whole of its own file as a string, copied from the numbered files in this folder.
	const SEQUENCE = [
		{ name: "Onboarding a service", source: "<!doctype html>\n<html lang=\"en-GB\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Service Studio: onboarding a service<\/title>\n<!--\n\tA self contained animation of onboarding a service in Service Studio. A person starts a new service, picks\n\tthe automated way of drafting it, fills in what the assistant needs to know, and the first draft is\n\tgenerated while a radial progress ring fills to completion. Everything it needs is in this one file, so it\n\tcan be shared or opened on its own. To change what is shown, edit the FORM and PROGRESS values in the\n\tscript at the bottom and the run() timeline.\n-->\n<style>\n\t:root {\n\t\t--text: #0b0c0c;\n\t\t--secondary-text: #505a5f;\n\t\t--placeholder: #9aa0a3;\n\t\t--border: #d8d8d3;\n\t\t--field-border: #c9cac6;\n\t\t--divider: #ecece8;\n\t\t--blue: #1d70b8;\n\t\t--blue-tint: #e8f1f8;\n\t\t--selected-tint: #f3f8fc;\n\t\t--green: #00703c;\n\t\t--green-dark: #005a30;\n\t\t--green-tint: #cce2d8;\n\t\t--grey-tint: #f1f1ee;\n\t}\n\n\t* {\n\t\tbox-sizing: border-box;\n\t}\n\n\tbody {\n\t\tmargin: 0;\n\t\tpadding: 20px;\n\t\tmin-height: 100vh;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tbackground: #ffffff;\n\t\tcolor: var(--text);\n\t\tfont-family: arial, sans-serif;\n\t}\n\n\t/* The animation is kept as wide as the window allows, but never so wide that its height runs off the bottom. */\n\t.wrap {\n\t\twidth: min(100%, 1440px, calc((100vh - 40px) * 1.6));\n\t}\n\n\t.sr-only {\n\t\tposition: absolute;\n\t\twidth: 1px;\n\t\theight: 1px;\n\t\tmargin: -1px;\n\t\tpadding: 0;\n\t\toverflow: hidden;\n\t\tclip: rect(0, 0, 0, 0);\n\t\twhite-space: nowrap;\n\t\tborder: 0;\n\t}\n\n\t/* The stage is drawn at a fixed 1440 by 900 and scaled to fit, so every position below is in the same\n\t\tsimple coordinates whatever size the page is viewed at. */\n\t.viewport {\n\t\tposition: relative;\n\t\twidth: 100%;\n\t\taspect-ratio: 1440 / 900;\n\t\toverflow: hidden;\n\t\tbackground: #ffffff;\n\t}\n\n\t.stage {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 1440px;\n\t\theight: 900px;\n\t\ttransform-origin: 0 0;\n\t\ttransition: opacity 0.7s ease;\n\t}\n\n\t.stage.fade {\n\t\topacity: 0;\n\t}\n\n\t.abs {\n\t\tposition: absolute;\n\t}\n\n\t/* Each page sits on top of the others and is faded in when it is its turn. They are lifted a little, as\n\t\tthere is no header above them to leave room for. */\n\t.screen {\n\t\tposition: absolute;\n\t\tinset: -40px 0 40px;\n\t\topacity: 0;\n\t\ttransform: translateY(10px);\n\t\ttransition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);\n\t\tpointer-events: none;\n\t}\n\n\t.screen.active {\n\t\topacity: 1;\n\t\ttransform: none;\n\t}\n\n\t.grey { color: var(--secondary-text); }\n\n\t.link {\n\t\tcolor: var(--blue);\n\t\ttext-decoration: underline 1px;\n\t\ttext-underline-offset: 2px;\n\t}\n\n\t.button {\n\t\tdisplay: inline-flex;\n\t\talign-items: center;\n\t\tgap: 10px;\n\t\tpadding: 14px 24px;\n\t\tbackground: var(--green);\n\t\tborder-radius: 10px;\n\t\tcolor: #ffffff;\n\t\tfont-size: 18px;\n\t\tfont-weight: 700;\n\t\tline-height: 22px;\n\t\ttransition: transform 0.1s ease, background-color 0.1s ease;\n\t}\n\n\t.button.pressed {\n\t\ttransform: translateY(2px);\n\t\tbackground: var(--green-dark);\n\t}\n\n\t/* Page one: the landing page */\n\t.page-title {\n\t\tposition: absolute;\n\t\tleft: 40px;\n\t\ttop: 148px;\n\t\tfont-size: 44px;\n\t\tfont-weight: 700;\n\t\tline-height: 50px;\n\t}\n\n\t.start-card {\n\t\tposition: absolute;\n\t\tleft: 40px;\n\t\ttop: 222px;\n\t\twidth: 640px;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 22px;\n\t\tpadding: 28px;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 14px;\n\t}\n\n\t.start-card h2 {\n\t\tmargin: 0;\n\t\tfont-size: 24px;\n\t\tline-height: 28px;\n\t}\n\n\t.start-card .intro {\n\t\tmargin-top: 4px;\n\t\tfont-size: 15px;\n\t\tline-height: 21px;\n\t}\n\n\t.start-card .rule {\n\t\theight: 1px;\n\t\tbackground: var(--divider);\n\t}\n\n\t.start-card .note {\n\t\tfont-size: 14px;\n\t\tline-height: 21px;\n\t}\n\n\t.side {\n\t\tposition: absolute;\n\t\tleft: 720px;\n\t\twidth: 680px;\n\t}\n\n\t.side h2 {\n\t\tmargin: 0;\n\t\tfont-size: 24px;\n\t\tline-height: 28px;\n\t}\n\n\t.how-item {\n\t\tdisplay: flex;\n\t\tgap: 16px;\n\t\tmargin-top: 18px;\n\t}\n\n\t.how-item:first-of-type {\n\t\tmargin-top: 20px;\n\t}\n\n\t.how-number {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tflex-shrink: 0;\n\t\twidth: 32px;\n\t\theight: 32px;\n\t\tbackground: var(--blue-tint);\n\t\tborder-radius: 50%;\n\t\tcolor: var(--blue);\n\t\tfont-size: 14px;\n\t\tfont-weight: 700;\n\t}\n\n\t.how-title {\n\t\tfont-size: 17px;\n\t\tfont-weight: 700;\n\t\tline-height: 22px;\n\t}\n\n\t.how-text {\n\t\tmargin-top: 3px;\n\t\tfont-size: 15px;\n\t\tline-height: 22px;\n\t}\n\n\t.drafts {\n\t\tmargin-top: 14px;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 14px;\n\t\toverflow: hidden;\n\t}\n\n\t.draft-row {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: space-between;\n\t\tpadding: 16px 20px;\n\t\tborder-bottom: 1px solid var(--divider);\n\t\tfont-size: 17px;\n\t\tline-height: 22px;\n\t}\n\n\t.draft-row:last-child {\n\t\tborder-bottom: 0;\n\t}\n\n\t.draft-meta {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 14px;\n\t\tfont-size: 14px;\n\t\tline-height: 18px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.status {\n\t\tpadding: 3px 10px;\n\t\tborder-radius: 4px;\n\t\tfont-size: 13px;\n\t\tline-height: 16px;\n\t}\n\n\t/* Pages two and three share a narrow column that starts the same distance from the left. */\n\t.column {\n\t\tposition: absolute;\n\t\tleft: 160px;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t}\n\n\t/* Page two: how to draft it */\n\t.screen-draft .column {\n\t\ttop: 112px;\n\t\twidth: 640px;\n\t\tgap: 14px;\n\t}\n\n\t.page-heading {\n\t\tfont-size: 44px;\n\t\tfont-weight: 700;\n\t\tline-height: 52px;\n\t}\n\n\t.options {\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 16px;\n\t\tpadding-top: 12px;\n\t}\n\n\t/* An option is a card with a radio button. The chosen one gets a thicker blue edge and a pale blue ground. */\n\t.option {\n\t\tdisplay: flex;\n\t\tgap: 16px;\n\t\tpadding: 24px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 14px;\n\t\ttransition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;\n\t}\n\n\t.option.chosen {\n\t\tbackground: var(--selected-tint);\n\t\tborder-color: var(--blue);\n\t\tbox-shadow: inset 0 0 0 1px var(--blue);\n\t}\n\n\t.radio {\n\t\tposition: relative;\n\t\tflex-shrink: 0;\n\t\twidth: 24px;\n\t\theight: 24px;\n\t\tmargin-top: 2px;\n\t\tborder: 2px solid #9aa0a3;\n\t\tborder-radius: 50%;\n\t\ttransition: border-color 0.25s ease;\n\t}\n\n\t.radio::after {\n\t\tcontent: '';\n\t\tposition: absolute;\n\t\tinset: 4px;\n\t\tbackground: var(--blue);\n\t\tborder-radius: 50%;\n\t\ttransform: scale(0);\n\t\ttransition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);\n\t}\n\n\t.option.chosen .radio {\n\t\tborder-color: var(--blue);\n\t}\n\n\t.option.chosen .radio::after {\n\t\ttransform: scale(1);\n\t}\n\n\t.option-body {\n\t\tflex-grow: 1;\n\t}\n\n\t.option-head {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: space-between;\n\t\tfont-size: 23px;\n\t\tfont-weight: 700;\n\t\tline-height: 28px;\n\t}\n\n\t.option-text {\n\t\tmargin-top: 8px;\n\t\tfont-size: 16px;\n\t\tline-height: 24px;\n\t}\n\n\t.option-body.single .option-text {\n\t\tmargin-top: 6px;\n\t}\n\n\t.recommended {\n\t\tpadding: 3px 10px;\n\t\tbackground: var(--blue-tint);\n\t\tborder-radius: 4px;\n\t\tcolor: var(--blue);\n\t\tfont-size: 12px;\n\t\tfont-weight: 400;\n\t\tline-height: 16px;\n\t}\n\n\t.continue {\n\t\tpadding-top: 12px;\n\t}\n\n\t/* Page three: the form */\n\t.screen-form .column {\n\t\ttop: 100px;\n\t\twidth: 520px;\n\t\tgap: 12px;\n\t}\n\n\t.form-heading {\n\t\tfont-size: 40px;\n\t\tfont-weight: 700;\n\t\tline-height: 46px;\n\t}\n\n\t.form-intro {\n\t\tfont-size: 16px;\n\t\tline-height: 23px;\n\t}\n\n\t.fields {\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 20px;\n\t\tpadding-top: 6px;\n\t}\n\n\t.group {\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 7px;\n\t}\n\n\t.label {\n\t\tfont-size: 16px;\n\t\tfont-weight: 700;\n\t\tline-height: 20px;\n\t}\n\n\t.field {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 10px;\n\t\tmin-height: 46px;\n\t\tpadding: 0 14px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--field-border);\n\t\tborder-radius: 10px;\n\t\tfont-size: 15px;\n\t\tline-height: 18px;\n\t\ttransition: border-color 0.15s ease, box-shadow 0.15s ease;\n\t}\n\n\t.field.tall {\n\t\talign-items: flex-start;\n\t\theight: 84px;\n\t\tpadding: 12px 14px;\n\t\tline-height: 22px;\n\t}\n\n\t.field.focus {\n\t\tborder-color: var(--blue);\n\t\tbox-shadow: 0 0 0 1px var(--blue), 0 0 0 4px rgba(29, 112, 184, 0.16);\n\t}\n\n\t.val {\n\t\twhite-space: pre-wrap;\n\t\toverflow-wrap: anywhere;\n\t}\n\n\t.val:empty::before {\n\t\tcontent: attr(data-placeholder);\n\t\tcolor: var(--placeholder);\n\t}\n\n\t.field.focus .val:empty::before {\n\t\tcontent: '';\n\t}\n\n\t.caret {\n\t\tdisplay: none;\n\t\twidth: 2px;\n\t\theight: 17px;\n\t\tmargin-left: 1px;\n\t\tvertical-align: text-bottom;\n\t\tbackground: var(--text);\n\t\tanimation: blink 1s steps(1) infinite;\n\t}\n\n\t.field.focus .caret {\n\t\tdisplay: inline-block;\n\t}\n\n\t@keyframes blink {\n\t\t50% { opacity: 0; }\n\t}\n\n\t/* The link icon only takes up room once something has been typed beside it. */\n\t.link-icon {\n\t\tdisplay: none;\n\t\tflex-shrink: 0;\n\t}\n\n\t.link-icon.on {\n\t\tdisplay: block;\n\t}\n\n\t.dropzone {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: center;\n\t\tgap: 10px;\n\t\theight: 62px;\n\t\tbackground: #fafaf8;\n\t\tborder: 1.5px dashed #9aa0a3;\n\t\tborder-radius: 12px;\n\t\tfont-size: 14px;\n\t\tline-height: 18px;\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.generate {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 20px;\n\t\tpadding-top: 12px;\n\t\tfont-size: 15px;\n\t\tline-height: 18px;\n\t}\n\n\t/* Page four: generating the first draft */\n\t.dots {\n\t\tposition: absolute;\n\t\tleft: 720px;\n\t\ttop: 60px;\n\t\twidth: 720px;\n\t\theight: 840px;\n\t\tbackground-image: radial-gradient(circle at 2px 2px, #e9e9e5 1.2px, transparent 1.7px);\n\t\tbackground-size: 30px 30px;\n\t}\n\n\t.dots-fade {\n\t\tposition: absolute;\n\t\tleft: 720px;\n\t\ttop: 60px;\n\t\twidth: 520px;\n\t\theight: 840px;\n\t\tbackground: linear-gradient(90deg, rgba(255, 255, 255, 0), #ffffff);\n\t}\n\n\t.progress {\n\t\tposition: absolute;\n\t\tleft: 140px;\n\t\ttop: 150px;\n\t\twidth: 520px;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tgap: 30px;\n\t}\n\n\t.progress-top {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 30px;\n\t}\n\n\t.ring {\n\t\tposition: relative;\n\t\tflex-shrink: 0;\n\t\twidth: 120px;\n\t\theight: 120px;\n\t}\n\n\t.ring svg {\n\t\tdisplay: block;\n\t}\n\n\t.ring-track {\n\t\tfill: none;\n\t\tstroke: var(--blue-tint);\n\t\tstroke-width: 10;\n\t}\n\n\t.ring-fill {\n\t\tfill: none;\n\t\tstroke: var(--blue);\n\t\tstroke-width: 10;\n\t\tstroke-linecap: round;\n\t\ttransition: stroke 0.5s ease;\n\t}\n\n\t.ring-number {\n\t\tposition: absolute;\n\t\tinset: 0;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tfont-size: 26px;\n\t\tfont-weight: 700;\n\t\tline-height: 32px;\n\t}\n\n\t.ring.finished {\n\t\tanimation: settle 0.6s ease-out;\n\t}\n\n\t@keyframes settle {\n\t\t0% { transform: scale(1); }\n\t\t40% { transform: scale(1.07); }\n\t\t100% { transform: scale(1); }\n\t}\n\n\t.progress-title {\n\t\tfont-size: 36px;\n\t\tfont-weight: 700;\n\t\tline-height: 42px;\n\t\ttransition: opacity 0.25s ease;\n\t}\n\n\t.progress-sub {\n\t\tmargin-top: 8px;\n\t\tfont-size: 16px;\n\t\tline-height: 23px;\n\t\tcolor: var(--secondary-text);\n\t\ttransition: opacity 0.25s ease;\n\t}\n\n\t.swap {\n\t\topacity: 0;\n\t}\n\n\t.bar {\n\t\theight: 6px;\n\t\tbackground: var(--blue-tint);\n\t\tborder-radius: 3px;\n\t\toverflow: hidden;\n\t}\n\n\t.bar-fill {\n\t\twidth: 0%;\n\t\theight: 6px;\n\t\tbackground: var(--blue);\n\t\tborder-radius: 3px;\n\t\ttransition: background-color 0.5s ease;\n\t}\n\n\t.steps {\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 14px;\n\t\toverflow: hidden;\n\t}\n\n\t.step {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tgap: 14px;\n\t\tpadding: 15px 20px;\n\t\tborder-bottom: 1px solid var(--divider);\n\t\tfont-size: 15px;\n\t\tline-height: 18px;\n\t\tcolor: var(--placeholder);\n\t\ttransition: background-color 0.3s ease;\n\t}\n\n\t.step:last-child {\n\t\tborder-bottom: 0;\n\t}\n\n\t.mark {\n\t\tposition: relative;\n\t\tflex-shrink: 0;\n\t\twidth: 24px;\n\t\theight: 24px;\n\t\tborder: 1.5px solid var(--border);\n\t\tborder-radius: 50%;\n\t\ttransition: border-color 0.25s ease, background-color 0.25s ease;\n\t}\n\n\t.mark .tick {\n\t\tposition: absolute;\n\t\tinset: 0;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\topacity: 0;\n\t\ttransition: opacity 0.25s ease;\n\t}\n\n\t.step.active {\n\t\tbackground: var(--selected-tint);\n\t\tcolor: var(--text);\n\t\tfont-weight: 700;\n\t}\n\n\t.step.active .mark {\n\t\tborder: 2.5px dashed var(--blue);\n\t\tanimation: turn 6s linear infinite;\n\t}\n\n\t.step.done {\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.step.done .mark {\n\t\tbackground: var(--green-tint);\n\t\tborder-color: var(--green-tint);\n\t}\n\n\t.step.done .mark .tick {\n\t\topacity: 1;\n\t}\n\n\t@keyframes turn {\n\t\tto { transform: rotate(360deg); }\n\t}\n\n\t/* The draft graph forming on the right. Parts of it are drawn as the progress passes them. */\n\t.draft-card {\n\t\tposition: absolute;\n\t\tleft: 780px;\n\t\ttop: 170px;\n\t\twidth: 520px;\n\t\theight: 480px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 16px;\n\t\toverflow: hidden;\n\t}\n\n\t.draft-head {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: space-between;\n\t\theight: 46px;\n\t\tpadding: 0 20px;\n\t\tborder-bottom: 1px solid var(--divider);\n\t\tfont-size: 13px;\n\t\tfont-weight: 700;\n\t}\n\n\t.draft-state {\n\t\tpadding: 2px 10px;\n\t\tbackground: var(--blue-tint);\n\t\tborder-radius: 4px;\n\t\tcolor: var(--blue);\n\t\tfont-size: 12px;\n\t\tfont-weight: 400;\n\t\tline-height: 16px;\n\t\ttransition: background-color 0.4s ease, color 0.4s ease;\n\t}\n\n\t.draft-state.ready {\n\t\tbackground: var(--green-tint);\n\t\tcolor: var(--green);\n\t}\n\n\t.draft-card svg.lines {\n\t\tposition: absolute;\n\t\tleft: 0;\n\t\ttop: 50px;\n\t}\n\n\t.line-solid {\n\t\tfill: none;\n\t\tstroke: #9aa0a3;\n\t\tstroke-width: 1.5;\n\t\tstroke-linecap: round;\n\t\tstroke-dasharray: 1;\n\t\tstroke-dashoffset: 1;\n\t}\n\n\t/* The shapes are left blank on purpose. They show that a graph is being put together, not what is in it,\n\t\tas a real service could have any number of steps and conditions. */\n\t.gnode {\n\t\tposition: absolute;\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: center;\n\t\twidth: 200px;\n\t\theight: 36px;\n\t\tbackground: #fafaf8;\n\t\tborder: 1px solid var(--field-border);\n\t\tborder-radius: 10px;\n\t\topacity: 0;\n\t\ttransition: opacity 0.4s ease;\n\t}\n\n\t.gnode::after {\n\t\tcontent: '';\n\t\twidth: 56%;\n\t\theight: 8px;\n\t\tbackground: #e4e4df;\n\t\tborder-radius: 4px;\n\t}\n\n\t.gnode.on {\n\t\topacity: 1;\n\t}\n\n\t.start-disc {\n\t\tposition: absolute;\n\t\tleft: 240px;\n\t\ttop: 90px;\n\t\twidth: 40px;\n\t\theight: 40px;\n\t\tbackground: var(--text);\n\t\tborder-radius: 50%;\n\t\topacity: 0;\n\t\ttransition: opacity 0.4s ease;\n\t}\n\n\t.start-disc.on {\n\t\topacity: 1;\n\t}\n\n\t.diamond {\n\t\tposition: absolute;\n\t\tleft: 247px;\n\t\ttop: 212px;\n\t\twidth: 26px;\n\t\theight: 26px;\n\t\tbackground: #ffdd00;\n\t\tclip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);\n\t\topacity: 0;\n\t\ttransition: opacity 0.4s ease;\n\t}\n\n\t.diamond.on {\n\t\topacity: 1;\n\t}\n\n\t.end-disc {\n\t\tposition: absolute;\n\t\tleft: 240px;\n\t\ttop: 426px;\n\t\twidth: 40px;\n\t\theight: 40px;\n\t\tborder: 2px solid #b1b4b6;\n\t\tborder-radius: 50%;\n\t\topacity: 0;\n\t\ttransition: opacity 0.4s ease, background-color 0.5s ease, border-color 0.5s ease;\n\t}\n\n\t.end-disc.on {\n\t\topacity: 1;\n\t}\n\n\t.end-disc.final {\n\t\tbackground: var(--green);\n\t\tborder: 2px solid #ffffff;\n\t\tbox-shadow: 0 0 0 1.5px var(--green);\n\t}\n\n\t/* The pointer sits above everything, at stage level, and finds its targets by measuring them. */\n\t.cursor {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 0;\n\t\theight: 0;\n\t\tpointer-events: none;\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t\tz-index: 10;\n\t}\n\n\t.cursor.visible {\n\t\topacity: 1;\n\t}\n\n\t.cursor svg {\n\t\tposition: absolute;\n\t\ttop: -2px;\n\t\tleft: -2px;\n\t\tfilter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));\n\t}\n\n\t.cursor .click {\n\t\tposition: absolute;\n\t\ttop: -18px;\n\t\tleft: -18px;\n\t\twidth: 36px;\n\t\theight: 36px;\n\t\tborder: 2px solid var(--blue);\n\t\tborder-radius: 50%;\n\t\topacity: 0;\n\t}\n\n\t.cursor.clicking .click {\n\t\tanimation: click 0.45s ease-out;\n\t}\n\n\t@keyframes click {\n\t\t0% { opacity: 0.8; transform: scale(0.4); }\n\t\t100% { opacity: 0; transform: scale(1.3); }\n\t}\n\n\t@media (prefers-reduced-motion: reduce) {\n\t\t.screen,\n\t\t.option,\n\t\t.radio,\n\t\t.radio::after,\n\t\t.field,\n\t\t.ring-fill,\n\t\t.progress-title,\n\t\t.progress-sub,\n\t\t.bar-fill,\n\t\t.step,\n\t\t.mark,\n\t\t.mark .tick,\n\t\t.gnode,\n\t\t.start-disc,\n\t\t.diamond,\n\t\t.end-disc,\n\t\t.draft-state,\n\t\t.stage,\n\t\t.button {\n\t\t\ttransition: none;\n\t\t}\n\n\t\t.step.active .mark,\n\t\t.ring.finished,\n\t\t.caret,\n\t\t.cursor.clicking .click {\n\t\t\tanimation: none;\n\t\t}\n\t}\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n\t<h1 class=\"sr-only\">Onboarding a service: starting a new service, choosing to draft it with automation, filling in the form, and the first draft being generated<\/h1>\n\n\t<div class=\"viewport\" id=\"viewport\">\n\t\t<!-- The drawing is for sight only. What is happening is repeated in plain text just below for screen readers. -->\n\t\t<div class=\"stage\" id=\"stage\" aria-hidden=\"true\">\n\n\t\t\t<!-- Page one: the landing page -->\n\t\t\t<div class=\"screen screen-landing\" id=\"screen-landing\">\n\t\t\t\t<div class=\"page-title\">Create a service<\/div>\n\n\t\t\t\t<div class=\"start-card\">\n\t\t\t\t\t<div>\n\t\t\t\t\t\t<h2>Start a new service<\/h2>\n\t\t\t\t\t\t<div class=\"intro grey\">Create agentically legible service graphs that include steps and conditions.<\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t\t<div class=\"rule\"><\/div>\n\t\t\t\t\t<div><span class=\"button\" id=\"start-button\">Start a new service<svg width=\"8\" height=\"12\" viewBox=\"0 0 8 12\"><path d=\"M1.5 1.5 L6.5 6 L1.5 10.5\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2\" /><\/svg><\/span><\/div>\n\t\t\t\t\t<div class=\"note grey\">Next you will choose whether the assistant drafts a first version for you, or you begin with a blank graph.<\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"side\" style=\"top: 222px;\">\n\t\t\t\t\t<h2>How it works<\/h2>\n\t\t\t\t\t<div class=\"how-item\"><span class=\"how-number\">1<\/span><div><div class=\"how-title\">A first draft is created<\/div><div class=\"how-text grey\">A service graph including steps, questions and branching is drafted using a manual or automated process.<\/div><\/div><\/div>\n\t\t\t\t\t<div class=\"how-item\"><span class=\"how-number\">2<\/span><div><div class=\"how-title\">You edit the journey graph<\/div><div class=\"how-text grey\">Reorder steps, change questions and adjust conditions visually.<\/div><\/div><\/div>\n\t\t\t\t\t<div class=\"how-item\"><span class=\"how-number\">3<\/span><div><div class=\"how-title\">Policy signs it off<\/div><div class=\"how-text grey\">Policy colleagues set what is required and authorise each step.<\/div><\/div><\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"side\" style=\"top: 520px;\">\n\t\t\t\t\t<h2>Your drafts<\/h2>\n\t\t\t\t\t<div class=\"drafts\">\n\t\t\t\t\t\t<div class=\"draft-row\"><span class=\"link\">Renew your driving licence<\/span><span class=\"draft-meta\">6 steps \u00b7 edited 2 hours ago<span class=\"status\" style=\"background: #fff4b8; color: #594d00;\">In policy review<\/span><\/span><\/div>\n\t\t\t\t\t\t<div class=\"draft-row\"><span class=\"link\">Book your theory test<\/span><span class=\"draft-meta\">5 steps \u00b7 edited yesterday<span class=\"status\" style=\"background: #cce2d8; color: #00703c;\">Live<\/span><\/span><\/div>\n\t\t\t\t\t\t<div class=\"draft-row\"><span class=\"link\">Apply for a provisional licence<\/span><span class=\"draft-meta\">8 steps \u00b7 edited last week<span class=\"status\" style=\"background: #f1f1ee; color: #505a5f;\">Draft<\/span><\/span><\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t<\/div>\n\t\t\t<\/div>\n\n\t\t\t<!-- Page two: how to draft it -->\n\t\t\t<div class=\"screen screen-draft\" id=\"screen-draft\">\n\t\t\t\t<div class=\"column\">\n\t\t\t\t\t<div class=\"page-heading\">How do you want to draft it?<\/div>\n\t\t\t\t\t<div class=\"options\">\n\t\t\t\t\t\t<div class=\"option\" id=\"option-automation\">\n\t\t\t\t\t\t\t<span class=\"radio\"><\/span>\n\t\t\t\t\t\t\t<div class=\"option-body\">\n\t\t\t\t\t\t\t\t<div class=\"option-head\">Draft it with automation<span class=\"recommended\">Recommended<\/span><\/div>\n\t\t\t\t\t\t\t\t<div class=\"option-text grey\">An assistant reads what is already on GOV.UK, plus anything you give it, and drafts a service journey and graph. Steps and conditions remain editable until published.<\/div>\n\t\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<div class=\"option\" id=\"option-blank\">\n\t\t\t\t\t\t\t<span class=\"radio\"><\/span>\n\t\t\t\t\t\t\t<div class=\"option-body single\">\n\t\t\t\t\t\t\t\t<div class=\"option-head\">Start with a blank graph<\/div>\n\t\t\t\t\t\t\t\t<div class=\"option-text grey\">Build the journey yourself from scratch.<\/div>\n\t\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t\t<div class=\"continue\"><span class=\"button\" id=\"continue-button\">Continue<\/span><\/div>\n\t\t\t\t<\/div>\n\t\t\t<\/div>\n\n\t\t\t<!-- Page three: tell the assistant about the service -->\n\t\t\t<div class=\"screen screen-form\" id=\"screen-form\">\n\t\t\t\t<div class=\"column\">\n\t\t\t\t\t<div class=\"form-heading\">Tell the assistant about the service<\/div>\n\t\t\t\t\t<div class=\"form-intro grey\">It will use this, plus what is already on GOV.UK, to draft the journey and graph.<\/div>\n\t\t\t\t\t<div class=\"fields\">\n\t\t\t\t\t\t<div class=\"group\">\n\t\t\t\t\t\t\t<div class=\"label\">What is the service called?<\/div>\n\t\t\t\t\t\t\t<div class=\"field\" id=\"field-name\"><span class=\"text\"><span class=\"val\" data-placeholder=\"\"><\/span><i class=\"caret\"><\/i><\/span><\/div>\n\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<div class=\"group\">\n\t\t\t\t\t\t\t<div class=\"label\">What does the service do?<\/div>\n\t\t\t\t\t\t\t<div class=\"field tall\" id=\"field-description\"><span class=\"text\"><span class=\"val\" data-placeholder=\"\"><\/span><i class=\"caret\"><\/i><\/span><\/div>\n\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<div class=\"group\" style=\"gap: 8px;\">\n\t\t\t\t\t\t\t<div class=\"label\">Links to the service<\/div>\n\t\t\t\t\t\t\t<div class=\"field\" id=\"field-link\"><svg class=\"link-icon\" id=\"link-icon\" width=\"14\" height=\"14\" viewBox=\"0 0 12 12\"><path d=\"M5 7 L7 5 M4.5 8.5 L3 10 A1.7 1.7 0 0 1 1 8 L3 6 M7.5 3.5 L9 2 A1.7 1.7 0 0 1 11 4 L9 6\" fill=\"none\" stroke=\"#1d70b8\" stroke-width=\"1.2\" stroke-linecap=\"round\" /><\/svg><span class=\"text\"><span class=\"val\" data-placeholder=\"https://\"><\/span><i class=\"caret\"><\/i><\/span><\/div>\n\t\t\t\t\t\t\t<div class=\"field\"><span class=\"text\"><span class=\"val\" data-placeholder=\"https://\"><\/span><\/span><\/div>\n\t\t\t\t\t\t\t<div class=\"link\" style=\"font-size: 14px; line-height: 18px;\">Add another link<\/div>\n\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<div class=\"group\" style=\"gap: 8px;\">\n\t\t\t\t\t\t\t<div class=\"label\">Add a document (optional)<\/div>\n\t\t\t\t\t\t\t<div class=\"dropzone\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\"><path d=\"M8 11 V2 M4.5 5.5 L8 2 L11.5 5.5 M2 11 V14 H14 V11\" fill=\"none\" stroke=\"#505a5f\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /><\/svg>Drop a policy paper, spec or form here.<\/div>\n\t\t\t\t\t\t<\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t\t<div class=\"generate\">\n\t\t\t\t\t\t<span class=\"button\" id=\"generate-button\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\"><path d=\"M8 1 L9.6 6.4 L15 8 L9.6 9.6 L8 15 L6.4 9.6 L1 8 L6.4 6.4 Z\" fill=\"#ffffff\" /><\/svg>Generate the first draft<\/span>\n\t\t\t\t\t\t<span class=\"grey\">usually under a minute<\/span>\n\t\t\t\t\t<\/div>\n\t\t\t\t<\/div>\n\t\t\t<\/div>\n\n\t\t\t<!-- Page four: generating the first draft -->\n\t\t\t<div class=\"screen screen-generating\" id=\"screen-generating\">\n\t\t\t\t<div class=\"dots\"><\/div>\n\t\t\t\t<div class=\"dots-fade\"><\/div>\n\n\t\t\t\t<div class=\"progress\">\n\t\t\t\t\t<div class=\"progress-top\">\n\t\t\t\t\t\t<div class=\"ring\" id=\"ring\">\n\t\t\t\t\t\t\t<svg width=\"120\" height=\"120\" viewBox=\"0 0 120 120\">\n\t\t\t\t\t\t\t\t<circle class=\"ring-track\" cx=\"60\" cy=\"60\" r=\"50\" />\n\t\t\t\t\t\t\t\t<circle class=\"ring-fill\" id=\"ring-fill\" cx=\"60\" cy=\"60\" r=\"50\" transform=\"rotate(-90 60 60)\" stroke-dasharray=\"0 314.16\" />\n\t\t\t\t\t\t\t<\/svg>\n\t\t\t\t\t\t\t<div class=\"ring-number\" id=\"ring-number\">0%<\/div>\n\t\t\t\t\t\t<\/div>\n\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t<div class=\"progress-title\" id=\"progress-title\">Drafting your service<\/div>\n\t\t\t\t\t\t\t<div class=\"progress-sub\" id=\"progress-sub\">Reading what is on GOV.UK and building the journey. Usually under a minute.<\/div>\n\t\t\t\t\t\t<\/div>\n\t\t\t\t\t<\/div>\n\t\t\t\t\t<div class=\"bar\"><div class=\"bar-fill\" id=\"bar-fill\"><\/div><\/div>\n\t\t\t\t\t<div class=\"steps\" id=\"steps\"><\/div>\n\t\t\t\t<\/div>\n\n\t\t\t\t<div class=\"draft-card\">\n\t\t\t\t\t<div class=\"draft-head\">Change driving licence address<span class=\"draft-state\" id=\"draft-state\">Draft forming<\/span><\/div>\n\t\t\t\t\t<svg class=\"lines\" width=\"520\" height=\"430\" viewBox=\"0 0 520 430\">\n\t\t\t\t\t\t<path class=\"line-solid\" id=\"edge-1\" pathLength=\"1\" d=\"M260 70 V110\" />\n\t\t\t\t\t\t<path class=\"line-solid\" id=\"edge-2\" pathLength=\"1\" d=\"M260 146 V176\" />\n\t\t\t\t\t\t<path class=\"line-solid\" id=\"edge-3\" pathLength=\"1\" d=\"M260 190 V210 Q260 216 254 216 H150 Q144 216 144 222 V240\" />\n\t\t\t\t\t\t<path class=\"line-solid\" id=\"edge-4\" pathLength=\"1\" d=\"M260 210 Q260 216 266 216 H370 Q376 216 376 222 V240\" />\n\t\t\t\t\t\t<path class=\"line-solid\" id=\"edge-5\" pathLength=\"1\" d=\"M144 276 V294 Q144 300 150 300 H254 Q260 300 260 306 V316\" />\n\t\t\t\t\t\t<path class=\"line-solid\" id=\"edge-6\" pathLength=\"1\" d=\"M376 276 V294 Q376 300 370 300 H266 Q260 300 260 306 V316\" />\n\t\t\t\t\t\t<path class=\"line-solid\" id=\"edge-7\" pathLength=\"1\" d=\"M260 352 V376\" />\n\t\t\t\t\t<\/svg>\n\t\t\t\t\t<div class=\"start-disc\" id=\"start-disc\"><\/div>\n\t\t\t\t\t<div class=\"gnode\" id=\"node-1\" style=\"left: 130px; top: 170px; width: 260px;\"><\/div>\n\t\t\t\t\t<div class=\"diamond\" id=\"diamond\"><\/div>\n\t\t\t\t\t<div class=\"gnode\" id=\"node-2\" style=\"left: 44px; top: 290px;\"><\/div>\n\t\t\t\t\t<div class=\"gnode\" id=\"node-3\" style=\"left: 276px; top: 290px;\"><\/div>\n\t\t\t\t\t<div class=\"gnode\" id=\"node-4\" style=\"left: 160px; top: 366px;\"><\/div>\n\t\t\t\t\t<div class=\"end-disc\" id=\"end-disc\"><\/div>\n\t\t\t\t<\/div>\n\t\t\t<\/div>\n\n\t\t\t<div class=\"cursor\" id=\"cursor\">\n\t\t\t\t<span class=\"click\"><\/span>\n\t\t\t\t<svg width=\"18\" height=\"24\" viewBox=\"0 0 22 28\"><path d=\"M2 2 L2 22 L7 17 L11 26 L14 24.5 L10 16 L17 16 Z\" fill=\"#0b0c0c\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-linejoin=\"round\" /><\/svg>\n\t\t\t<\/div>\n\t\t<\/div>\n\t<\/div>\n\t<p class=\"sr-only\" id=\"live\" aria-live=\"polite\"><\/p>\n<\/main>\n\n<script>\n\t// What the person types into the form.\n\tconst FORM = {\n\t\tname: 'Change driving licence address',\n\t\tdescription: \"Change a user's driving licence address using either a postcode search or by entering the address manually.\",\n\t\tlink: 'gov.uk/change-address-driving-licence'\n\t};\n\n\t// The checks shown while the draft is made. A check is finished once the progress passes its \"doneAt\"\n\t// value, and is the one being worked on from the previous check's value until then.\n\tconst PROGRESS = {\n\t\tchecks: [\n\t\t\t{ label: 'Read gov.uk/change-address-driving-licence', doneAt: 18 },\n\t\t\t{ label: 'Understood your description', doneAt: 36 },\n\t\t\t{ label: 'Found 4 steps and 1 branch', doneAt: 52 },\n\t\t\t{ label: 'Drafting questions and conditions', doneAt: 84 },\n\t\t\t{ label: 'Checking the journey graph', doneAt: 100 }\n\t\t],\n\t\t// Where the progress has got to over the length of the wait, as pairs of the share of the time\n\t\t// that has passed and the percentage reached. It speeds up and slows down as real work does.\n\t\ttiming: [[0, 0], [0.14, 18], [0.32, 36], [0.5, 52], [0.78, 84], [0.92, 96], [1, 100]],\n\t\tdurationMs: 11000\n\t};\n\n\t// The blank graph that loops on the right while the draft is made, in the order its parts join up. A part\n\t// is a shape to fade in or a line to draw, with the time in milliseconds to wait before the next one.\n\tconst GRAPH_LOOP = [\n\t\t{ shape: 'start-disc', wait: 250 },\n\t\t{ line: 'edge-1', wait: 150 },\n\t\t{ shape: 'node-1', wait: 300 },\n\t\t{ line: 'edge-2', wait: 150 },\n\t\t{ shape: 'diamond', wait: 300 },\n\t\t{ line: 'edge-3', also: 'edge-4', wait: 150 },\n\t\t{ shape: 'node-2', also: 'node-3', wait: 350 },\n\t\t{ line: 'edge-5', also: 'edge-6', wait: 250 },\n\t\t{ shape: 'node-4', wait: 300 },\n\t\t{ line: 'edge-7', wait: 200 },\n\t\t{ shape: 'end-disc', wait: 1500 }\n\t];\n\n\tconst TICK = '<svg width=\"11\" height=\"9\" viewBox=\"0 0 14 11\"><path d=\"M1.5 5.5 L5 9 L12.5 1.5\" fill=\"none\" stroke=\"#00703c\" stroke-width=\"2.6\"/><\/svg>';\n\tconst CIRCUMFERENCE = 2 * Math.PI * 50;\n\tconst $ = (id) => document.getElementById(id);\n\n\tconst stage = $('stage');\n\tconst viewport = $('viewport');\n\tconst cursorEl = $('cursor');\n\tconst screens = ['landing', 'draft', 'form', 'generating'].map((name) => $(`screen-${name}`));\n\tconst stepEls = [];\n\tlet cursor = { x: 1200, y: 760 };\n\n\t/**\n\t * Draws the list of checks, which comes from the PROGRESS values. The timeline only ever changes how\n\t * they look, it never creates them.\n\t */\n\tfunction build() {\n\t\tfor (const check of PROGRESS.checks) {\n\t\t\tconst row = document.createElement('div');\n\t\t\trow.className = 'step';\n\t\t\trow.innerHTML = `<span class=\"mark\"><span class=\"tick\">${TICK}<\/span><\/span><span>${check.label}<\/span>`;\n\t\t\t$('steps').appendChild(row);\n\t\t\tstepEls.push(row);\n\t\t}\n\t}\n\n\t/**\n\t * Scales the fixed size stage to the width it has been given.\n\t */\n\tfunction fit() {\n\t\tstage.style.transform = `scale(${viewport.clientWidth / 1440})`;\n\t}\n\n\tconst clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\n\tconst lerp = (a, b, t) => a + (b - a) * t;\n\tconst easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);\n\n\t/**\n\t * Runs onFrame with a 0 to 1 progress value over the given milliseconds, and resolves when it is done.\n\t */\n\tfunction tween(ms, onFrame, ease = easeInOut) {\n\t\treturn new Promise((resolve) => {\n\t\t\tconst start = performance.now();\n\t\t\tfunction frame(now) {\n\t\t\t\tconst t = clamp((now - start) / ms, 0, 1);\n\t\t\t\tonFrame(ease(t));\n\t\t\t\tif (t < 1) requestAnimationFrame(frame);\n\t\t\t\telse resolve();\n\t\t\t}\n\t\t\trequestAnimationFrame(frame);\n\t\t});\n\t}\n\n\tconst wait = (ms) => tween(ms, () => {}, (t) => t);\n\n\t/**\n\t * Puts the pointer at a point on the stage.\n\t */\n\tfunction setCursor(x, y) {\n\t\tcursor = { x, y };\n\t\tcursorEl.style.transform = `translate(${x}px, ${y}px)`;\n\t}\n\n\t/**\n\t * Finds the middle of an element on the stage, wherever it has got to.\n\t */\n\tfunction centreOf(el, dx = 0, dy = 0) {\n\t\tconst box = stage.getBoundingClientRect();\n\t\tconst scale = box.width / 1440;\n\t\tconst r = el.getBoundingClientRect();\n\t\treturn { x: (r.left + r.width / 2 - box.left) / scale + dx, y: (r.top + r.height / 2 - box.top) / scale + dy };\n\t}\n\n\t/**\n\t * Moves the pointer to an element and clicks it, with a ring that spreads from the point of the click.\n\t */\n\tasync function click(el, dx = 0, dy = 0, ms = 900) {\n\t\tconst from = { ...cursor };\n\t\tconst to = centreOf(el, dx, dy);\n\t\tawait tween(ms, (e) => setCursor(lerp(from.x, to.x, e), lerp(from.y, to.y, e)));\n\t\tcursorEl.classList.remove('clicking');\n\t\tvoid cursorEl.offsetWidth;\n\t\tcursorEl.classList.add('clicking');\n\t\tawait wait(220);\n\t}\n\n\t/**\n\t * Presses a button down and lets it up again.\n\t */\n\tasync function press(el) {\n\t\tel.classList.add('pressed');\n\t\tawait wait(160);\n\t\tel.classList.remove('pressed');\n\t}\n\n\t/**\n\t * Shows one page and hides the rest.\n\t */\n\tfunction showScreen(index) {\n\t\tscreens.forEach((screen, i) => screen.classList.toggle('active', i === index));\n\t}\n\n\t/**\n\t * Types text into a field, a letter at a time, with a caret and a blue edge while it is being typed in.\n\t */\n\tasync function typeInto(field, text, ms, onFirstLetter) {\n\t\tconst val = field.querySelector('.val');\n\t\tfield.classList.add('focus');\n\t\tawait wait(250);\n\t\tlet started = false;\n\t\tawait tween(ms, (e) => {\n\t\t\tval.textContent = text.slice(0, Math.round(e * text.length));\n\t\t\tif (!started && val.textContent) {\n\t\t\t\tstarted = true;\n\t\t\t\tif (onFirstLetter) onFirstLetter();\n\t\t\t}\n\t\t}, (t) => t);\n\t\tawait wait(250);\n\t\tfield.classList.remove('focus');\n\t}\n\n\t/**\n\t * Tells screen readers what is happening, in plain words.\n\t */\n\tfunction say(text) {\n\t\t$('live').textContent = text;\n\t}\n\n\t/**\n\t * Works out the percentage reached for a share of the time that has passed, easing between the points\n\t * in PROGRESS.timing.\n\t */\n\tfunction percentAt(share) {\n\t\tconst points = PROGRESS.timing;\n\t\tfor (let i = 1; i < points.length; i++) {\n\t\t\tif (share <= points[i][0]) {\n\t\t\t\tconst [t0, p0] = points[i - 1];\n\t\t\t\tconst [t1, p1] = points[i];\n\t\t\t\treturn lerp(p0, p1, easeInOut((share - t0) / (t1 - t0)));\n\t\t\t}\n\t\t}\n\t\treturn 100;\n\t}\n\n\t/**\n\t * Draws one line of the graph, from its start to its end.\n\t */\n\tfunction drawLine(id, ms) {\n\t\tconst path = $(id);\n\t\treturn tween(ms, (e) => (path.style.strokeDashoffset = String(1 - e)));\n\t}\n\n\t/**\n\t * Sets everything on the generating page for a percentage: the ring and its number, the bar, the list\n\t * of checks.\n\t */\n\tfunction setProgress(percent) {\n\t\tconst shown = Math.round(percent);\n\t\t$('ring-fill').setAttribute('stroke-dasharray', `${(percent / 100) * CIRCUMFERENCE} ${CIRCUMFERENCE}`);\n\t\t$('ring-number').textContent = `${shown}%`;\n\t\t$('bar-fill').style.width = `${percent}%`;\n\n\t\t// A check is finished once the progress passes it, is being worked on until then if the one before\n\t\t// it is finished, and waits otherwise.\n\t\tPROGRESS.checks.forEach((check, i) => {\n\t\t\tconst finished = percent >= check.doneAt;\n\t\t\tconst previousFinished = i === 0 || percent >= PROGRESS.checks[i - 1].doneAt;\n\t\t\tstepEls[i].classList.toggle('done', finished);\n\t\t\tstepEls[i].classList.toggle('active', !finished && previousFinished);\n\t\t});\n\t}\n\n\t// Changes each time the graph is reset, so a loop that has been replaced knows to stop.\n\tlet graphRun = 0;\n\n\t/**\n\t * Fades out every shape and line of the blank graph, ready for it to join up again.\n\t */\n\tfunction clearGraph() {\n\t\tdocument.querySelectorAll('.start-disc, .diamond, .gnode, .end-disc').forEach((el) => el.classList.remove('on', 'final'));\n\t\tdocument.querySelectorAll('.line-solid').forEach((el) => (el.style.strokeDashoffset = '1'));\n\t}\n\n\t/**\n\t * Fades in a shape or draws a line, whichever the id belongs to.\n\t */\n\tfunction revealGraphPart(id) {\n\t\tconst el = $(id);\n\t\tif (el.classList.contains('line-solid')) return drawLine(id, 450);\n\t\tel.classList.add('on');\n\t\treturn Promise.resolve();\n\t}\n\n\t/**\n\t * Joins the blank shapes up one after another, clears them and does it again, for as long as the draft is\n\t * being made. A new run number is taken each time, so starting again or finishing stops the old loop.\n\t */\n\tasync function loopGraph() {\n\t\tconst mine = ++graphRun;\n\t\twhile (mine === graphRun) {\n\t\t\tclearGraph();\n\t\t\tawait wait(500);\n\t\t\tfor (const part of GRAPH_LOOP) {\n\t\t\t\tif (mine !== graphRun) return;\n\t\t\t\tconst ids = [part.shape || part.line, part.also].filter(Boolean);\n\t\t\t\tawait Promise.all(ids.map(revealGraphPart));\n\t\t\t\tawait wait(part.wait);\n\t\t\t}\n\t\t\tif (mine !== graphRun) return;\n\t\t\t// The finished shape is held for a moment and then faded out, so the loop reads as starting again.\n\t\t\tawait wait(600);\n\t\t}\n\t}\n\n\t/**\n\t * Stops the loop and leaves the whole blank graph joined up.\n\t */\n\tfunction completeGraph() {\n\t\tgraphRun++;\n\t\tdocument.querySelectorAll('.start-disc, .diamond, .gnode, .end-disc').forEach((el) => el.classList.add('on'));\n\t\tdocument.querySelectorAll('.line-solid').forEach((el) => (el.style.strokeDashoffset = '0'));\n\t}\n\n\t/**\n\t * The moment the draft is complete: the ring turns green, the draft graph settles into its finished\n\t * shape, and the heading says the draft is ready.\n\t */\n\tasync function finish() {\n\t\t$('ring').classList.add('finished');\n\t\t$('ring-fill').style.stroke = '#00703c';\n\t\t$('bar-fill').style.backgroundColor = '#00703c';\n\t\tsay('The first draft is ready');\n\n\t\t// The loop stops and the graph is left fully joined up, with its end shape filled in.\n\t\tcompleteGraph();\n\t\t$('end-disc').classList.add('final');\n\t\t$('draft-state').textContent = 'Draft ready';\n\t\t$('draft-state').classList.add('ready');\n\n\t\t// The words change to say it is done.\n\t\t$('progress-title').classList.add('swap');\n\t\t$('progress-sub').classList.add('swap');\n\t\tawait wait(250);\n\t\t$('progress-title').textContent = 'Your draft is ready';\n\t\t$('progress-sub').textContent = 'The journey graph is ready for you to edit and review.';\n\t\t$('progress-title').classList.remove('swap');\n\t\t$('progress-sub').classList.remove('swap');\n\t}\n\n\t/**\n\t * Puts everything back to the start: the landing page showing and nothing filled in.\n\t */\n\tfunction reset() {\n\t\tstage.classList.remove('fade');\n\t\tshowScreen(0);\n\t\tcursorEl.classList.remove('visible', 'clicking');\n\t\tsetCursor(1200, 760);\n\t\t$('option-automation').classList.remove('chosen');\n\t\t$('option-blank').classList.remove('chosen');\n\t\tfor (const id of ['field-name', 'field-description', 'field-link']) {\n\t\t\t$(id).querySelector('.val').textContent = '';\n\t\t\t$(id).classList.remove('focus');\n\t\t}\n\t\t$('link-icon').classList.remove('on');\n\t\t$('ring').classList.remove('finished');\n\t\t$('ring-fill').style.stroke = '';\n\t\t$('bar-fill').style.backgroundColor = '';\n\t\t$('progress-title').textContent = 'Drafting your service';\n\t\t$('progress-sub').textContent = 'Reading what is on GOV.UK and building the journey. Usually under a minute.';\n\t\t$('draft-state').textContent = 'Draft forming';\n\t\t$('draft-state').classList.remove('ready');\n\t\tgraphRun++;\n\t\tclearGraph();\n\t\tsetProgress(0);\n\t}\n\n\t/**\n\t * The whole story, in order: start a new service, choose automation, fill in the form, generate the first\n\t * draft and watch the progress fill to completion.\n\t */\n\tasync function run() {\n\t\treset();\n\t\tsay('Create a service page, with a button to start a new service');\n\t\tawait wait(900);\n\n\t\t// Page one: start a new service.\n\t\tcursorEl.classList.add('visible');\n\t\tawait click($('start-button'));\n\t\tawait press($('start-button'));\n\t\tawait wait(200);\n\n\t\t// Page two: choose to draft it with automation.\n\t\tsay('Choosing how to draft the service');\n\t\tshowScreen(1);\n\t\tawait wait(1000);\n\t\tawait click($('option-automation'), 0, -10);\n\t\t$('option-automation').classList.add('chosen');\n\t\tsay('Draft it with automation is chosen');\n\t\tawait wait(900);\n\t\tawait click($('continue-button'));\n\t\tawait press($('continue-button'));\n\t\tawait wait(200);\n\n\t\t// Page three: tell the assistant about the service.\n\t\tsay('Telling the assistant about the service');\n\t\tshowScreen(2);\n\t\tawait wait(1000);\n\t\tawait click($('field-name'));\n\t\tawait typeInto($('field-name'), FORM.name, 1100);\n\t\tawait wait(250);\n\t\tawait click($('field-description'), 0, -10, 700);\n\t\tawait typeInto($('field-description'), FORM.description, 2300);\n\t\tawait wait(250);\n\t\tawait click($('field-link'), 0, 0, 700);\n\t\tawait typeInto($('field-link'), FORM.link, 1500, () => $('link-icon').classList.add('on'));\n\t\tawait wait(500);\n\t\tawait click($('generate-button'));\n\t\tawait press($('generate-button'));\n\t\tawait wait(200);\n\n\t\t// Page four: the first draft is generated while the progress fills.\n\t\tsay('The first draft is being generated');\n\t\tcursorEl.classList.remove('visible');\n\t\tshowScreen(3);\n\t\tloopGraph();\n\t\tawait wait(900);\n\t\tawait tween(PROGRESS.durationMs, (t) => setProgress(percentAt(t)), (t) => t);\n\t\tsetProgress(100);\n\t\tawait finish();\n\t\tawait wait(3800);\n\n\t\tstage.classList.add('fade');\n\t\tawait wait(900);\n\t}\n\n\t/**\n\t * Runs the story over and over.\n\t */\n\tasync function loop() {\n\t\twhile (true) await run();\n\t}\n\n\t/**\n\t * Shows the finished picture straight away, with nothing moving, for anyone who has asked their device\n\t * to reduce motion. This is the generating page once the draft is complete.\n\t */\n\tfunction showFinal() {\n\t\treset();\n\t\tshowScreen(3);\n\t\tsetProgress(100);\n\t\tcompleteGraph();\n\t\t$('ring-fill').style.stroke = '#00703c';\n\t\t$('bar-fill').style.backgroundColor = '#00703c';\n\t\t$('end-disc').classList.add('final');\n\t\t$('draft-state').textContent = 'Draft ready';\n\t\t$('draft-state').classList.add('ready');\n\t\t$('progress-title').textContent = 'Your draft is ready';\n\t\t$('progress-sub').textContent = 'The journey graph is ready for you to edit and review.';\n\t\tsay('A new service has been started with automation, and the first draft is ready');\n\t}\n\n\tbuild();\n\tfit();\n\tnew ResizeObserver(fit).observe(viewport);\n\n\tif (matchMedia('(prefers-reduced-motion: reduce)').matches) showFinal();\n\telse loop();\n<\/script>\n<\/body>\n<\/html>\n" },
		{ name: "Building a journey on the graph", source: "<!doctype html>\n<html lang=\"en-GB\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Service Studio: building a journey<\/title>\n<!--\n\tA self contained animation of the Service Studio graph editor. A short service that has been generated\n\tappears first, the view zooms in on its last step, and a condition, two branch steps and an end are\n\tadded to it one at a time, each connected as it arrives. Everything it needs is in this one file, so it\n\tcan be shared or opened on its own. To change what is shown, edit the NODES and EDGES lists, the STEPS\n\tcaptions and the run() timeline in the script at the bottom.\n-->\n<style>\n\t:root {\n\t\t--text: #0b0c0c;\n\t\t--secondary-text: #505a5f;\n\t\t--muted: #737373;\n\t\t--border: #c9cac6;\n\t\t--soft-border: #d8d8d3;\n\t\t--line: #7b8387;\n\t\t--blue: #1d70b8;\n\t\t--blue-tint: #e8f1f8;\n\t\t--yellow: #ffdd00;\n\t\t--green: #00703c;\n\t\t--green-tint: #cce2d8;\n\t\t--black: #0b0c0c;\n\t}\n\n\t* {\n\t\tbox-sizing: border-box;\n\t}\n\n\tbody {\n\t\tmargin: 0;\n\t\tpadding: 20px;\n\t\tmin-height: 100vh;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tbackground: #ffffff;\n\t\tcolor: var(--text);\n\t\tfont-family: 'GDS Transport', arial, sans-serif;\n\t}\n\n\t/* The animation is kept as wide as the window allows, but never so wide that its height runs off the bottom. */\n\t.wrap {\n\t\twidth: min(100%, 1440px, calc((100vh - 40px) * 1.6));\n\t}\n\n\t.sr-only {\n\t\tposition: absolute;\n\t\twidth: 1px;\n\t\theight: 1px;\n\t\tmargin: -1px;\n\t\tpadding: 0;\n\t\toverflow: hidden;\n\t\tclip: rect(0, 0, 0, 0);\n\t\twhite-space: nowrap;\n\t\tborder: 0;\n\t}\n\n\t/* The stage is drawn at a fixed 1440 by 900 and scaled to fit, so every position below is in the same\n\t\tsimple coordinates whatever size the page is viewed at. */\n\t.viewport {\n\t\tposition: relative;\n\t\twidth: 100%;\n\t\taspect-ratio: 1440 / 900;\n\t\toverflow: hidden;\n\t\tbackground: #ffffff;\n\t}\n\n\t.stage {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 1440px;\n\t\theight: 900px;\n\t\ttransform-origin: 0 0;\n\t}\n\n\t/* The window onto the drawing: a square of dotted canvas. What is inside it, the world, is what gets\n\t\tzoomed and moved. */\n\t.canvas {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 900px;\n\t\theight: 900px;\n\t\toverflow: hidden;\n\t\tbackground-image: radial-gradient(circle at 2px 2px, #e6e6e2 1.2px, transparent 1.7px);\n\t\tbackground-size: 30px 30px;\n\t}\n\n\t.world {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 900px;\n\t\theight: 900px;\n\t\ttransform-origin: 0 0;\n\t\ttransition: opacity 0.6s ease;\n\t}\n\n\t.world.fade {\n\t\topacity: 0;\n\t}\n\n\t/* Softens the right hand edge of the canvas into the white behind the timeline. */\n\t.canvas-fade {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 780px;\n\t\twidth: 120px;\n\t\theight: 900px;\n\t\tbackground: linear-gradient(90deg, rgba(255, 255, 255, 0), #ffffff);\n\t\tpointer-events: none;\n\t}\n\n\t/* The shape rail. The shape being added is highlighted as it is used. */\n\t.rail {\n\t\tposition: absolute;\n\t\ttop: 96px;\n\t\tleft: 64px;\n\t\twidth: 52px;\n\t\tpadding: 8px 0;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\talign-items: center;\n\t\tgap: 4px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--soft-border);\n\t\tborder-radius: 16px;\n\t}\n\n\t.rail-item {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\twidth: 36px;\n\t\theight: 36px;\n\t\tborder-radius: 10px;\n\t\ttransition: background-color 0.25s;\n\t}\n\n\t.rail-item.active {\n\t\tbackground: var(--blue-tint);\n\t}\n\n\t.glyph-step {\n\t\twidth: 16px;\n\t\theight: 12px;\n\t\tborder: 1.8px solid var(--black);\n\t\tborder-radius: 2px;\n\t}\n\n\t.glyph-condition {\n\t\twidth: 16px;\n\t\theight: 16px;\n\t\tbackground: var(--yellow);\n\t\tclip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);\n\t}\n\n\t.glyph-end {\n\t\twidth: 16px;\n\t\theight: 16px;\n\t\tborder: 1.8px solid var(--black);\n\t\tborder-radius: 50%;\n\t\tbackground: var(--green);\n\t}\n\n\t/* The numbered steps, one under another to the right of the canvas, joined by a line that fills in\n\t\tas each is completed. */\n\t.timeline {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 960px;\n\t\twidth: 384px;\n\t\theight: 900px;\n\t\tmargin: 0;\n\t\tpadding: 0;\n\t\tlist-style: none;\n\t\tdisplay: flex;\n\t\tflex-direction: column;\n\t\tjustify-content: center;\n\t}\n\n\t.tl {\n\t\tposition: relative;\n\t\tdisplay: grid;\n\t\tgrid-template-columns: 32px 24px 1fr;\n\t\tcolumn-gap: 20px;\n\t\talign-items: start;\n\t\tpadding-bottom: 56px;\n\t\tcolor: var(--muted);\n\t}\n\n\t.tl:last-child {\n\t\tpadding-bottom: 0;\n\t}\n\n\t.tl::after {\n\t\tcontent: '';\n\t\tposition: absolute;\n\t\ttop: 32px;\n\t\tbottom: 0;\n\t\tleft: 15px;\n\t\twidth: 2px;\n\t\tbackground: #e5e5e0;\n\t\ttransition: background-color 0.3s;\n\t}\n\n\t.tl:last-child::after {\n\t\tdisplay: none;\n\t}\n\n\t.tl.done::after {\n\t\tbackground: var(--green-tint);\n\t}\n\n\t.tl .dot {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\twidth: 32px;\n\t\theight: 32px;\n\t\tborder-radius: 50%;\n\t\tbackground: #ffffff;\n\t\tborder: 1.5px solid #b1b4b6;\n\t\tcolor: var(--muted);\n\t\tfont-size: 0.875rem;\n\t\tfont-weight: 700;\n\t\ttransition: background-color 0.3s, border-color 0.3s, color 0.3s;\n\t}\n\n\t.tl .dot svg {\n\t\tdisplay: none;\n\t}\n\n\t.tl.done .dot {\n\t\tbackground: var(--green-tint);\n\t\tborder-color: var(--green-tint);\n\t}\n\n\t.tl.done .dot b {\n\t\tdisplay: none;\n\t}\n\n\t.tl.done .dot svg {\n\t\tdisplay: block;\n\t}\n\n\t.tl.current .dot {\n\t\tbackground: var(--blue);\n\t\tborder-color: var(--blue);\n\t\tcolor: #ffffff;\n\t\tfont-size: 0.9375rem;\n\t}\n\n\t.tl .glyph {\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\twidth: 24px;\n\t\theight: 24px;\n\t\tmargin-top: 4px;\n\t\tcolor: #9aa0a4;\n\t\ttransition: color 0.3s, opacity 0.3s;\n\t}\n\n\t.tl.done .glyph,\n\t.tl.current .glyph {\n\t\tcolor: var(--black);\n\t}\n\n\t.tl .glyph svg {\n\t\toverflow: visible;\n\t}\n\n\t.tl .label {\n\t\tmargin-top: 3px;\n\t\tfont-size: 1.1875rem;\n\t\tline-height: 26px;\n\t\ttransition: color 0.3s;\n\t}\n\n\t.tl.done .label {\n\t\tcolor: var(--secondary-text);\n\t}\n\n\t.tl.current .label {\n\t\tmargin-top: 0;\n\t\tcolor: var(--text);\n\t\tfont-size: 1.375rem;\n\t\tfont-weight: 700;\n\t\tline-height: 29px;\n\t}\n\n\t/* Lines sit under the shapes. A finished line is solid grey, drawn in by moving its dash offset from 1\n\t\t(nothing showing) to 0 (all showing). */\n\t.edges {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\tpointer-events: none;\n\t}\n\n\t.edge {\n\t\tfill: none;\n\t\tstroke: var(--line);\n\t\tstroke-width: 1.5;\n\t\tstroke-linecap: round;\n\t\tstroke-dasharray: 1;\n\t\tstroke-dashoffset: 1;\n\t}\n\n\t/* The line being dragged: dotted blue, redrawn each frame as far as the pointer has got. */\n\t.drag {\n\t\tfill: none;\n\t\tstroke: var(--blue);\n\t\tstroke-width: 2;\n\t\tstroke-linecap: round;\n\t\tstroke-dasharray: 1 6;\n\t}\n\n\t/* A shape. Its position and size are set from the script as it appears, so it starts hidden. */\n\t.node {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\topacity: 0;\n\t\ttransform-origin: 50% 50%;\n\t\ttransition: opacity 0.25s ease;\n\t}\n\n\t.node.show {\n\t\topacity: 1;\n\t}\n\n\t.inner {\n\t\tposition: relative;\n\t\twidth: 100%;\n\t\theight: 100%;\n\t}\n\n\t.node.pop > .inner {\n\t\tanimation: pop 0.3s ease-out;\n\t}\n\n\t@keyframes pop {\n\t\t0% { transform: scale(1.08); }\n\t\t100% { transform: scale(1); }\n\t}\n\n\t.step-body {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: center;\n\t\tpadding: 0 10px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--border);\n\t\tborder-radius: 6px;\n\t\tfont-size: 0.875rem;\n\t\tfont-weight: 700;\n\t\tline-height: 1.2;\n\t\ttext-align: center;\n\t\ttransition: border-color 0.3s, background-color 0.3s;\n\t}\n\n\t/* The step being worked on: a blue outline and a light blue fill. */\n\t.node.selected .step-body {\n\t\tborder-color: var(--blue);\n\t\tbox-shadow: 0 0 0 1px var(--blue);\n\t\tbackground: #f2f7fb;\n\t}\n\n\t.cond-shape {\n\t\twidth: 100%;\n\t\theight: 100%;\n\t\tbackground: var(--yellow);\n\t\tclip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);\n\t}\n\n\t.start-disc,\n\t.end-disc {\n\t\twidth: 100%;\n\t\theight: 100%;\n\t\tborder: 2px solid #ffffff;\n\t\tborder-radius: 50%;\n\t}\n\n\t.start-disc {\n\t\tbackground: var(--black);\n\t\tbox-shadow: 0 0 0 1.5px var(--black);\n\t}\n\n\t.end-disc {\n\t\tbackground: var(--green);\n\t\tbox-shadow: 0 0 0 1.5px var(--green);\n\t}\n\n\t.node.condition .inner,\n\t.node.end .inner {\n\t\ttransition: opacity 0.4s;\n\t}\n\n\t/* A shape that has been added but is not connected yet: faded, with a dashed ring that opens out and\n\t\tdisappears when the shape is connected and becomes part of the service. */\n\t.node.condition::after,\n\t.node.end::after {\n\t\tcontent: '';\n\t\tposition: absolute;\n\t\ttop: 50%;\n\t\tleft: 50%;\n\t\twidth: 60px;\n\t\theight: 60px;\n\t\tmargin: -30px 0 0 -30px;\n\t\tborder: 1.5px dashed var(--blue);\n\t\tborder-radius: 50%;\n\t\topacity: 0;\n\t\tpointer-events: none;\n\t}\n\n\t/* The outline takes the shape's own form: a diamond for a condition, a circle for an end. */\n\t.node.condition::after {\n\t\twidth: 40px;\n\t\theight: 40px;\n\t\tmargin: -20px 0 0 -20px;\n\t\tborder-radius: 3px;\n\t\ttransform: rotate(45deg);\n\t}\n\n\t.node.draft .inner {\n\t\topacity: 0.4;\n\t}\n\n\t.node.draft::after {\n\t\topacity: 1;\n\t}\n\n\t/* While a line is about to land on it, the landing outline stands in for its own, so the two are never\n\t\tdrawn one on top of the other. */\n\t.node.targeted::after {\n\t\topacity: 0;\n\t}\n\n\t.node.promoted::after {\n\t\tanimation: ring-out 0.8s ease-out;\n\t}\n\n\t.node.condition.promoted::after {\n\t\tanimation-name: ring-out-diamond;\n\t}\n\n\t@keyframes ring-out {\n\t\t0% { opacity: 1; transform: scale(1); }\n\t\t100% { opacity: 0; transform: scale(1.7); }\n\t}\n\n\t@keyframes ring-out-diamond {\n\t\t0% { opacity: 1; transform: rotate(45deg) scale(1); }\n\t\t100% { opacity: 0; transform: rotate(45deg) scale(1.7); }\n\t}\n\n\t/* Where a line starts while it is being dragged. */\n\t.src {\n\t\tposition: absolute;\n\t\twidth: 12px;\n\t\theight: 12px;\n\t\tbackground: var(--blue);\n\t\tborder: 2px solid #ffffff;\n\t\tborder-radius: 4px;\n\t\tbox-shadow: 0 0 0 1px var(--blue);\n\t\ttransform: translate(-50%, -50%);\n\t\topacity: 0;\n\t\ttransition: opacity 0.15s;\n\t}\n\n\t/* Where a line will land: a dashed outline round the shape, drawn in the shape's own form. */\n\t.target {\n\t\tposition: absolute;\n\t\tborder: 1.5px dashed var(--blue);\n\t\topacity: 0;\n\t\ttransition: opacity 0.15s;\n\t\tpointer-events: none;\n\t}\n\n\t.src.on,\n\t.target.on {\n\t\topacity: 1;\n\t}\n\n\t/* The pointer is drawn at its own fixed size whatever the zoom, so the script sets its scale to match. */\n\t.cursor {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 0;\n\t\theight: 0;\n\t\tpointer-events: none;\n\t\topacity: 0;\n\t\ttransition: opacity 0.3s;\n\t}\n\n\t.cursor.visible {\n\t\topacity: 1;\n\t}\n\n\t.cursor svg {\n\t\tposition: absolute;\n\t\ttop: -2px;\n\t\tleft: -2px;\n\t\tfilter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));\n\t}\n\n\t@media (prefers-reduced-motion: reduce) {\n\t\t.world,\n\t\t.node,\n\t\t.rail-item,\n\t\t.tl::after,\n\t\t.tl .dot,\n\t\t.tl .glyph,\n\t\t.tl .label,\n\t\t.step-body,\n\t\t.src,\n\t\t.target,\n\t\t.node.condition .inner,\n\t\t.node.end .inner {\n\t\t\ttransition: none;\n\t\t}\n\n\t\t.node.pop > .inner,\n\t\t.node.promoted::after {\n\t\t\tanimation: none;\n\t\t}\n\t}\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n\t<h1 class=\"sr-only\">Building a journey in Service Studio<\/h1>\n\n\t<div class=\"viewport\" id=\"viewport\">\n\t\t<!-- The drawing is for sight only. The current step is repeated in plain text just below for screen readers. -->\n\t\t<div class=\"stage\" id=\"stage\" aria-hidden=\"true\">\n\t\t\t<div class=\"canvas\" id=\"canvas\">\n\t\t\t\t<div class=\"world\" id=\"world\">\n\t\t\t\t\t<svg class=\"edges\" id=\"edges\" width=\"900\" height=\"900\">\n\t\t\t\t\t\t<path class=\"drag\" id=\"drag\" d=\"\"><\/path>\n\t\t\t\t\t<\/svg>\n\t\t\t\t\t<div id=\"nodes\"><\/div>\n\t\t\t\t\t<div class=\"src\" id=\"src\"><\/div>\n\t\t\t\t\t<div class=\"target\" id=\"target\"><\/div>\n\t\t\t\t\t<div class=\"cursor\" id=\"cursor\">\n\t\t\t\t\t\t<svg width=\"18\" height=\"24\" viewBox=\"0 0 22 28\"><path d=\"M2 2 L2 22 L7 17 L11 26 L14 24.5 L10 16 L17 16 Z\" fill=\"#0b0c0c\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><\/svg>\n\t\t\t\t\t<\/div>\n\t\t\t\t<\/div>\n\t\t\t<\/div>\n\t\t\t<div class=\"canvas-fade\"><\/div>\n\n\t\t\t<div class=\"rail\">\n\t\t\t\t<span class=\"rail-item\" data-shape=\"step\"><span class=\"glyph-step\"><\/span><\/span>\n\t\t\t\t<span class=\"rail-item\" data-shape=\"condition\"><span class=\"glyph-condition\"><\/span><\/span>\n\t\t\t\t<span class=\"rail-item\" data-shape=\"end\"><span class=\"glyph-end\"><\/span><\/span>\n\t\t\t<\/div>\n\n\t\t\t<ol class=\"timeline\" id=\"timeline\"><\/ol>\n\t\t<\/div>\n\t<\/div>\n\t<p class=\"sr-only\" id=\"live\" aria-live=\"polite\"><\/p>\n<\/main>\n\n<script>\n\t// The shapes that end up on the canvas, by centre. The first five are the short service that has been\n\t// generated. draft shapes start faded until they are connected.\n\tconst NODES = {\n\t\tbegin: { kind: 'start', x: 450, y: 70, w: 36, h: 36 },\n\t\tcheck: { kind: 'step', x: 450, y: 150, w: 290, h: 44, text: 'Check you can use this service' },\n\t\tlicence: { kind: 'step', x: 450, y: 230, w: 290, h: 44, text: 'Enter your driving licence number' },\n\t\tidentity: { kind: 'step', x: 450, y: 310, w: 290, h: 44, text: 'Confirm your identity' },\n\t\tchoose: { kind: 'step', x: 450, y: 390, w: 290, h: 44, text: 'Choose how to enter your address' },\n\t\tgate: { kind: 'condition', x: 450, y: 500, w: 36, h: 36, draft: true },\n\t\tpostcode: { kind: 'step', x: 320, y: 620, w: 244, h: 44, text: 'Find your address by postcode' },\n\t\tmanual: { kind: 'step', x: 580, y: 620, w: 244, h: 44, text: 'Enter your address manually' },\n\t\tfinish: { kind: 'end', x: 450, y: 760, w: 36, h: 36, draft: true }\n\t};\n\n\t// The lines, each from the bottom of one shape to the top of the next. g1 to g4 belong to the generated\n\t// service and draw themselves. The two shapes that become real once connected are named in PROMOTES\n\t// against the line that completes them.\n\tconst EDGES = {\n\t\tg1: ['begin', 'check'],\n\t\tg2: ['check', 'licence'],\n\t\tg3: ['licence', 'identity'],\n\t\tg4: ['identity', 'choose'],\n\t\ta: ['choose', 'gate'],\n\t\tb: ['gate', 'postcode'],\n\t\tc: ['gate', 'manual'],\n\t\td: ['postcode', 'finish'],\n\t\te: ['manual', 'finish']\n\t};\n\tconst PROMOTES = { c: 'gate', d: 'finish' };\n\n\t// The numbered steps listed down the right hand side. They say why each moment matters, not what is\n\t// already visible on the canvas. Each has a small glyph, drawn here as SVG.\n\tconst GLYPH_STROKE = 'fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"';\n\tconst STEPS = [\n\t\t{\n\t\t\ttext: 'A first draft of the service is generated',\n\t\t\tglyph: `<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" ${GLYPH_STROKE}><rect x=\"5\" y=\"1.5\" width=\"10\" height=\"5\" rx=\"1.5\"/><path d=\"M10 6.5V13.5\"/><rect x=\"5\" y=\"13.5\" width=\"10\" height=\"5\" rx=\"1.5\"/><\/svg>`\n\t\t},\n\t\t{\n\t\t\ttext: 'Refine only the part that needs a person',\n\t\t\tglyph: `<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" ${GLYPH_STROKE}><circle cx=\"8.5\" cy=\"8.5\" r=\"5.5\"/><path d=\"M12.6 12.6L17.5 17.5\"/><\/svg>`\n\t\t},\n\t\t{\n\t\t\ttext: 'Branch where people need different routes',\n\t\t\tglyph: '<span class=\"glyph-condition\"><\/span>'\n\t\t},\n\t\t{\n\t\t\ttext: 'Add an end to a step',\n\t\t\tglyph: '<span class=\"glyph-end\"><\/span>'\n\t\t},\n\t\t{\n\t\t\ttext: 'Connected shapes become part of the service',\n\t\t\tglyph: `<svg width=\"22\" height=\"14\" viewBox=\"0 0 22 14\" ${GLYPH_STROKE}><circle cx=\"3\" cy=\"7\" r=\"2.4\"/><circle cx=\"11\" cy=\"7\" r=\"2.4\"/><circle cx=\"19\" cy=\"7\" r=\"2.4\"/><path d=\"M5.4 7H8.6M13.4 7H16.6\"/><\/svg>`\n\t\t}\n\t];\n\tconst CHECK = '<svg width=\"14\" height=\"11\" viewBox=\"0 0 14 11\"><path d=\"M1.5 5.5L5 9L12.5 1.5\" fill=\"none\" stroke=\"#00703c\" stroke-width=\"2.4\"/><\/svg>';\n\n\tconst OVERVIEW = { s: 1, fx: 450, fy: 450 };\n\tconst CURSOR_START = { x: 760, y: 560 };\n\tconst SVG_NS = 'http://www.w3.org/2000/svg';\n\tconst $ = (id) => document.getElementById(id);\n\n\tconst stage = $('stage');\n\tconst viewport = $('viewport');\n\tconst canvas = $('canvas');\n\tconst world = $('world');\n\tconst cursorEl = $('cursor');\n\tconst dragEl = $('drag');\n\n\tconst nodeEls = {};\n\tconst edgeEls = {};\n\tconst stepEls = [];\n\n\tlet cursor = { ...CURSOR_START };\n\tlet cam = { ...OVERVIEW };\n\n\t/**\n\t * Draws the stage once: the timeline, a hidden shape for every entry in NODES and an undrawn line for\n\t * every entry in EDGES. The timeline only ever shows, moves and styles these, it never creates them.\n\t */\n\tfunction build() {\n\t\tSTEPS.forEach((step, index) => {\n\t\t\tconst item = document.createElement('li');\n\t\t\titem.className = 'tl';\n\t\t\titem.innerHTML = `<span class=\"dot\">${CHECK}<b>${index + 1}<\/b><\/span><span class=\"glyph\">${step.glyph}<\/span><span class=\"label\">${step.text}<\/span>`;\n\t\t\t$('timeline').appendChild(item);\n\t\t\tstepEls.push(item);\n\t\t});\n\n\t\tfor (const [id, c] of Object.entries(NODES)) {\n\t\t\tconst el = document.createElement('div');\n\t\t\tel.className = `node ${c.kind}`;\n\t\t\tel.style.width = c.w + 'px';\n\t\t\tel.style.height = c.h + 'px';\n\n\t\t\tlet inner = '';\n\t\t\tif (c.kind === 'step') inner = `<div class=\"inner step-body\">${c.text}<\/div>`;\n\t\t\tif (c.kind === 'condition') inner = `<div class=\"inner\"><div class=\"cond-shape\"><\/div><\/div>`;\n\t\t\tif (c.kind === 'start') inner = `<div class=\"inner\"><div class=\"start-disc\"><\/div><\/div>`;\n\t\t\tif (c.kind === 'end') inner = `<div class=\"inner\"><div class=\"end-disc\"><\/div><\/div>`;\n\t\t\tel.innerHTML = inner;\n\t\t\t$('nodes').appendChild(el);\n\t\t\tnodeEls[id] = el;\n\t\t}\n\n\t\tfor (const [id, [from, to]] of Object.entries(EDGES)) {\n\t\t\tconst path = document.createElementNS(SVG_NS, 'path');\n\t\t\tpath.setAttribute('class', 'edge');\n\t\t\tpath.setAttribute('pathLength', '1');\n\t\t\tpath.setAttribute('d', route(handlePoint(from, 'bot'), handlePoint(to, 'top')));\n\t\t\t$('edges').insertBefore(path, dragEl);\n\t\t\tedgeEls[id] = path;\n\t\t}\n\t}\n\n\t/**\n\t * The centre of a shape's top or bottom edge, in the drawing's own coordinates.\n\t */\n\tfunction handlePoint(id, side) {\n\t\tconst n = NODES[id];\n\t\treturn { x: n.x, y: side === 'top' ? n.y - n.h / 2 : n.y + n.h / 2 };\n\t}\n\n\t/**\n\t * The path for a line between two points: straight down when they line up, otherwise down to a level a\n\t * little above the target, across, and down again, with rounded corners.\n\t */\n\tfunction route(a, b) {\n\t\tif (Math.abs(a.x - b.x) < 1) return `M${a.x} ${a.y}V${b.y}`;\n\t\tconst bus = b.y - 30;\n\t\tconst r = 10;\n\t\tconst dir = b.x > a.x ? 1 : -1;\n\t\treturn `M${a.x} ${a.y}V${bus - r}Q${a.x} ${bus} ${a.x + dir * r} ${bus}H${b.x - dir * r}Q${b.x} ${bus} ${b.x} ${bus + r}V${b.y}`;\n\t}\n\n\t/**\n\t * Scales the fixed size stage to the width it has been given.\n\t */\n\tfunction fit() {\n\t\tstage.style.transform = `scale(${viewport.clientWidth / 1440})`;\n\t}\n\n\tconst clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\n\tconst lerp = (a, b, t) => a + (b - a) * t;\n\tconst easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);\n\tconst easeOut = (t) => 1 - Math.pow(1 - t, 3);\n\n\t/**\n\t * Runs onFrame with a 0 to 1 progress value over the given milliseconds, and resolves when it is done.\n\t */\n\tfunction tween(ms, onFrame, ease = easeInOut) {\n\t\treturn new Promise((resolve) => {\n\t\t\tconst start = performance.now();\n\t\t\tfunction frame(now) {\n\t\t\t\tconst t = clamp((now - start) / ms, 0, 1);\n\t\t\t\tonFrame(ease(t));\n\t\t\t\tif (t < 1) requestAnimationFrame(frame);\n\t\t\t\telse resolve();\n\t\t\t}\n\t\t\trequestAnimationFrame(frame);\n\t\t});\n\t}\n\n\tconst wait = (ms) => tween(ms, () => {}, (t) => t);\n\n\t/**\n\t * Sets the view: the zoom, and the point of the drawing that sits in the middle of the canvas. The dot\n\t * grid is moved and spaced with it so the whole canvas, not just the shapes, appears to zoom.\n\t */\n\tfunction setCamera(s, fx, fy) {\n\t\tcam = { s, fx, fy };\n\t\tconst tx = 450 - fx * s;\n\t\tconst ty = 450 - fy * s;\n\t\tworld.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;\n\t\tcanvas.style.backgroundSize = `${30 * s}px ${30 * s}px`;\n\t\tcanvas.style.backgroundPosition = `${tx}px ${ty}px`;\n\t\tsetCursor(cursor.x, cursor.y);\n\t}\n\n\t/**\n\t * Eases the view to a new zoom and centre. Zoom is blended by ratio rather than by amount, which is\n\t * what makes a zoom feel even from start to finish.\n\t */\n\tfunction moveCamera(s, fx, fy, ms) {\n\t\tconst from = { ...cam };\n\t\treturn tween(ms, (e) =>\n\t\t\tsetCamera(from.s * Math.pow(s / from.s, e), lerp(from.fx, fx, e), lerp(from.fy, fy, e))\n\t\t);\n\t}\n\n\t/**\n\t * Puts the pointer at a point of the drawing, shrunk by the zoom so it stays the same size on screen.\n\t */\n\tfunction setCursor(x, y) {\n\t\tcursor = { x, y };\n\t\tcursorEl.style.transform = `translate(${x}px, ${y}px) scale(${1 / cam.s})`;\n\t}\n\n\t/**\n\t * Slides the pointer to a point.\n\t */\n\tfunction moveCursor(x, y, ms) {\n\t\tconst from = { ...cursor };\n\t\treturn tween(ms, (e) => setCursor(lerp(from.x, x, e), lerp(from.y, y, e)));\n\t}\n\n\t/**\n\t * Positions a shape by its centre and scale.\n\t */\n\tfunction setPose(id, x, y, scale) {\n\t\tconst n = NODES[id];\n\t\tnodeEls[id].style.transform = `translate(${x - n.w / 2}px, ${y - n.h / 2}px) scale(${scale})`;\n\t}\n\n\t/**\n\t * Moves the timeline on to a step: those before it are ticked, it is the large blue one, and the rest\n\t * wait in grey.\n\t */\n\tfunction showStep(number) {\n\t\tstepEls.forEach((el, index) => {\n\t\t\tel.classList.toggle('done', index < number - 1);\n\t\t\tel.classList.toggle('current', index === number - 1);\n\t\t});\n\t\t$('live').textContent = STEPS[number - 1].text;\n\t}\n\n\t/**\n\t * Highlights one shape on the rail, or none, to show which kind is being added.\n\t */\n\tfunction setRail(shape) {\n\t\tdocument.querySelectorAll('.rail-item').forEach((el) => {\n\t\t\tel.classList.toggle('active', el.dataset.shape === shape);\n\t\t});\n\t}\n\n\t/**\n\t * Brings a shape onto the canvas: it fades in a little above its place and settles down into it.\n\t */\n\tasync function appear(id, ms = 450, after = 400) {\n\t\tconst n = NODES[id];\n\t\tnodeEls[id].classList.add('show');\n\t\tawait tween(ms, (e) => setPose(id, n.x, lerp(n.y - 18, n.y, e), lerp(0.8, 1, e)), easeOut);\n\t\tnodeEls[id].classList.add('placed', 'pop');\n\t\tawait wait(after);\n\t}\n\n\t/**\n\t * Draws a line on its own, with no pointer, the way the generated part of the service arrives.\n\t */\n\tasync function autoDraw(id) {\n\t\tawait tween(450, (e) => {\n\t\t\tedgeEls[id].style.strokeDashoffset = String(1 - e);\n\t\t});\n\t}\n\n\t/**\n\t * Marks where a line is being dragged from: a small blue square on the shape's bottom edge.\n\t */\n\tfunction showSource(point) {\n\t\tconst el = $('src');\n\t\tel.style.left = point.x + 'px';\n\t\tel.style.top = point.y + 'px';\n\t\tel.classList.add('on');\n\t}\n\n\t/**\n\t * Marks where a line will land: a dashed outline round the shape, in the same shape as the shape itself.\n\t */\n\tfunction showTarget(id) {\n\t\tconst n = NODES[id];\n\t\t// A step gets a rounded box, a condition a diamond (a square turned on its corner) and a start or\n\t\t// end a circle.\n\t\tconst isStep = n.kind === 'step';\n\t\tconst isDiamond = n.kind === 'condition';\n\t\tconst w = isStep ? n.w + 16 : isDiamond ? 40 : 60;\n\t\tconst h = isStep ? n.h + 16 : isDiamond ? 40 : 60;\n\t\tconst ring = $('target');\n\t\tring.style.width = w + 'px';\n\t\tring.style.height = h + 'px';\n\t\tring.style.left = n.x - w / 2 + 'px';\n\t\tring.style.top = n.y - h / 2 + 'px';\n\t\tring.style.borderRadius = isStep ? '10px' : isDiamond ? '3px' : '50%';\n\t\tring.style.transform = isDiamond ? 'rotate(45deg)' : '';\n\t\tring.classList.add('on');\n\t\tnodeEls[id].classList.add('targeted');\n\n\t}\n\n\t/**\n\t * Clears the line start mark and the landing outline.\n\t */\n\tfunction clearGuides() {\n\t\t$('src').classList.remove('on');\n\t\t$('target').classList.remove('on');\n\t\tObject.values(nodeEls).forEach((el) => el.classList.remove('targeted'));\n\t\tdragEl.setAttribute('d', '');\n\t}\n\n\t/**\n\t * Draws a line the way a person would: press on the bottom of one shape, drag a dotted line along its\n\t * final route, with the pointer on its leading edge, and let go over the next shape. A shape named in\n\t * PROMOTES stops being faded once its line is drawn.\n\t */\n\tasync function connect(id) {\n\t\tconst [from, to] = EDGES[id];\n\t\tconst a = handlePoint(from, 'bot');\n\t\tconst path = edgeEls[id];\n\t\tconst length = path.getTotalLength();\n\n\t\tawait moveCursor(a.x, a.y, 450);\n\t\tshowSource(a);\n\t\tawait wait(250);\n\n\t\tawait tween(700, (e) => {\n\t\t\tconst reach = e * length;\n\t\t\tlet d = `M${a.x} ${a.y}`;\n\t\t\tfor (let at = 4; at < reach; at += 4) {\n\t\t\t\tconst p = path.getPointAtLength(at);\n\t\t\t\td += `L${p.x} ${p.y}`;\n\t\t\t}\n\t\t\tconst head = path.getPointAtLength(reach);\n\t\t\tdragEl.setAttribute('d', `${d}L${head.x} ${head.y}`);\n\t\t\tsetCursor(head.x, head.y);\n\t\t});\n\n\t\tshowTarget(to);\n\t\tawait moveCursor(NODES[to].x, NODES[to].y, 250);\n\t\tawait wait(450);\n\n\t\tclearGuides();\n\t\tpath.style.strokeDashoffset = '0';\n\n\t\tconst promoted = PROMOTES[id];\n\t\tif (promoted) {\n\t\t\tnodeEls[promoted].classList.remove('draft');\n\t\t\tnodeEls[promoted].classList.add('promoted');\n\t\t}\n\t\tawait wait(350);\n\t}\n\n\t/**\n\t * Puts everything back to the empty canvas, ready for the timeline to start again.\n\t */\n\tfunction reset() {\n\t\tworld.classList.remove('fade');\n\t\tcursorEl.classList.remove('visible');\n\t\tsetRail(null);\n\t\tclearGuides();\n\t\tsetCamera(OVERVIEW.s, OVERVIEW.fx, OVERVIEW.fy);\n\t\tsetCursor(CURSOR_START.x, CURSOR_START.y);\n\t\tfor (const [id, c] of Object.entries(NODES)) {\n\t\t\tnodeEls[id].classList.remove('show', 'placed', 'pop', 'promoted', 'selected');\n\t\t\tnodeEls[id].classList.toggle('draft', Boolean(c.draft));\n\t\t\tsetPose(id, c.x, c.y, 1);\n\t\t}\n\t\tfor (const el of Object.values(edgeEls)) el.style.strokeDashoffset = '';\n\t}\n\n\t/**\n\t * The whole story, in order: a generated service arrives, the view zooms in on its last step, and a\n\t * condition, two branches and an end are added to it, each connected as it appears.\n\t */\n\tasync function run() {\n\t\treset();\n\t\tshowStep(1);\n\t\tawait wait(700);\n\t\tawait appear('begin', 300, 120);\n\t\tfor (const [shape, line] of [['check', 'g1'], ['licence', 'g2'], ['identity', 'g3'], ['choose', 'g4']]) {\n\t\t\tawait appear(shape, 300, 60);\n\t\t\tawait autoDraw(line);\n\t\t}\n\t\tawait wait(1000);\n\n\t\tshowStep(2);\n\t\tnodeEls.choose.classList.add('selected');\n\t\tcursorEl.classList.add('visible');\n\t\tawait moveCamera(1.7, 450, 440, 1400);\n\t\tawait wait(700);\n\n\t\tshowStep(3);\n\t\tsetRail('condition');\n\t\tawait moveCamera(1.5, 450, 480, 800);\n\t\tawait appear('gate');\n\t\tawait connect('a');\n\t\tsetRail('step');\n\t\tawait moveCamera(1.1, 450, 550, 1000);\n\t\tawait appear('postcode');\n\t\tawait connect('b');\n\t\tawait appear('manual');\n\t\tawait connect('c');\n\n\t\tshowStep(4);\n\t\tsetRail('end');\n\t\tawait appear('finish');\n\t\tawait connect('d');\n\t\tawait connect('e');\n\n\t\tshowStep(5);\n\t\tsetRail(null);\n\t\tnodeEls.choose.classList.remove('selected');\n\t\tcursorEl.classList.remove('visible');\n\t\tawait moveCamera(OVERVIEW.s, OVERVIEW.fx, OVERVIEW.fy, 1200);\n\t\tawait wait(3500);\n\t\tworld.classList.add('fade');\n\t\tawait wait(1000);\n\t}\n\n\t/**\n\t * Runs the story over and over.\n\t */\n\tasync function loop() {\n\t\twhile (true) await run();\n\t}\n\n\t/**\n\t * Shows the finished journey straight away, with nothing moving, for anyone who has asked their device\n\t * to reduce motion.\n\t */\n\tfunction showFinal() {\n\t\treset();\n\t\tfor (const [id, c] of Object.entries(NODES)) {\n\t\t\tnodeEls[id].classList.add('show', 'placed');\n\t\t\tnodeEls[id].classList.remove('draft');\n\t\t\tsetPose(id, c.x, c.y, 1);\n\t\t}\n\t\tfor (const el of Object.values(edgeEls)) el.style.strokeDashoffset = '0';\n\t\tshowStep(STEPS.length);\n\t}\n\n\tbuild();\n\tfit();\n\tnew ResizeObserver(fit).observe(viewport);\n\n\tif (matchMedia('(prefers-reduced-motion: reduce)').matches) showFinal();\n\telse loop();\n<\/script>\n<\/body>\n<\/html>\n" },
		{ name: "Editing a step", source: "<!doctype html>\n<html lang=\"en-GB\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Service Studio: editing a step<\/title>\n<!--\n\tA self contained animation of the Service Studio step editor. A step is selected on the canvas, the\n\teditor opens beside it, and the step's name, description and type are changed one at a time. Applying\n\tthe changes updates the step on the canvas. Everything it needs is in this one file, so it can be shared\n\tor opened on its own. To change what is shown, edit the NODES, the EDIT values and the run() timeline in\n\tthe script at the bottom.\n-->\n<style>\n\t:root {\n\t\t--text: #0b0c0c;\n\t\t--secondary-text: #505a5f;\n\t\t--muted: #737373;\n\t\t--border: #b1b4b6;\n\t\t--soft-border: #d8d8d3;\n\t\t--node-border: #c9cac6;\n\t\t--line: #7b8387;\n\t\t--blue: #1d70b8;\n\t\t--blue-tint: #e8f1f8;\n\t\t--green: #00703c;\n\t\t--black: #0b0c0c;\n\t}\n\n\t* {\n\t\tbox-sizing: border-box;\n\t}\n\n\tbody {\n\t\tmargin: 0;\n\t\tpadding: 20px;\n\t\tmin-height: 100vh;\n\t\tdisplay: grid;\n\t\tplace-items: center;\n\t\tbackground: #ffffff;\n\t\tcolor: var(--text);\n\t\tfont-family: 'GDS Transport', arial, sans-serif;\n\t}\n\n\t/* The animation is kept as wide as the window allows, but never so wide that its height runs off the bottom. */\n\t.wrap {\n\t\twidth: min(100%, 1440px, calc((100vh - 40px) * 1.6));\n\t}\n\n\t.sr-only {\n\t\tposition: absolute;\n\t\twidth: 1px;\n\t\theight: 1px;\n\t\tmargin: -1px;\n\t\tpadding: 0;\n\t\toverflow: hidden;\n\t\tclip: rect(0, 0, 0, 0);\n\t\twhite-space: nowrap;\n\t\tborder: 0;\n\t}\n\n\t/* The stage is drawn at a fixed 1440 by 900 and scaled to fit, so every position below is in the same\n\t\tsimple coordinates whatever size the page is viewed at. */\n\t.viewport {\n\t\tposition: relative;\n\t\twidth: 100%;\n\t\taspect-ratio: 1440 / 900;\n\t\toverflow: hidden;\n\t\tbackground: #ffffff;\n\t}\n\n\t.stage {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 1440px;\n\t\theight: 900px;\n\t\ttransform-origin: 0 0;\n\t}\n\n\t/* The window onto the drawing: a square of dotted canvas. What is inside it, the world, is what gets\n\t\tzoomed and moved. */\n\t.canvas {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 900px;\n\t\theight: 900px;\n\t\toverflow: hidden;\n\t\tbackground-image: radial-gradient(circle at 2px 2px, #e6e6e2 1.2px, transparent 1.7px);\n\t\tbackground-size: 30px 30px;\n\t}\n\n\t.world {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\twidth: 900px;\n\t\theight: 900px;\n\t\ttransform-origin: 0 0;\n\t}\n\n\t.fadeable {\n\t\ttransition: opacity 0.6s ease;\n\t}\n\n\t.fadeable.fade {\n\t\topacity: 0;\n\t}\n\n\t/* Softens the right hand edge of the canvas into the white behind the editor. */\n\t.canvas-fade {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 780px;\n\t\twidth: 120px;\n\t\theight: 900px;\n\t\tbackground: linear-gradient(90deg, rgba(255, 255, 255, 0), #ffffff);\n\t\tpointer-events: none;\n\t}\n\n\t.edges {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\tpointer-events: none;\n\t}\n\n\t.edge {\n\t\tfill: none;\n\t\tstroke: var(--line);\n\t\tstroke-width: 1.5;\n\t\tstroke-linecap: round;\n\t}\n\n\t.node {\n\t\tposition: absolute;\n\t\ttop: 0;\n\t\tleft: 0;\n\t\topacity: 0;\n\t\ttransition: opacity 0.4s ease;\n\t}\n\n\t.node.show {\n\t\topacity: 1;\n\t}\n\n\t.inner {\n\t\tposition: relative;\n\t\twidth: 100%;\n\t\theight: 100%;\n\t}\n\n\t.node.pop > .inner {\n\t\tanimation: pop 0.35s ease-out;\n\t}\n\n\t@keyframes pop {\n\t\t0% { transform: scale(1.05); }\n\t\t100% { transform: scale(1); }\n\t}\n\n\t.step-body {\n\t\tdisplay: flex;\n\t\talign-items: center;\n\t\tjustify-content: center;\n\t\tpadding: 0 10px;\n\t\tbackground: #ffffff;\n\t\tborder: 1px solid var(--node-border);\n\t\tborder-radius: 6px;\n\t\tfont-size: 0.875rem;\n\t\tfont-weight: 700;\n\t\tline-height: 1.2;\n\t\ttext-align: center;\n\t\ttrans
